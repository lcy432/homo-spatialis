mapping:
  osm:
    split_food_queries:
    - '41860'
  b_housing:
    method: housing_rent_conditional
    version: '1'
    target_population: new_market_proxy
    min_unweighted_n: 30
    quantiles:
    - '0.10'
    - '0.25'
    - '0.50'
    - '0.75'
    - '0.90'
    replicate_weights: 80
  b_commute:
    method: commute_by_residence_puma
    version: '1'
    min_unweighted_n: 30
  b_jobs:
    method: job_hours_wfh_by_occupation_group
