# Installed by `make setup`. The secret-detection hooks exist because
# CLAUDE.md hard rule 2 (never commit a key) is unrecoverable once violated:
# the value stays in history forever.
# runs/ and the doc archives are frozen evidence (saved diffs, logs, review
# copies of old code): formatters would rewrite them, so only the secret and
# size checks look there.
# tests/fixtures/intake/cache holds raw-file samples addressed by SHA-256
# (intake-02): the whitespace fixers would change their bytes and break them.
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.5
    hooks:
      - id: ruff-check
        args: [--fix]
        exclude: ^(runs|docs/history|docs/design/(history|prompts))/
      - id: ruff-format
        exclude: ^(runs|docs/history|docs/design/(history|prompts))/

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: detect-private-key
      - id: check-added-large-files
        # 50 MB is the threshold at which CLAUDE.md says to revisit git-lfs.
        args: [--maxkb=51200]
      - id: check-yaml
      - id: check-toml
      - id: end-of-file-fixer
        exclude: ^(runs|docs/history|docs/design/(history|prompts)|tests/fixtures/intake/cache)/
      - id: trailing-whitespace
        exclude: ^(runs|docs/history|docs/design/(history|prompts)|tests/fixtures/intake/cache)/
