[project]
name = "homo-spatialis"
version = "0.1.0"
description = "Individual-centered city life simulation with LLM planning and an explicit economic model"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
    # M1 data acquisition and cleaning
    "pandas>=2.2",
    "openpyxl>=3.1",      # OEWS ships XLSX
    "httpx>=0.27",
    "tenacity>=8.3",
    # exchange format and downstream analysis
    "pyarrow>=16.0",
    "polars>=1.0",
    # M2 welfare model, M5 estimation
    "numpy>=1.26",
    "scipy>=1.13",
    # config, validation, secrets
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    # M4 agent layer: both bases go through the OpenAI-compatible client
    "openai>=1.40",
    # figures
    "matplotlib>=3.8",
    "xlogit>=0.2.7",
    "claude-agent-sdk>=0.2.168",
    "langgraph>=1.0",
    "langgraph-checkpoint-sqlite>=2.0",
    "fastapi>=0.115",
    "portalocker>=2.10",
    "uvicorn>=0.30",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "ruff>=0.6",
    "pre-commit>=3.7",
    "pytest-xdist>=3.8.0",
]

[tool.uv]
# This is an application, not a library: no build step, src/ is put on the
# path by pytest and by scripts/_bootstrap.py.
package = false

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
addopts = "-q --strict-markers -m 'not live and not slow'"
markers = [
    "live: hits a real language-model or data endpoint; deselected by default, run with -m live",
    "slow: research-line tests (M2/M3/M5, see RESEARCH_TESTS in tests/conftest.py); deselected by default, run with -m slow",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N", "RUF"]
# E501 off: docstrings and comments in this repo are Chinese, where character
# width and character count disagree and the limit fires spuriously.
#
# RUF001/002/003 off: these flag "ambiguous" unicode that resembles ASCII, which
# in practice means every full-width comma and bracket in a Chinese comment.
# The rule is aimed at homoglyph attacks in identifiers; here it would fire
# several hundred times on ordinary prose and train everyone to ignore ruff.
ignore = ["E501", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
