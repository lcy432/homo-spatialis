[project]
name = "homo-spatialis"
version = "0.1.0"
description = "Rebirth Simulator: a computable spatial welfare model, used as a ground-truth ruler for preference recovery in large language models"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    # M1 data acquisition and cleaning
    "pandas>=2.2",
    "openpyxl>=3.1",      # OEWS ships XLSX
    "httpx>=0.27",
    "tenacity>=8.3",
    # exchange format and downstream analysis
    "pyarrow>=16.0",
    "polars>=1.0",
    # M2 welfare model, M5 estimation
    "numpy>=1.26",
    "scipy>=1.13",
    # config, validation, secrets
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    # M4 agent layer: both bases go through the OpenAI-compatible client
    "openai>=1.40",
    # figures
    "matplotlib>=3.8",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "ruff>=0.6",
    "pre-commit>=3.7",
]

[tool.uv]
# This is an application, not a library: no build step, src/ is put on the
# path by pytest and by scripts/_bootstrap.py.
package = false

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q --strict-markers -m 'not live'"
markers = [
    "live: hits a real language-model or data endpoint; deselected by default, run with -m live",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N", "RUF"]
# E501 off: docstrings and comments in this repo are Chinese, where character
# width and character count disagree and the limit fires spuriously.
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
