# 输入目录（E3 输入体验收敛，DECISIONS/0046）：E3B 六城资料包的职业分类索引与搜索词、学历 / 证书 / 相关经验问题、兴趣与菜系的分组。
#
# 这份小配置只引用资料包 configs/product/e3b_us_v1_pack.yaml 里已有的职业概念、资格编号与兴趣 / 菜系的键，不新增职业、资格、活动、
# 评分类别或系数，也不改住房、工资、税或活动资料（资料包与它的内容身份不变）。代码在 src/product/input_catalog.py（加载、核对与
# 搜索）与 src/product/qualifications.py（资格换算）。
#
# * 分组只用于浏览：每个职业恰好一个主分组，不改变职业映射。搜索词是明确维护的数据（不靠在线翻译）：目录发布的搜索词 = 资料包里的
#   名称与别名 + 这里的 search（英文显示名、常见叫法，例如“程序员”）。
# * requires：这个职业的开局岗位要求的资格（BLS EP 表 5.4 的典型入职教育与相关经验 → 资格，与 product.realdata.occupations.Scope
#   的 required 一致，测试按冻结资料逐个核对）。只供显示与审阅提示；职业本身不授予任何资格。
# * 学历按“至少达到”换算（education_at_least_v1，与 Scope.from_confirmed 同一条规则）：选了一项就授予它和它以下各项的 ability；
#   “中学后非学位证书”是职业专属的，单独在证书里问，学历不授予它。level 是 configs/intake/occupations_us_v1.yaml 教育表里的等级。
# * 相关经验（related_experience_v1）：只在选中的职业属于 applies_to 时问；在 related 列出的职业里做满 min_years 年就授予 ability
#   （与 Scope.from_confirmed 一致：EP “Less than 5 years” → 至少 1 年，related 来自 occupations_us_v1.yaml）。
catalog:
  catalog_id: input-catalog.e3b.us-v1
  catalog_version: e3-input-catalog-v1
  pack_id: pack.e3b.us-v1
  sections:
    education: true
    certificates: true
