# 运行前检查、资料性质与目录编译用到的资料包实体（pack.e3b.us-v1）：资料包里的固定说明（preflight_text：目录调查范围与开局的
# 时间、精力说明；范围、开局情景与本版不支持用能力清单的 capability 实体）、登记的模型
# 设定（assumption，按带着它的机会或治疗条目编号）、共同先验、通勤方式的条件、家务任务、治安资料、来源事实、税策略与税规则。
