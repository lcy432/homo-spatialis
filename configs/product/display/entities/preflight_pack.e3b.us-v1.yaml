  household_task:
    cleaning:
      label:
        en: 'Cleaning: cleaning a one-bedroom home yourself (sweeping, mopping, tidying)'
        zh: 打扫：自己打扫一居室（扫地、拖地、整理）
    laundry:
      label:
        en: 'Laundry: without a device or service, washing by hand or at a self-service laundromat, including drying, folding and putting away'
        zh: 洗衣：没有设备或服务时，自己手洗或去自助洗衣店，连同晾晒、叠放与收纳
  preflight_text:
    catalog_scope:
      label:
        en: Convenience devices and paid services come from the real data pack (ENERGY STAR models and local service-occupation wages); no extra synthetic candidates are made up here
        zh: 便利设备与人工服务来自真实资料包（ENERGY STAR 型号与本都会区服务职业工资），不在这里另编合成候选
    start_energy_note:
      label:
        en: Each month you can take on activities worth 250 burden points (a uniform model setting in this version); the more satisfying the previous year, the more the next year allows, up to 10% more
        zh: 每月可承受 250 个负担点的活动（本版统一的模型设定）；上一年过得越满意，下一年最多多 10%
    start_time_note:
      label:
        en: About 365 hours a month can be scheduled (12 hours a day for sleep and basic rest are already set aside) — a uniform model setting in this version, not a measurement of you
        zh: 每月可安排约 365 小时（每天 12 小时的睡眠与基本休息已经预留在外）——本版统一的模型设定，不是对你的测量
  safety_input:
    chi:
      coverage:
        en: 'FBI estimated totals: reporting agencies cover 96.7% of the population, and the FBI estimates the rest'
        zh: FBI 估计总数：实际报告的机构覆盖 96.7% 人口，其余由 FBI 估算
      residence:
