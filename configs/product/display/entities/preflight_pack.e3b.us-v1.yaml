        zh: 芝加哥都会区的伊利诺伊州部分；居住地与工作地都在伊利诺伊州（印第安纳州的县不支持）
    tax.us2024.nyc:
      not_modeled.0:
        en: The federal and state tax tables (in $50 brackets at lower incomes, using the bracket midpoint) are not used; the rate schedules are used throughout, a difference of a few dollars
