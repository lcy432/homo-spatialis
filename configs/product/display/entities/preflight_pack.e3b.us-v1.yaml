        zh: 只有工资收入：利息、股息、资本利得与副业收入不在支持范围
      not_modeled.3:
        en: Withholding is recomputed monthly on year-to-date wages (less early in the year, more late in the year), so the yearly total equals the tax owed for the year; there is no year-end refund or extra payment
        zh: 预扣按全年累计工资每月重算（年初少扣、年底多扣），全年合计等于全年应缴；没有年终退税或补税的时点
      not_modeled.4:
        en: The elimination of the Illinois personal exemption when AGI exceeds 250,000 is not modeled
        zh: 伊利诺伊州个人免税额在 AGI 超过 250,000 时取消，没有建模
      not_modeled.5:
        en: Illinois credits such as the EITC are not modeled
        zh: 伊利诺伊州 EITC 等抵免没有建模
      residence_scope:
