  tax_policy:
    tax.us2024.ca:
      not_modeled.0:
        en: The federal and state tax tables (in $50 brackets at lower incomes, using the bracket midpoint) are not used; the rate schedules are used throughout, a difference of a few dollars
        zh: 联邦与州的税表（收入较低时按 50 美元一档、取档中点）没有用，统一用税率表，差几美元
      not_modeled.1:
        en: Credits (the earned income tax credit EITC and others), pre-tax deductions (401(k), health insurance premiums) and itemized deductions are not modeled
        zh: 抵免（劳动所得抵免 EITC 等）、税前扣除（401(k)、医疗保险费）与逐项扣除都没有建模
      not_modeled.2:
        en: 'Wage income only: interest, dividends, capital gains and side income are outside the supported scope'
        zh: 只有工资收入：利息、股息、资本利得与副业收入不在支持范围
      not_modeled.3:
        en: Withholding is recomputed monthly on year-to-date wages (less early in the year, more late in the year), so the yearly total equals the tax owed for the year; there is no year-end refund or extra payment
        zh: 预扣按全年累计工资每月重算（年初少扣、年底多扣），全年合计等于全年应缴；没有年终退税或补税的时点
      not_modeled.4:
        en: The California personal exemption credit and its phase-out at high incomes are not modeled
        zh: 加州个人免税额抵免与它在高收入时的递减没有建模
      not_modeled.5:
        en: The California renter's credit, the California EITC and the young child tax credit are not modeled
        zh: 加州租房者抵免、加州 EITC 与幼儿抵免没有建模
      residence_scope:
        en: California residents working in California (the Los Angeles and San Francisco metro areas are entirely in California)
        zh: 加州居民、工作地在加州（洛杉矶都会区与旧金山都会区全部在加州）
    tax.us2024.il:
      not_modeled.0:
