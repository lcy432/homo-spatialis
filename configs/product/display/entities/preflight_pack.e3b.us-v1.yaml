      not_modeled.4:
        en: 'The New York State recapture of tax benefits when AGI exceeds 107,650 (the supplemental tax) is not modeled: New York State tax is understated for high earners'
        zh: 纽约州 AGI 超过 107,650 时的税收优惠回收（supplemental tax）没有建模：高收入的人纽约州税少算
      not_modeled.5:
        en: New York State and New York City household credits, the school tax credit and the EITC are not modeled
        zh: 纽约州与纽约市的家庭抵免、学校税抵免与 EITC 没有建模
      not_modeled.6:
        en: New York State short-term disability insurance is handled as a yearly total of 31.20 (in reality at most 60 cents per week)
        zh: 纽约州短期残障保险按年合计 31.20 处理（真实是每周最多 60 美分）
      residence_scope:
