  common_prior:
    leisure_index:
      label:
        en: Basic leisure conditions (common prior)
        zh: 基本休闲条件（共同先验）
      meaning:
        en: A small amount of basic leisure that comes with living in a city, 0–10; the six cities have no comparable data, so this is a registered common prior. Most leisure satisfaction comes from activities actually attended (fitness, courses, hobbies and the like are arranged and paid for separately)
        zh: 住在一座城市就有的少量基本休闲条件，0–10；六城没有可比资料，这里是登记的共同先验。主要的休闲满足来自实际参加的活动（健身、课程、爱好等另外安排、另外付费）
  commute_rule:
    US:CBSA2023:16980.drive:
      label:
        en: Driving requires car access in use (car_access, an opportunity paid monthly); each round trip also pays for fuel = round-trip minutes / 60 × 25 miles per hour ÷ 23.4 miles per gallon × gasoline at 3.731 dollars per gallon; no cap; parking and tolls are not modeled
        zh: 开车要有在用的用车权（car_access，一项按月付费的机会）；每次往返另付油费 = 往返分钟 / 60 × 25 英里每小时 ÷ 23.4 英里每加仑 × 汽油 3.731 美元每加仑；不封顶；停车与过路费没有建模
    US:CBSA2023:16980.transit:
      label:
        en: 'Chicago Transit Authority (CTA): single ride 2.5, two single rides per round trip 5.0; the 75 monthly pass is treated as the monthly cap; the fare table in effect since 2023-02-20 (still current when retrieved); the single fare uses the rail (''L'') fare, bus 2.25'
        zh: 芝加哥交通局（CTA）：单程 2.5，每次往返两次单程 5.0；月票 75 当作每月封顶；2023-02-20 起的票价表（获取时仍是现行表）；单程取轻轨（'L'）票价，公交 2.25
    US:CBSA2023:16980.walk_bike:
      label:
        en: 'Walking or cycling: no conditions of use, no cap; each round trip counts as 0 (bicycles, bike-share and shoes are not costed)'
        zh: 步行或骑车：没有使用条件、不封顶；每次往返记 0（不计自行车、共享单车与鞋的费用）
    US:CBSA2023:26420.drive:
