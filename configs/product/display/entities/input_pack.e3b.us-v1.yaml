  hard_requirement:
    housing.max_commute_roundtrip:
      compiles_to:
        en: 'E1 hard requirement: in the housing category, the longest round-trip minutes in the commute execution record ≤ the given minutes (checked every month; months without days on site count as 0)'
        zh: E1 硬要求：住房类别、通勤执行记录里最长的往返分钟 ≤ 给定分钟（每个月检查；没有到岗的月份是 0）
      label:
        en: Round trip between home and the employment center no longer than (minutes)
        zh: 住处到就业中心的往返时间不超过（分钟）
      unit:
        en: minutes
        zh: 分钟
      verification:
        en: 'The round-trip minutes from the home actually lived in are checked every month: met, not met and cannot be determined are reported separately; this does not enter the score and does not block plans'
        zh: 每月检查实际所住住房的往返分钟：满足、不满足、无法判断单独报告；不进分数，也不拦截计划
  health_option:
    agree:
      label:
        en: Describes me
        zh: 符合我
      meaning:
        en: This statement describes the user
        zh: 这句话符合用户自己
    disagree:
      label:
        en: Does not describe me
        zh: 不符合我
      meaning:
        en: This statement does not describe the user
        zh: 这句话不符合用户自己
    no_clear_tendency:
      label:
        en: No clear tendency
        zh: 无明显倾向
      meaning:
        en: The user has no clear tendency on this question
        zh: 用户在这一题上没有明显倾向
    unsure:
      label:
        en: Not sure yet
        zh: 暂不确定
      meaning:
        en: 'The user is not sure yet: there is no explicit instruction for this item'
        zh: 用户暂不确定——没有这一项的明确指令
  health_question:
    hc_more_pay_more_sick_risk:
      agree_meaning:
        en: Willing to accept a higher chance of getting sick and needing rest for a little more income
        zh: 愿意为多一点收入接受更高的生病与休息可能
      disagree_meaning:
        en: Not willing to accept a higher chance of getting sick and needing rest for a little more income
        zh: 不愿意为多一点收入接受更高的生病与休息可能
      text:
        en: One arrangement earns a little more money, but also makes it more likely that you get sick and need a few days of rest. I am willing to choose it.
        zh: 一种安排能多赚一点钱，但生病、需要休息几天的可能也更高。我愿意选择它。
    hc_reserve_for_health_costs:
      agree_meaning:
        en: Willing to postpone non-urgent purchases and set money aside for possible health costs first
        zh: 愿意推迟不急需的消费，先为可能的健康开支留钱
      disagree_meaning:
        en: Not inclined to postpone non-urgent purchases for possible health costs
        zh: 不倾向为可能的健康开支推迟不急需的消费
      text:
        en: To be ready for possible health costs, I am willing to postpone a purchase I want but do not urgently need, and set some money aside first.
        zh: 为了应对可能发生的健康开支，我愿意推迟一次想要、但并不急需的消费，先留一笔钱。
    hc_wait_for_clear_risk_info:
      agree_meaning:
        en: When health-risk information is unclear, willing to give up a small immediate gain and wait until things are clear
        zh: 健康风险信息不清楚时，愿意先放弃一点眼前收益、等了解清楚
      disagree_meaning:
        en: When health-risk information is unclear, not inclined to give up an immediate gain in order to wait
        zh: 健康风险信息不清楚时，不倾向为了等待而放弃眼前收益
      text:
        en: When information about a health risk is still unclear, I am willing to give up a small immediate gain and decide once things are clear.
        zh: 健康风险的信息还不清楚时，我愿意先放弃眼前的一点收益，等了解清楚再决定。
  leaf:
    daily_convenience:
      definition:
        en: Whether phone and internet service and household supplies are easy to get, and whether daily chores are easy.
        zh: 通信联网、家用日耗品是否方便获得，以及日常杂务是否省心。
      label:
        en: Daily support and convenience
        zh: 日常支持与便利
      note:
        en: Chores count by how many hours you actually do less yourself (devices and human services are two ways to get there and are not scored separately); phone, home internet and household supplies count by the months actually bought, and buying two of the same item counts no more; it is relative importance, not a budget or an order to buy; it covers phone service and household supplies beyond the old “daily convenience”, so old confirmations need a new review
        zh: 杂务看本人实际少做了多少小时（设备与人工服务是两种实现方式，不分别打分）；通信、居家联网与家用日耗品看实际买到的月份，同一项买两份不多算；它是相对重要程度，不是预算或必须购买的指令；含义比旧版“日常生活便利”多了通信与日耗品，旧的确认要重新审阅
    food_life:
      definition:
        en: Whether the complete food plan you actually eat (cooking at home or eating out) is fresh and matches the taste you confirmed
        zh: 实际吃的完整食品方案（自己做、外食都可以）新鲜不新鲜、合不合你确认的口味
      label:
        en: Food
        zh: 饮食生活
      note:
        en: Only fresh meals and the cuisines you confirmed are evaluated; having enough to eat is a basic guarantee and earns nothing extra; price, restaurant tier and how often you eat out do not mean better; preparation time counts in the time budget
        zh: 只评价新鲜餐与你确认的菜系；吃饱是基本保障，不另加分；价格、餐馆档次与外食次数不等于更好；准备时间算在时间账里
    housing_condition:
      definition:
        en: 'The condition of the home you actually live in: whether there is enough space, and how good it is among homes of its kind'
        zh: 实际住的那一处房子本身的条件：空间够不够用、同类房子里条件好不好
      label:
        en: Housing condition
        zh: 居住条件
      note:
        en: Only the home itself counts; rent, commuting and the area's safety and environment are not in this item (safety and environment are counted separately by the area you live in); the old “living space (floor area only)” meant something different, so old confirmations need a new review
        zh: 只看房子本身；房租、通勤、地区的安全与环境不在这一项（安全、环境按住处所在片区另算）；旧版的“居住空间（只看面积）”含义不同，旧的确认要重新审阅
    personal_enjoyment:
      definition:
        en: Beyond other living costs, the satisfaction of personal consumption such as clothing and personal care.
        zh: 在其他生活开支之外，获得衣着、个人护理等个人消费的满足。
      label:
        en: Personal consumption and enjoyment
        zh: 个人消费与享受
      note:
        en: Evaluated by the standard personal consumption basket (clothing, shoes and accessories, personal care) you actually get each month, not by how much you spend; the same basket costing more does not change this item, only buying less lowers it; it is an explainable model abstraction and does not measure a real person's happiness; massages and home comfort goods are no longer counted separately; the meaning differs from the old version, so old confirmations need a new review
        zh: 按每月实际获得的标准个人消费篮子（衣着、鞋履与配饰、个人护理）评价，不按花了多少钱；同样的篮子涨价不改变这一项，买得少才会少；是可解释的模型抽象，没有测量真实人的幸福感；不再单独计算按摩或居家舒适用品；含义与旧版不同，旧的确认要重新审阅
  leisure_category:
    arts_culture:
      label:
        en: Arts and culture
        zh: 艺术与文化
    culinary:
      label:
        en: Food and cooking activities
        zh: 美食活动
    fitness:
      label:
        en: Fitness
        zh: 健身
    music:
      label:
        en: Music
        zh: 音乐
    racket_sports:
      label:
        en: Racket sports
        zh: 球拍运动
