  capability:
    health_questionnaire:
      common_prompt:
        en: Assume your basic living needs are covered, and judge whether each choice below describes you. There are no right answers.
        zh: 假设基本生活已有保障，判断下面的选择是否符合你。没有正确答案。
      rules.0:
        en: No total health score is calculated, and no disease probability, pain weight, treatment effect, willingness to pay or refusal of treatment is inferred
        zh: 不计算总健康分，不推断患病概率、疼痛权重、疗效、愿付金额或拒绝治疗
      rules.1:
        en: Health answers take none of the six areas' 100 points and are not a seventh scoring weight; they only inform the clones' planning and do not change illness rules, γ, H, accounts or satisfaction
        zh: 健康回答不占六维 100 分，也不是第七个评分权重；只供分身做计划，不改变疾病规则、γ、H、账目或满足感
      rules.2:
        en: The questions are provisional wording, not tested in cognitive interviews or validated as a scale
        zh: 题目是暂定文案，没有经过认知访谈或量表验证
      unanswered_rule:
        en: An unanswered question is stored as “not answered”, separately from “not sure yet”; both mean there is no explicit instruction for that item, and no middle value is filled in
        zh: 没有作答另存为“未答”，与“暂不确定”分开；两者都表示没有这一项的明确指令，不补中间值
    interests:
      leisure_states.0:
        en: 'Not answered: no explicit information on this item, evaluated with neutral rules; it is never treated as choosing the “generic evaluation”'
        zh: 未答：没有这一项的明确信息，按中性规则评价；不会被当成“通用评价”的选择
      leisure_states.1:
        en: 'Not sure yet: evaluated with neutral rules'
        zh: 暂不确定：按中性规则评价
      leisure_states.2:
        en: 'Explicitly no fixed hobby: evaluated with neutral rules'
        zh: 明确没有固定爱好：按中性规则评价
      leisure_states.3:
        en: 'Use the generic leisure evaluation: try whatever suitable the city offers (evaluated with neutral rules)'
        zh: 采用通用休闲评价：城市有什么合适的就体验什么（按中性规则评价）
      leisure_states.4:
        en: 'Describe in words: candidates are first formed from the vocabulary, and only the categories you choose enter the evaluation; unrecognized descriptions are kept as written and not evaluated in this version'
        zh: 用文字描述：先按词表形成候选，你选中的类别才进入评价；没认出的描述原样保留，本版不评价
      matching_note:
        en: 'A confirmed interest only brings moderately higher satisfaction for the same actual time spent (model assumption: 50% more, with a cap); a confirmed cuisine only makes meals to your taste that you actually eat count a little more. These coefficients are publicly registered model assumptions, not measurements of you; they do not change your points, cash or qualifications, and do not make expensive things automatically better'
        zh: 确认的兴趣只在同样的实际参与时间下带来适度更高的满足（模型假设：多 50%，有上限）；确认的菜系只让实际吃到的合口味餐多计一点。 这些系数是公开登记的模型假设，不是对你个人的测量；不改变你的点数、现金或资格，也不让贵的东西自动更好
      taste_states.0:
        en: 'Not answered: evaluated with neutral rules'
        zh: 未答：按中性规则评价
      taste_states.1:
        en: 'Not sure yet: evaluated with neutral rules'
        zh: 暂不确定：按中性规则评价
      taste_states.2:
        en: 'Explicitly no taste preference: evaluated with neutral rules'
        zh: 明确没有口味偏好：按中性规则评价
      taste_states.3:
        en: 'Describe in words: candidates are first formed from the vocabulary, and only the cuisines you choose enter the food evaluation; brands and other requirements are only kept'
        zh: 用文字描述：先按词表形成候选，你选中的菜系才进入饮食评价；品牌与其他要求只留存
    limits:
      item.0:
        en: 'City data come from public sources and registered model settings; life rules, scoring and evaluation parameters are synthetic exploratory settings: the results do not rank real cities and are not real-world recommendations'
        zh: 城市资料来自公开来源与登记的模型设定；生活规则、评分与评价参数是合成探索设定：结果不排序真实城市，也不是现实推荐
      item.1:
        en: The safety background is converted from each metro area's 2024 crime statistics (a statistical proxy, not a person's probability of experiencing crime; for New York it covers only the New York State part of the metro area); the leisure background is a setting shared by the six cities; treatment prices are a shared assumption; eating-out, services, device lifetimes and activity prices include registered model settings
        zh: 安全背景按各都会区 2024 年犯罪统计换算（统计代理，不是个人遭遇犯罪的概率；纽约只覆盖都会区的纽约州部分）；休闲背景是六城共同设定；治疗价格是共同假设；外食、服务、设备寿命与活动价格含登记的模型设定
      item.2:
        en: The offline planner is a controllable mock and does not represent a real large language model's ability or understanding of preferences
        zh: 离线规划器是可控的 mock，不代表真实大语言模型的能力或偏好理解
      item.3:
        en: The questionnaire wording and reference improvement ranges are provisional drafts, not tested in cognitive interviews or validated as a scale
        zh: 问卷文案与参考改善范围是暂定稿，没有做认知访谈与量表验证
    points:
      canonical_form:
        en: A whole number after reducing (30) or numerator/denominator (50/3); calculations and comparisons use it, display rounds to 1 decimal place, and displayed values never feed back into calculations
        zh: 约分后的整数（30）或 分子/分母（50/3）；计算与比较都用它，显示四舍五入到 1 位小数，显示值不回流计算
      manual_entry:
        en: Manual entries are parsed as exact decimals with at most 2 decimal places (the step is not a measurement precision); fractions in lowest terms are also accepted (for example 50/3)
        zh: 手工输入按精确十进制解析，最多 2 位小数（步长不是测量精度）；也接受规范分数写法（例如 50/3）
      rules.0:
        en: The six areas must add up to exactly 100; no values are pre-filled, no personality presets are offered, and other items are never reduced proportionally
        zh: 六维合计必须精确等于 100；不预填数值、不提供人格套餐，不自动按比例扣减其他项
      rules.1:
        en: An equal split is generated only when the user chooses “split equally” (50/3 for each of the six areas, 25 for each material item), so items listed first get no extra points
        zh: 只有用户主动选择“平均分配”才生成均分（六维每项 50/3、物质每项 25），不让排在前面的项目多拿分
      rules.2:
        en: An explicit 0 is a provided value; “not answered”, “explicitly no strong view” and “not sure yet” are never turned into 0 or an equal share automatically
        zh: 明确 0 是已提供的数值；“未答”“明确无所谓”“暂不确定”都不会被自动换成 0 或均分
      rules.3:
        en: When material life is positive, the four material items must also add up to exactly 100; when material life is explicitly 0, the breakdown does not apply and no four answers are invented
        zh: 物质父项为正时，物质四项也必须精确合计 100；物质父项明确为 0 时细分不适用，不伪造四个回答
      rules.4:
        en: 'Since material life went from three items to four and the meaning of food widened, old confirmations cannot be carried over by adding a 0 or redistributing points: please review and confirm again'
        zh: 物质从三项改成四项、饮食的含义扩大之后，旧的确认不能补 0 或重新分配点数沿用：请重新审阅并确认
    start_scenario:
      item.0:
        en: 'This is a simplified scenario of moving to a candidate city and starting over: it starts in year 1, healthy, with no belongings, no courses in progress and no savings goal'
        zh: 这是一次搬到候选城市重新开始的简化情景：从第 1 年、健康、没有已有物品、没有在学课程、没有资金目标开始
      item.1:
        en: Real old furniture, medical history and ongoing courses are not included yet; this is an assumption of the simulation, not a judgement about your real situation
        zh: 现实中的旧家具、病史与在学课程暂未纳入；这是模拟的假设，不是对你现实情况的判断
      item.2:
        en: The same you has the same age, cash, abilities and base time and energy in every city and every clone; specific jobs in a city are matched against the local catalogue
        zh: 同一个你在各城市、各个分身里的年龄、现金、能力与基础时间精力都相同；城市里的具体岗位按当地目录匹配
    unsupported:
      item.0:
        en: Multi-person households, non-wage income (interest, dividends, side jobs), shared household assets, buying a home and loans
        zh: 多人家庭、非工资收入（利息、股息、副业）、家庭共同资产、买房与贷款
      item.1:
        en: Tax credits, pre-tax deductions and itemized deductions; residents of the New York metro area outside New York City, the Indiana part of the Chicago metro area, and cross-state combinations
        zh: 税收抵免、税前扣除与逐项扣除；纽约市以外的纽约都会区居民、芝加哥都会区的印第安纳部分、跨州组合
      item.2:
        en: Parking fees and distance-based transit fares; San Francisco transit fares (the official website refused access)
        zh: 停车费与按距离计的公交票价；旧金山的公交票价（官方网站拒绝访问）
      item.3:
        en: Real Chicago Park District activities (they need date windows, whole-session registration and age eligibility, which the engine does not support yet)
        zh: 芝加哥公园管理局的真实活动（需要日期窗口、整期报名与年龄资格，引擎暂不支持）
      item.4:
        en: Scoring of brands, preparation, tier, service quality and home-visit concerns (the text is only recorded)
        zh: 品牌、制作方式、档次、服务质量与上门顾虑的评分（只记录原文）
      item.5:
        en: Interview-style input (only the interfaces for sources and evidence references are kept)
        zh: 访谈式输入（只保留来源与证据引用接口）
