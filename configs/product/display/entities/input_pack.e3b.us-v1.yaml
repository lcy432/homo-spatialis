  dimension:
    commute:
      definition:
        en: How the round-trip time between home and work and the number of days you actually go to work affect your life
        zh: 住处到工作地点的往返时间与实际出门上班的次数对生活的影响
      label:
        en: Ease of commuting
        zh: 交通便捷程度
      reference_improvement:
        en: 'Reference situation: with 20 days on site a month, the daily round trip shrinking from 70 to 30 minutes'
        zh: 参考情境：每月到岗 20 次时，每天往返从 70 分钟缩短到 30 分钟
      support_note:
        en: Scored on the round-trip minutes from the home you actually live in and the days you actually go to work; non-work trips are not detailed in this version
        zh: 按实际所住住房的往返分钟与实际到岗次数评分；非工作出行本版没有细化
    environment:
      definition:
        en: Background conditions of air, climate and the urban environment
        zh: 空气、气候与城市环境的背景条件
      label:
        en: Environment
        zh: 环境
      reference_improvement:
        en: 'Reference situation: a synthetic environment index rising from 4 to 8 (0–10, comparable only among this set of synthetic cities)'
        zh: 参考情境：合成环境指数从 4 提高到 8（0–10，只在本组合成城市之间可比）
      support_note:
        en: This version has only the city's background conditions; clones cannot improve it by acting
        zh: 本版只有城市背景条件，分身不能行动改善它
    leisure:
      definition:
        en: The city's basic leisure conditions, plus exercise, shows and other activities you actually take part in
        zh: 城市基础休闲条件，加上实际参加的锻炼、演出等活动
      label:
        en: Leisure
        zh: 休闲
      reference_improvement:
        en: 'Reference situation: from no activities at all each month to going to the gym 8 times a month'
        zh: 参考情境：从每月不参加任何活动，到每月去 8 次健身房
      support_note:
        en: Only activities that actually happen count; matching specific hobbies to geography is not in this version
        zh: 只算实际发生的活动；具体爱好与地理的匹配本版没有
    material:
      definition:
        en: 'What you actually get from consumption: the condition of your home, whether food is fresh and to your taste, whether phone, internet and household supplies are convenient, whether daily chores are easy, and clothing and personal care (split into four items inside)'
        zh: 住的房子条件、吃得是否新鲜合口味、通信联网与日用品是否方便、日常杂务是否省心、衣着与个人护理等实际消费得到的条件（内部再分四项）
      label:
        en: Material life
        zh: 物质生活
      reference_improvement:
        en: 'Reference situation: from a one-bedroom far away, eating mostly rice, flour and canned food and doing all the laundry and cleaning yourself, to three fresh-ingredient meals a day and about 18 fewer hours of housework a month (one step of improvement in this version''s synthetic model)'
        zh: 参考情境：从远处一居室、以米面罐头为主、洗衣打扫全部自己做，改善到每天三顿新鲜食材、每月少做约 18 小时家务（本版合成模型里的一档改善）
      support_note:
        en: Housing condition, food, daily support and convenience, and personal consumption and enjoyment are all scored on actual life; other material needs such as storage are not in this version
        zh: 居住条件、饮食生活、日常支持与便利、个人消费与享受四项都按实际生活评分；储物等其他物质需求本版没有
    opportunity:
      definition:
        en: The career and growth conditions the city offers, plus new abilities you actually learn in your life
        zh: 城市提供的职业与成长条件，加上你在生活中实际学到的新能力
      label:
        en: Opportunity
        zh: 发展机会
      reference_improvement:
        en: 'Reference situation: finishing a 12-month qualification course within a year, or the city''s opportunity conditions rising from a synthetic index of 4 to 8'
        zh: 参考情境：在一年里学完一门 12 个月的资格课程，或城市发展条件从合成指数 4 提高到 8
      support_note:
        en: City background + the learning you actually take part in; certificates themselves, job changes and pay rises earn nothing extra
        zh: 城市背景 + 实际参加的学习；证书本身、换岗与涨薪不另加分
    safety:
      definition:
        en: Public safety conditions in the city
        zh: 城市的公共安全条件
      label:
        en: Safety
        zh: 安全
      reference_improvement:
        en: 'Reference situation: a synthetic safety index rising from 4 to 8 (0–10, comparable only among this set of synthetic cities)'
        zh: 参考情境：合成安全指数从 4 提高到 8（0–10，只在本组合成城市之间可比）
      support_note:
        en: This version has only the city's background conditions; clones cannot improve it by spending or acting
        zh: 本版只有城市背景条件，分身不能花钱或行动改善它
