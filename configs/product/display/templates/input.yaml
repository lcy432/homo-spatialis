    zh: 暂不确定
  input.catalog.state.experience.provided.meaning:
    en: Whether a requirement is met is judged from the occupations and years you enter; entering no experience means you have no related experience
    zh: 按填写的职业与年数判断是否满足；不填任何经历表示没有相关经验
  input.catalog.state.experience.provided.name:
    en: Answered
    zh: 已回答
  input.catalog.state.experience.unanswered.meaning:
    en: Grants no related experience
    zh: 不授予相关经验
  input.catalog.state.experience.unanswered.name:
    en: Not answered
    zh: 未答
  input.catalog.state.experience.unsure.meaning:
    en: Grants no related experience
    zh: 不授予相关经验
  input.catalog.state.experience.unsure.name:
    en: Not sure yet
    zh: 暂不确定
  input.catalog.taste.note:
    en: Pick as many as you like, or skip (skipping means not answered); the cuisines you pick are used for the food evaluation directly, no text needed. “No taste preference” and “not sure yet” can be chosen on their own
    zh: 可以多选，也可以跳过（跳过就是未答）；选中的菜系直接用于饮食评价，不需要写文字。没有口味偏好和暂不确定可以单独选
  input.interests.selected.review:
    en: '{label}: picked from the panel {names}'
    zh: '{label}：从面板选中 {names}'
  input.item.abilities.note.v2:
    en: Comes only from your answers about highest education, occupational certificates and related experience (or the compatible item-by-item qualification answers); never granted automatically from a job title, free text or search words
    zh: 只来自你回答的最高学历、职业证书与相关经验（或兼容的逐项资格确认），不从职业称呼、自由文字或搜索词自动授予
  input.occupation.catalog_expired.impact:
    en: A choice made in the old catalog cannot be reused as is; the occupation is not confirmed yet
    zh: 旧目录里的选择不能直接沿用，职业还没有确认
  input.occupation.catalog_expired.message:
    en: This occupation was chosen from a different version of the occupation catalog, and the catalog has since been updated
    zh: 这个职业是按另一版职业目录选的，目录已经更新
  input.occupation.catalog_expired.next:
    en: Choose the occupation again from the current catalog
    zh: 按现在的目录重新选一次职业
  input.occupation.catalog_missing.message:
    en: You have not yet chosen your main work from the occupation catalog
    zh: 还没有从职业目录里选你主要做的工作
  input.occupation.catalog_missing.next:
    en: Browse the occupation catalog by group or search it, and choose one
    zh: 按分类浏览或搜索职业目录，选中一个
  input.occupation.catalog_selected:
    en: 'You chose “{label}” from the occupation catalog: please check that the duties below are what you mainly do'
    zh: 你从职业目录选了“{label}”：请核对下面的职责是不是你主要做的工作
  input.occupation.catalog_unavailable.impact:
    en: The occupation is not confirmed yet, so no starting state can be generated
    zh: 职业还没有确认，不能生成开局
  input.occupation.catalog_unavailable.message:
    en: This data pack has no occupation catalog, so an occupation cannot be chosen from a catalog
    zh: 这个资料包没有职业目录，不能按目录选职业
  input.occupation.catalog_unavailable.next:
    en: Describe your work in words instead
    zh: 改用文字描述你的工作
  input.occupation.catalog_unknown.message:
    en: 'Occupation ID {ref} is not in the occupation catalog: the system will not replace it with another occupation'
    zh: 职业编号 {ref} 不在职业目录里：系统不替换成别的职业
  input.occupation.catalog_unknown.next:
    en: Choose one of the occupations listed in the catalog
    zh: 从目录列出的职业里选
  input.qualification.because.certificate:
    en: You answered that you hold this certificate
    zh: 你回答持有这张证书
  input.qualification.because.claim:
    en: You chose “provided” in the item-by-item qualification answers
    zh: 你在逐项资格确认里选了“已提供”
  input.qualification.because.education:
    en: 'Highest education “{option}”: at least this level (a higher degree also meets lower education thresholds)'
    zh: 最高学历“{option}”：至少达到这一级（更高的学历也满足较低的学历门槛）
  input.qualification.because.experience:
    en: Worked {years} years as “{occupation}” (this requires at least {min} years in related occupations)
    zh: 在“{occupation}”做过 {years} 年（这一项要求在相关职业里至少做过 {min} 年）
  input.qualification.catalog_unavailable.impact:
