    en: 'The new flow lets you browse the occupation catalog by group or search it and pick one directly (see input_catalog; no text needed). Describing your work in words is kept only for compatibility: the system offers a few readable candidates (name and duties) from the aliases of a controlled vocabulary, and you confirm one. Classification codes stay internal; you never need to enter one. When nothing matches, the system says why and never turns you into a “generic office worker”'
    zh: 新流程从职业目录按分类浏览或搜索后直接选（见 input_catalog，不需要写文字）。文字描述只为兼容保留：系统按受控词表的别名给出少量可读候选（名称与职责），由你确认。分类代码只在内部保留，不需要、也不会请你填写；匹配不到时说明原因，不自动改成“普通白领”
  input.catalog.experience.prompt:
    en: 'The starting job for {occupation} requires related work experience: at least {years} years in {related}. Enter how many years you worked in each of these occupations; if none, answer “no related experience”'
    zh: '{occupation}的开局岗位要求相关工作经验：在{related}里至少做过 {years} 年。请填你在这些职业里各做过几年；没有就回答“没有相关经验”'
  input.catalog.leisure.note:
    en: Pick as many as you like, or skip (skipping means not answered); the categories you pick are used for the evaluation directly, no text needed. “No fixed hobby”, “whatever the city offers” (generic leisure evaluation) and “not sure yet” can be chosen on their own
    zh: 可以多选，也可以跳过（跳过就是未答）；选中的类别直接用于评价，不需要写文字。没有固定爱好、随当地体验（通用休闲评价）和暂不确定可以单独选
  input.catalog.note.free_text:
    en: 'You can still add notes; they are only for the clones'' planning: they do not change points, cash, qualifications or interest categories, and they never become hard requirements'
    zh: 补充文字仍可以写，只供分身做计划参考：它不改变点数、现金、资格或兴趣类别，也不会变成硬要求
  input.catalog.note.groups:
    en: Occupation groups are only for browsing and do not change what an occupation means; each occupation is in exactly one group
    zh: 职业分组只用于浏览，不改变职业的含义；每个职业只在一个分组里
  input.catalog.note.no_grant:
    en: Choosing an occupation never grants education, certificates or experience; those come from your answers to the qualification questions (the rules are applied by E3)
    zh: 选职业不会授予学历、证书或经验；这些按你在资格题里的回答换算（规则由 E3 统一执行）
  input.catalog.search.no_match:
    en: No occupation in the catalog matches. This version supports only the {count} occupations in the catalog (teachers, nurses, doctors and others are not yet included); browse by group, or try a more common name. The system will not switch you to a different occupation
    zh: 目录里没有找到匹配的职业。本版只支持目录里的 {count} 种职业（教师、护士、医生等暂不在范围内）；请按分类浏览，或换一个常用叫法。系统不会替你换成别的职业
  input.catalog.search.rule.all_terms:
    en: 'Several words separated by spaces must all match: a word matches when it appears in any of the entry''s search terms'
    zh: 用空格分开的几个词要全部命中：每个词出现在这个条目的任意一个搜索词里就算命中
  input.catalog.search.rule.empty:
    en: With an empty search, all entries of the current group are shown in a fixed order
    zh: 搜索为空时显示当前分组的全部条目，顺序固定
  input.catalog.search.rule.normalize:
    en: Full-width and half-width characters are treated alike, English is case-insensitive, and leading or trailing spaces are ignored
    zh: 全角与半角统一、英文不分大小写、首尾空白忽略
  input.catalog.search.rule.scope:
    en: Only entries already published in the catalog are filtered; no new entries are created. What you type in the search box is not saved and never enters your profile
    zh: 只在目录已经发布的条目里筛选，不生成新条目；搜索框里的字不保存，也不进入画像
  input.catalog.search.rule.server:
    en: What is submitted is the ID of the selected entry; the server checks the ID and the catalog version, never the search words
    zh: 提交的是选中条目的编号；服务端核对编号与目录版本，不认搜索词
  input.catalog.state.certificates.provided.meaning:
    en: Grants the certificates you selected; selecting none means you have none of these certificates
    zh: 授予选中的证书；一张都不选表示没有这些证书
  input.catalog.state.certificates.provided.name:
    en: Answered
    zh: 已回答
  input.catalog.state.certificates.unanswered.meaning:
