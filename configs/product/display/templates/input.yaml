    zh: 这个资料包没有输入目录，不能按学历、证书或经验题换算资格
  input.qualification.catalog_unavailable.next:
    en: Clear these answers, or switch to a data pack that has a catalog
    zh: 清空这几题的回答，或换成配了目录的资料包
  input.qualification.certificate_duplicated.impact:
    en: The profile cannot be confirmed
    zh: 画像不能确认
  input.qualification.certificate_duplicated.message:
    en: 'Certificate {aid} was selected more than once: the system will not remove the duplicate for you'
    zh: 证书 {aid} 选了不止一次：系统不替你去重
  input.qualification.certificate_duplicated.next:
    en: Select each certificate only once
    zh: 每张证书只选一次
  input.qualification.certificate_unknown.impact:
    en: It grants no qualification (an education threshold cannot be chosen as a certificate), and the profile cannot be confirmed
    zh: 它不会授予任何资格（学历门槛不能当证书选），画像不能确认
  input.qualification.certificate_unknown.message:
    en: '{aid} is not an occupational certificate in the input catalog'
    zh: '{aid} 不是输入目录里的职业证书'
  input.qualification.certificate_unknown.next:
    en: Select only the certificates listed in the catalog; answer education under “highest education”
    zh: 只选目录列出的证书；学历在“最高学历”里回答
  input.qualification.conflict.impact:
    en: The system does not merge the two or choose between them, so the profile cannot be confirmed
    zh: 系统不合并两边、也不替你取舍，画像不能确认
  input.qualification.conflict.message:
    en: 'Qualifications came both from the new education / certificate / experience answers and from the old item-by-item qualification answers, and they differ (new answers: {new}; old answers: {old})'
    zh: 资格同时用了新的学历 / 证书 / 经验回答和旧的逐项资格确认，两边给出的资格不一样（新回答：{new}；旧确认：{old}）
  input.qualification.conflict.next:
    en: 'Keep only one: answer the new education, certificate and experience questions, and clear the old item-by-item answers'
    zh: 只保留一种：按新的学历、证书与经验题回答，并清空旧的逐项资格确认
  input.qualification.education_unknown.impact:
    en: Education grants no threshold, and the profile cannot be confirmed
    zh: 学历不会授予任何门槛，画像不能确认
  input.qualification.education_unknown.message:
    en: Highest-education option {option} is not in the input catalog
    zh: 最高学历选项 {option} 不在输入目录里
  input.qualification.education_unknown.next:
    en: Choose one of the education options listed in the catalog
    zh: 从目录列出的学历选项里选一项
  input.qualification.experience_duplicated.impact:
    en: The profile cannot be confirmed
    zh: 画像不能确认
  input.qualification.experience_duplicated.message:
    en: 'Experience as “{occupation}” was entered more than once: the system will not add the years up for you'
    zh: “{occupation}”的经历写了不止一条：系统不替你合并年数
  input.qualification.experience_duplicated.next:
    en: Enter each occupation once, with the total years you worked in it
    zh: 每个职业只写一条，填一共做过几年
  input.qualification.experience_not_related.impact:
    en: This experience grants no qualification, and the profile cannot be confirmed
    zh: 这段经历不会授予任何资格，画像不能确认
  input.qualification.experience_not_related.message:
    en: “{occupation}” is not among the occupations listed by any related-experience question
    zh: “{occupation}”不在任何相关经验问题列出的职业里
  input.qualification.experience_not_related.next:
    en: Enter only the related occupations listed in the question
    zh: 只填问题里列出的相关职业
  input.qualification.none:
    en: none
    zh: 无
  input.qualification.requirement_unmet.impact:
    en: 'The starting job will then be blocked in each city: the system does not fill in qualifications for you or switch you to another occupation'
    zh: 这样各城的开局岗位会被挡下：系统不替你补资格，也不换成别的职业
  input.qualification.requirement_unmet.message:
    en: The starting job for {occupation} requires {missing}; your current answers do not meet it yet
    zh: '{occupation}的开局岗位要求：{missing}；按你现在的回答还不满足'
  input.qualification.requirement_unmet.next:
    en: If you have it, answer the highest education, certificate or related experience questions truthfully; if not, choose the occupation you actually work in
    zh: 如果你有，就在最高学历、证书或相关经验里如实回答；没有就选你实际在做的职业
  input.qualification.review.claims:
    en: 'Qualifications come from the item-by-item qualification answers (the compatible form): {granted}'
    zh: 资格来自逐项资格确认（兼容的写法）：{granted}
  input.qualification.review.none:
    en: 'Highest education, occupational certificates and related experience are not answered yet: no qualification is granted'
    zh: 还没有回答最高学历、职业证书或相关经验：不授予任何资格
  input.qualification.review.structured:
    en: 'Qualifications derived from your answers: {granted}'
    zh: 资格按你的回答换算：{granted}
  input.qualification.review.structured_none:
    en: Your answers grant no qualification threshold (not answered and not sure yet grant nothing)
    zh: 按你的回答，没有得到任何资格门槛（未答与暂不确定都不授予）
  input.qualification.section.certificates:
    en: occupational certificates
    zh: 职业证书
  input.qualification.section.education:
    en: highest education
    zh: 最高学历
  input.qualification.section.experience:
    en: related work experience
    zh: 相关工作经验
  input.qualification.section_not_offered.impact:
    en: This answer grants no qualification, and the profile cannot be confirmed
    zh: 这个回答不会授予任何资格，画像不能确认
  input.qualification.section_not_offered.message:
    en: This data pack does not ask about “{section}”, but an answer was received
    zh: 这一版的资料包不问“{section}”，却收到了回答
  input.qualification.section_not_offered.next:
    en: Set this question back to not answered
    zh: 把这一题改回未答
  input.removed.attribute_hard:
    en: “{v}” (marked as non-negotiable)
    zh: “{v}”（标成了不可妥协）
  input.removed.hard_requirement:
    en: '{label} {value} {unit}'
    zh: '{label} {value} {unit}'
  input.removed.quoted:
    en: “{v}”
    zh: “{v}”
  input.removed_section.attribute_preferences:
    en: attribute preferences such as brands and cuisines
    zh: 品牌、菜系等属性偏好
  input.removed_section.hard_requirements:
    en: hard requirements
    zh: 硬要求
  input.removed_section.impact:
    en: They would change the simulation, so the system neither keeps using them silently nor drops them silently; the profile cannot be confirmed for now
    zh: 它们会改变模拟，系统不悄悄沿用、也不悄悄丢掉；画像暂时不能确认
  input.removed_section.message:
    en: 'This version of the questionnaire no longer collects “{section}”, but the draft still has {n}: {items}'
    zh: 这一版问卷不再收集“{section}”，草稿里还有 {n} 条：{items}
  input.removed_section.next:
    en: Start a new draft and fill it in with this version of the questionnaire
    zh: 新开一份草稿，按这一版问卷重新填写
  input.allocation.mode_retired.impact:
    en: Percentages are not independent ratings, and the system does not reinterpret them as ratings; the profile cannot be confirmed for now
    zh: 百分比不是独立评分，系统不把它改读成评分；画像暂时不能确认
  input.allocation.mode_retired.message:
    en: 'In this version of the questionnaire, {what} uses independent ratings: each item gets 0–100 points and they need not add up to 100; the old percentage allocation cannot be used to confirm'
    zh: 这一版问卷的{what}用独立评分：每项 0–100 分，不必凑满 100；旧的百分比分配不能直接用来确认
  input.allocation.mode_retired.next:
    en: Rate each item again, or choose equal weight (50 points each)
    zh: 给每一项重新评分，或选择同等重视（每项 50 分）
  input.capabilities.ratings.equal_weight:
    en: “Equal weight” means you actively set every item to 50 points (each of the six dimensions gets 50/3, each of the four material items gets 25)
    zh: “同等重视”是你主动把每一项都设为 50 分（六维各得 50/3、物质四项各得 25）
  input.capabilities.ratings.material_zero:
    en: 'When material life gets 0 points, the four material items do not apply: the points you already gave stay in the draft but are not used this time; they come back as they were when material life is above 0 again'
    zh: 物质生活打 0 分时物质四项不适用：已经打的分留在草稿里，不参与这一次的换算；物质重新大于 0 时照原样恢复
  input.capabilities.ratings.normalize:
    en: Once every item that needs an answer is rated and the total is above 0, E3 turns ratings into weights as “100 × this item's rating ÷ the sum of all ratings” (exact fractions, no extra factors); scaling all ratings by the same factor leaves the weights unchanged
    zh: 全部要回答的项都打了分、合计大于 0 之后，E3 按“100 × 这一项的评分 ÷ 全部评分之和”换成权重（精确分数，不加任何系数）；评分同比例放大或缩小，权重不变
  input.capabilities.ratings.range:
    en: 'Rate each item separately from 0 to 100: the slider moves 1 point at a time, and you can also type up to two decimals; the ratings need not add up to 100'
    zh: 每一项单独打 0–100 分：滑条一次 1 分，也可以输入最多两位小数；不必凑满 100
  input.capabilities.ratings.states:
    en: Not answered is not 0; “no strong view” and “not sure yet” keep their own state and are not turned into numbers; if every rating is 0 you cannot confirm, and the system does not split the weight evenly for you
    zh: 未答不是 0；“无所谓”“暂不确定”保留原状态，不换成数值；全部是 0 时不能确认，系统也不会自动平均分配
  input.exact.rating_not_decimal:
    en: '“{text}” is not a decimal number: write ratings as numbers from 0 to 100 with at most two decimals'
    zh: “{text}”不是十进制数：评分写成 0 到 100 之间、最多两位小数的数
  input.ratings.all_zero.impact:
    en: When every rating is 0 they cannot be turned into weights; the system does not split the weight evenly for you
    zh: 全部是 0 时没法换成权重；系统不会自动平均分配
  input.ratings.all_zero.message:
    en: 'Every rating in {what} is 0: give at least one item more than 0, or actively choose equal weight'
    zh: '{what}的评分全部是 0：至少有一项大于 0，或主动选择同等重视'
  input.ratings.all_zero.next:
    en: Give the items you care about a rating above 0, or choose equal weight (50 points each)
    zh: 给你在意的项目打一个大于 0 的分，或选择同等重视（每项 50 分）
  input.ratings.not_given.next:
    en: Give it a rating from 0 to 100 (0 is allowed), or choose equal weight
    zh: 给它一个 0 到 100 的评分（可以是 0），或选择同等重视
  input.ratings.out_of_range.message:
    en: The rating {value} for {name} is above 100
    zh: '{name} 的评分 {value} 超过了 100'
  input.ratings.out_of_range.next:
    en: Each rating is between 0 and 100
    zh: 每一项的评分在 0 到 100 之间
  input.ratings.parse_error.next:
    en: Change it to a rating from 0 to 100 with at most two decimals
    zh: 改成 0 到 100 之间、最多两位小数的评分
