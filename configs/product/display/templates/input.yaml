# 输入侧的显示模板（能力清单、审阅、确认画像、确认回复的问题）：zh 是代码里中文模板的对齐副本（代码才是唯一来源，
# scripts/product_display.py check 核对两者一致）；en 是英文模板，占位必须与中文相同。不放 HTML、不放用户内容。
# 资料包里的名称与说明（城市、维度、职业……）不在这里，在 entities/input_<pack_id>.yaml。
templates:
  input.ability.state.indifferent:
    en: no strong view
    zh: 无所谓
  input.ability.state.provided:
    en: provided
    zh: 已提供
  input.ability.state.unanswered:
    en: not answered
    zh: 未答
  input.ability.state.unsure:
    en: not sure yet
    zh: 暂不确定
  input.ability_duplicated.impact:
    en: This qualification cannot go into the starting state, and the profile cannot be confirmed
    zh: 这项资格不能进入开局，画像不能确认
  input.ability_duplicated.message:
    en: 'Qualification {aid} appears {n} times ({states}): the system will not decide for you whether you hold it'
    zh: 资格 {aid} 出现了 {n} 次（{states}）：系统不替你判断持不持有
  input.ability_duplicated.next:
    en: 'Keep only one entry: choose “provided” if you hold it, or “not sure yet” if you are not sure'
    zh: 只保留一条：持有就选“已提供”，不确定就选“暂不确定”
  input.ability_unknown.impact:
    en: This qualification will not go into the starting state
    zh: 这项资格不会进入开局
  input.ability_unknown.message:
    en: This version has no definition for qualification {aid}
    zh: 本版没有资格 {aid} 的定义
  input.ability_unknown.next:
    en: Only confirm qualifications listed in the capability list
    zh: 只确认能力清单里列出的资格
  input.ack.interests_not_personalized:
    en: Whatever is not personalized by specific interests or taste this time is evaluated with neutral rules (not answered, not sure yet, no fixed hobby and the generic evaluation are each recorded as such); descriptions you wrote that this version does not support are only kept as written
    zh: 本次不按具体兴趣或口味个性化的部分按中性规则评价（未答、暂不确定、没有固定爱好或通用评价各自记下）；写了但本版不支持的描述只留存原文
  input.ack.retained:
    en: Statement {ref} is not scored and not guaranteed in this version; it is only kept as written
    zh: 陈述 {ref} 本版不评分、不保证执行，只留存原文
  input.ack.standard_start:
    en: This is a simplified scenario that starts healthy, with no belongings and no courses in progress (real furniture and medical history are not included yet)
    zh: 这是一次从健康、没有已有物品、没有在学课程开始的简化情景（现实中的家具与病史暂未纳入）
  input.ack_missing.impact:
    en: The profile cannot be confirmed until you acknowledge this explanation
    zh: 没有知悉这项说明就不能确认画像
  input.ack_missing.message:
    en: 'Not acknowledged yet: {what}'
    zh: 还没有确认：{what}
  input.ack_missing.next:
    en: Read the explanation, then tick to acknowledge it
    zh: 阅读说明后勾选确认
  input.age_missing.impact:
    en: The starting state needs an age (the model's illness rules go by age band and are not medically calibrated)
    zh: 开局状态需要年龄（模型的疾病规则按年龄段，未经医学标定）
  input.age_missing.message:
    en: Age is not filled in yet
    zh: 还没有填写年龄
  input.age_missing.next:
    en: Enter your age in whole years at the start of the simulation
    zh: 填写模拟开始时的整数年龄
  input.age_out_of_range.impact:
    en: This version only supports scenarios with a single adult
    zh: 本版只支持单个成年人的情景
  input.age_out_of_range.message:
    en: Age {age} is outside the {low}–{high} years this version supports
    zh: 年龄 {age} 不在本版支持的 {low}–{high} 岁之间
  input.age_out_of_range.next:
    en: Enter an age within the supported range
    zh: 填写支持范围内的年龄
  input.allocation.equal_split_with_values.impact:
    en: It is unclear which split you want
    zh: 不能确定你要的是哪一种分配
  input.allocation.equal_split_with_values.message:
    en: 'You chose “split equally” and also submitted manual values: only one of the two can be used'
    zh: 选择了“平均分配”，又提交了手工数值：两者只能选一种
  input.allocation.equal_split_with_values.next:
    en: Undo the equal split, or clear the manual values
    zh: 撤销平均分配，或清空手工数值
  input.allocation.gap.over:
    en: '{n} points over'
    zh: 多出 {n} 分
  input.allocation.gap.short:
    en: '{n} points short'
    zh: 还差 {n} 分
  input.allocation.healthcare.impact:
    en: The healthcare points here will not be used, and will not be reinterpreted as health answers
    zh: 这里的医疗点数不会被使用，也不会被改读成健康回答
  input.allocation.healthcare.message:
    en: 'Health is not part of the six areas'' 100 points: in the new questionnaire, coping with health risks is a separate questionnaire that takes none of these 100 points'
    zh: 健康不在六维 100 分里：新问卷的健康风险应对是一份独立问卷，不占这 100 分
  input.allocation.healthcare.next:
    en: Remove this entry and answer in the health questionnaire
    zh: 删掉这一项，在健康问卷里回答
  input.allocation.laundry.impact:
    en: This entry will not be used, and will not be reinterpreted as a new question
    zh: 这一项不会被使用，也不会被改读成新题目
  input.allocation.laundry.message:
    en: “Laundry” in the old questionnaire asked whether you have laundry facilities; it cannot be taken automatically as “daily convenience” (willingness to pay to reduce daily chores)
    zh: 旧问卷的“洗衣”问的是有没有洗衣条件，不能自动当作“日常生活便利”（愿意花钱减少日常杂务）
  input.allocation.laundry.next:
    en: Split the four material-life items again under the new questions (living space, food, daily convenience, personal consumption and enjoyment)
    zh: 按新题目重新分配物质四项（居住空间、饮食生活、日常生活便利、个人消费与享受）
  input.allocation.material:
    en: four material-life items
    zh: 物质四项
  input.allocation.no_value.impact:
    en: This item has no usable value
    zh: 这一项没有可用的数值
  input.allocation.not_given.impact:
    en: The split across the {what} is not complete, so it cannot be confirmed
    zh: '{what}还不完整，不能确认'
  input.allocation.not_given.message:
    en: '{name}: {state}; the system will not turn it into 0 points or an equal share automatically'
    zh: '{name} {state}：系统不会把它自动换成 0 分或平均分'
  input.allocation.not_given.next:
    en: Give it an explicit number of points (0 is allowed), or choose to split equally
    zh: 给它一个明确的分数（可以是 0），或选择平均分配
  input.allocation.out_of_range.message:
    en: '{value} points for {name} is more than 100'
    zh: '{name} 的 {value} 分超过了 100'
  input.allocation.out_of_range.next:
    en: Each item must be between 0 and 100
    zh: 每一项在 0 到 100 之间
  input.allocation.parse_error.message:
    en: '{name}: {error}'
    zh: '{name}：{error}'
  input.allocation.parse_error.next:
    en: Use a number with at most two decimal places, or split equally
    zh: 改成最多两位小数的数，或使用平均分配
  input.allocation.six:
    en: six areas
    zh: 六维
  input.allocation.state.indifferent:
    en: you chose “no strong view”
    zh: 选了“无所谓”
  input.allocation.state.unanswered:
    en: not allocated yet
    zh: 还没有分配
  input.allocation.state.unsure:
    en: you chose “not sure yet”
    zh: 选了“暂不确定”
  input.allocation.sum_not_100.impact:
    en: The system will not cut or top up any item proportionally
    zh: 系统不会按比例自动扣减或补齐任何一项
  input.allocation.sum_not_100.message:
    en: 'The {what} add up to {total} (shown as {shown}), not 100: {gap}'
    zh: '{what}合计是 {total}（显示 {shown}），不是 100：{gap}'
  input.allocation.sum_not_100.next:
    en: You decide which item to move points from and to, until the total is exactly 100
    zh: 由你决定从哪一项挪到哪一项，直到精确合计 100
  input.allocation.unknown_key.impact:
    en: This entry will not be used
    zh: 这一项不会被使用
  input.allocation.unknown_key.message:
    en: “{key}” is not one of the {what} in this version
    zh: “{key}”不是本版{what}的一项
  input.allocation.unknown_key.next:
    en: Split only among {names}
    zh: 只在 {names} 之间分配
  input.capabilities.money_input_rule:
    en: 'Amounts are accepted in only two forms: an ungrouped non-negative decimal (for example 3000.50), or thousands grouped strictly in threes (for example 3,000.50); the decimal point must be “.”, with at most two decimal places. Forms such as “3000,50”, “3,,000” or “1,23.45” are rejected; the system does not guess what you meant'
    zh: 金额只接受两种写法：不分组的非负十进制（例如 3000.50），或严格每三位一组的千分位（例如 3,000.50）；小数点只能用“.”，最多两位小数。“3000,50”“3,,000”“1,23.45”这类写法会被拒绝，系统不猜你的意思
  input.capabilities.occupation_note:
    en: 'Describe your work in your own words; the system offers a few readable candidates (name and duties) from the aliases in a controlled vocabulary, and you confirm one. Classification codes are kept internally only: you do not need to enter them and will not be asked to. If nothing matches, the system says why and does not turn it into “ordinary office worker”'
    zh: 用自然语言描述你的工作；系统按受控词表的别名给出少量可读候选（名称与职责），由你确认。分类代码只在内部保留，不需要、也不会请你填写；匹配不到时说明原因，不自动改成“普通白领”
  input.cash_missing.impact:
    en: Starting cash is unknown, so the starting state cannot be generated
    zh: 开局现金未知，不能生成开局
  input.cash_missing.message:
    en: The money you can use for living at the start is not filled in yet (leaving it empty is not 0)
    zh: 还没有填写开始时可用于生活的钱（没填不是 0）
  input.cash_missing.next:
    en: Enter the amount, its currency and the period the amount is in
    zh: 填写金额、币种与金额时期
  input.cities_missing.impact:
    en: Without cities, no clones can be set up
    zh: 没有城市就不能安排分身
  input.cities_missing.message:
    en: No cities to compare have been chosen yet
    zh: 还没有选择要比较的城市
  input.cities_missing.next:
    en: Choose at least one city from the capability list
    zh: 从能力清单列出的城市里至少选一座
  input.city_duplicated.impact:
    en: The same city is not counted twice
    zh: 同一座城不重复计数
  input.city_duplicated.message:
    en: City {ref} was chosen twice
    zh: 城市 {ref} 选了两次
  input.city_duplicated.next:
    en: Remove the duplicate
    zh: 删掉重复的那一项
  input.city_not_supported.impact:
    en: There is no data for this city, so it cannot be run
    zh: 这座城市没有资料，不能运行
  input.city_not_supported.message:
    en: City {ref} is not in this version's capability list
    zh: 城市 {ref} 不在本版能力清单里
  input.city_not_supported.next:
    en: Choose from the cities in the capability list
    zh: 从能力清单列出的城市里选择
  input.confirmation_invalidated.impact:
    en: The changed answers are not confirmed yet, so nothing can be run
    zh: 改过的答案还没有确认，不能运行
  input.confirmation_invalidated.message:
    en: 'The original answers were changed after confirmation: the old confirmation is no longer valid'
    zh: 原始答案在确认之后改过：旧确认已经失效
  input.confirmation_invalidated.next:
    en: Review and confirm again based on the changed answers
    zh: 按修改后的答案重新审阅并确认
  input.confirmation_tampered.impact:
    en: This confirmation cannot be used for a run
    zh: 不能用这份确认运行
  input.confirmation_tampered.message:
    en: The confirmed profile's content does not match the identity it recorded (it may have been altered)
    zh: 确认画像的内容与它记下的身份不一致（可能被改写过）
  input.confirmation_tampered.next:
    en: Review and confirm again
    zh: 重新审阅并确认
  input.confirmed.hard_requirement.label:
    en: '{label} {value} {unit} (checked and reported separately; it does not block plans)'
    zh: '{label} {value} {unit}（单独核验并报告，不拦截计划）'
  input.data_pack_changed.field:
    en: '{where}.meta.data_pack'
    zh: '{where}.meta.data_pack'
  input.data_pack_changed.impact:
    en: Cities, vocabulary or data have changed, so the old interpretation may no longer hold
    zh: 城市、词表或资料变了，旧的解释不一定还成立
  input.data_pack_changed.message:
    en: The data pack the {where} is based on differs in content from the current data pack
    zh: '{where} 所依据的资料包与现在的资料包内容不同'
  input.data_pack_changed.next:
    en: Review and confirm again with the current data pack
    zh: 用当前资料包重新审阅并确认
  input.exact.money_negative:
    en: 'The amount “{text}” is negative: money available at the start cannot be negative (debt is outside what this version supports)'
    zh: 金额“{text}”是负数：开始时可用的钱不能是负数（欠款不在本版支持范围）
  input.exact.money_negative.next:
    en: Enter an amount of 0 or more
    zh: 填写不小于 0 的金额
  input.exact.money_not_a_number:
    en: The amount “{text}” is not a non-negative decimal number
    zh: 金额“{text}”不是非负十进制数
  input.exact.money_not_a_number.next:
    en: Enter an amount like “3000” or “3,000.50”
    zh: 填写像“3000”或“3,000.50”这样的金额
  input.exact.money_separator_invalid:
    en: 'The commas in the amount “{text}” are not used correctly: thousands must be grouped in threes (for example 3,000.50), and the decimal point must be “.”. The system does not guess what you meant: deleting the comma from “3000,50” would turn it into 300,050'
    zh: 金额“{text}”的逗号用法不对：千分位必须每三位一组（例如 3,000.50），小数点只能用“.”。系统不猜你的意思——“3000,50”删掉逗号会变成 300,050
  input.exact.money_separator_invalid.next:
    en: Enter it again in a form like “3000.50” or “3,000.50”
    zh: 按“3000.50”或“3,000.50”这样的写法重新填写
  input.exact.money_too_many_decimals:
    en: The amount “{text}” is more precise than the smallest accounting unit ({digits} decimal places)
    zh: 金额“{text}”的精度细于最小记账单位（{digits} 位小数）
  input.exact.money_too_many_decimals.next:
    en: Write at most {digits} decimal places; it is not rounded automatically
    zh: 最多写 {digits} 位小数，不自动四舍五入
  input.exact.money_unparsable:
    en: The amount “{text}” cannot be parsed
    zh: 金额“{text}”不能解析
  input.exact.points_fraction_not_canonical:
    en: The fraction “{text}” is not in lowest terms; write “{canonical}”
    zh: 分数“{text}”不是规范写法，应写“{canonical}”
  input.exact.points_not_a_number:
    en: “{text}” is not a decimal number or a fraction in lowest terms
    zh: “{text}”不是十进制数或规范分数
  input.exact.points_too_many_decimals:
    en: “{text}” has {decimals} decimal places; manual entry in this version allows at most {max_decimals} (the step is not a measurement precision)
    zh: “{text}”有 {decimals} 位小数，本版手工输入最多 {max_decimals} 位（步长不是测量精度）
  input.free_text_too_long.impact:
    en: The system will not cut it automatically; the extra part cannot be dropped silently
    zh: 系统不会自动截断，超出部分不能静默丢弃
  input.free_text_too_long.message:
    en: The additional text has {n} characters, over the 2,000 limit
    zh: 补充文字有 {n} 个字符，超过 2,000 的上限
  input.free_text_too_long.next:
    en: Shorten it yourself to 2,000 characters or fewer
    zh: 自己删减到 2,000 字符以内
  input.hard_requirement.unfilled:
    en: not filled in
    zh: 未填
  input.hard_requirement.value:
    en: '{value} {unit}'
    zh: '{value} {unit}'
  input.hard_requirement_conflict.impact:
    en: This hard requirement cannot be used yet, and the profile cannot be confirmed
    zh: 这项硬要求还不能使用，画像不能确认
  input.hard_requirement_conflict.message:
    en: '“{label}” was given {n} times ({values}): each requirement can have only one entry; the system does not take the stricter limit automatically, nor does it use the last one'
    zh: “{label}”收到了 {n} 条（{values}）：同一项要求只能有一条，系统不自动取更严格的上限，也不按最后一条算
  input.hard_requirement_conflict.next:
    en: Keep only one entry, with the number you really want
    zh: 只保留一条，写你真正要的那个数
  input.hard_requirement_duplicated.impact:
    en: This hard requirement cannot be used yet, and the profile cannot be confirmed
    zh: 这条硬要求还不能使用，画像不能确认
  input.hard_requirement_duplicated.message:
    en: 'Hard requirement ID {rid} appears {n} times: the system will not decide for you which one to keep'
    zh: 硬要求编号 {rid} 出现了 {n} 次：系统不替你决定保留哪一条
  input.hard_requirement_duplicated.next:
    en: Keep only one
    zh: 只保留一条
  input.hard_requirement_not_enforceable.impact:
    en: The clones may still choose options that conflict with it (for example in-home services); this requirement is only kept, with no guarantee that it is followed
    zh: 分身仍可能选择与它冲突的方案（例如上门服务）；这条要求只留存，不保证执行
  input.hard_requirement_not_enforceable.message:
    en: “{text}” is marked non-negotiable, but this version has no way to check or enforce it
    zh: “{text}”被标成不可妥协，但本版没有能核验或拦截它的机制
  input.hard_requirement_not_enforceable.next:
    en: Acknowledge this and confirm, or change it to an ordinary preference
    zh: 知悉后确认，或改成普通偏好
  input.hard_requirement_parameter_invalid.impact:
    en: This hard requirement cannot be used yet
    zh: 这条硬要求还不能使用
  input.hard_requirement_parameter_invalid.message:
    en: “{label}” needs a whole number from {low} to {high} {unit} in steps of {step}; got {got}
    zh: “{label}”需要 {low}–{high} {unit}、步长 {step} 的整数，得到 {got}
  input.hard_requirement_parameter_invalid.next:
    en: Enter a value within the range
    zh: 填写范围内的数值
  input.hard_requirement_unsupported.impact:
    en: It is only kept as written; it will not block plans and will not be checked
    zh: 它只原样留存，不会拦截计划，也不会被核验
  input.hard_requirement_unsupported.message:
    en: “{text}” is not a hard-requirement option this version can check
    zh: “{text}”不是本版能核验的硬要求选项
  input.hard_requirement_unsupported.next:
    en: Acknowledge this and confirm, or choose from the supported options
    zh: 知悉后确认，或从受支持的选项里选择
  input.health.meaning.duplicated:
    en: 'This question received more than one answer: keep only one before confirming (the system will not choose for you)'
    zh: 这一题收到了多个答案：确认前请只保留一个（系统不替你选）
  input.health.meaning.no_clear_tendency:
    en: The user has no clear tendency on this question
    zh: 用户在这一题上没有明显倾向
  input.health.meaning.unanswered:
    en: The user did not answer this question
    zh: 用户没有回答这一题
  input.health.meaning.unsure:
    en: The user is not sure yet
    zh: 用户暂不确定
  input.health.unanswered_short:
    en: not answered
    zh: 未答
  input.health_answer_duplicated.impact:
    en: The tendency on this question cannot be determined, so the profile cannot be confirmed
    zh: 这一题的倾向不能确定，画像不能确认
  input.health_answer_duplicated.message:
    en: 'Health question {qid} received {n} answers ({choices}): each question can have only one answer; the system will not choose for you, nor use the last one'
    zh: 健康题 {qid} 收到了 {n} 个答案（{choices}）：同一题只能有一个答案，系统不替你选，也不按最后一个算
  input.health_answer_duplicated.next:
    en: Keep only one answer (if you are unsure, you can choose “Not sure yet”)
    zh: 只保留一个答案（拿不准可以选“暂不确定”）
  input.health_question_unknown.impact:
    en: This question will not be used
    zh: 这一题不会被使用
  input.health_question_unknown.message:
    en: The questionnaire has no question {qid}
    zh: 问卷里没有题目 {qid}
  input.health_question_unknown.next:
    en: Answer according to the current questionnaire
    zh: 按当前问卷回答
  input.health_version_mismatch.impact:
    en: Answers to old questions cannot be reinterpreted as answers to new ones
    zh: 旧题目的答案不能改读成新题目的答案
  input.health_version_mismatch.message:
    en: The health answers were given under questionnaire {old}; the current questionnaire is {new}
    zh: 健康回答按问卷 {old} 填写，现在的问卷是 {new}
  input.health_version_mismatch.next:
    en: Answer again under the current questionnaire
    zh: 按当前问卷重新回答
  input.interests.adopted.review:
    en: '{label}: adopting {names}'
    zh: '{label}：采用 {names}'
  input.interests.adopted_with_unrecognized.review:
    en: '{label}: adopting {names}; the unrecognized parts ({unrecognized}) are kept as written and not scored in this version'
