# E1-3 探索月度评分的合成生活样例（DECISIONS/0018）。评分配置另存在 scoring_e1_3.yaml。
#
# **纯合成。** 城市、价格、规格、工作、偏好全部手工设定，不来自任何真实城市、数据源或
# LLM。数字故意取整，方便手算（见文末）。**不是科学默认值，不能用来排序城市。**
#
# 与 E1-2 样例（synthetic_e1_2.yaml，保留不动）的区别：
#   * 项目规格带了评分要读的结构化字段：居所面积 floor_area_sqft、是否有能关门的工作间
#     home_office、食品方案每周新鲜餐数 fresh_meals_per_week、共享办公 workspace；
#   * 健身分两种：a31.service.gym_plan 是"年卡＋每月 8 次锻炼"的**行为方案**（声明了使用安排
#     visits_per_month，并按次数占用时间）；a31.service.gym_card 是没有使用安排的年卡。
#     这是本轮的**使用假设**：只有声明了使用安排的服务才产生锻炼收益。E1-2 样例的年卡
#     含义不变（它在 E1-3 评分里也不会被自动解释成健身收益）；
#   * 用户 u02、u03 明确给出了物质细项的数值（material_points），u01 没有给；
#   * 硬要求只认规格里**写明**的条件：健身项目明确写 workspace: false。规格里没写的键是
#     "数据不足无法判断"，不当成不满足。

fixture_notice: >-
  synthetic_fixture_only：E1-3 探索评分样例。城市、价格、规格、工作、偏好全部手工合成，
  不对应任何真实地点；税是合成测试替身；评分参数是合成探索设定，不是现实标定。

protocol:
  protocol_id: life-v1-e1-3
  schema_version: e1-3-draft
  life_rules_version: e1-2-monthly-v1
  scoring_scale_version: e1-3-explore-v1
  info_permission_version: e1-3-draft
  status: synthetic_fixture_only
  simulation_years: 3
  math_policies:
    score_mapping:
      state: undecided
      proposal: "E1-3 探索版（ADR0018）：s = min(c, z/(z+τ))，z = b + Σηx；仅用于合成探索，未正式采纳"
    material_preference_aggregation:
      state: undecided
      proposal: "E1-3 探索版（ADR0018）：物质细项线性加权；有正权重的缺失不重新归一化；仅用于合成探索"
    energy_feedback: {state: undecided}
    income_payment_timing:
      state: decided
      decision_ref: DECISIONS/0017
    risk_scenarios: {state: undecided}
    discounting: {state: undecided}
    terminal_value: {state: undecided}
    failure_handling:
      state: undecided
      settled_parts:
        - 付不起最低住房与最低食品（两项合计）→ 出局；钱恰好够则通过
        - 自选项付不起不是出局；自选住房/食品给不了而最低仍可负担时，声明了兜底才降级，否则计划不可行
        - 最低生活或税的配置缺失、引用错误、不完整，或最低方案与合格目录矛盾，都是数据错误
      open_parts:
        - LLM 格式错误的有限重试与重试后的默认动作（E1-7）
        - 计划不可行退回之后的重试（E1-7）
        - 出局月份与剩余期间如何计分（E1-6）

consumption_needs: [housing_space, fresh_food, workspace, durables]
categories: [housing, food, durable, training, experience, job, service]

tax_policies:
  - policy_id: tax.synth.za
    status: synthetic_test_double
    money_basis_id: USD_2024_LOCAL
    applies_to: {path: [US, ZA]}
    brackets: [{lower: 0, rate: 0.0}, {lower: 12000, rate: 0.2}]
    note: 合成测试替身：全年应税收入 12,000 以内 0%，超出部分 20%
  - policy_id: tax.synth.zb
    status: synthetic_test_double
    money_basis_id: USD_2024_LOCAL
    applies_to: {path: [US, ZB]}
    brackets: [{lower: 0, rate: 0.0}, {lower: 12000, rate: 0.2}]
