# ---------------------------------------------------------------------- 三位用户
# 陈述（产品可见）与真值（研究内部）分开。评分只认明确的数值：u01 没给物质细项数值，
# 所以 u01 的产品评分返回"偏好信息不足"；u02 给了，而且与它的研究真值不同。
stated_profiles:
  - person_id: u01
    dimension_points: {material: 35, safety: 15, healthcare: 10, opportunity: 15, leisure: 5, environment: 5, commute: 15}
    soft_preferences:
      - {need: housing_space, stated_strength: high, note: 想要宽敞一点}
      - {need: workspace, stated_strength: high}
      - {need: fresh_food, stated_strength: low}
    hard_requirements:
      - need: workspace
        requirement: {category: housing, home_office: true}
        acceptable_substitutes:
          - {description: 共享办公会员, satisfies_with: {category: service, workspace: true}}
          - {description: 两居室中的一间, satisfies_with: {category: housing, min_bedrooms: 2}}
    free_text: 我在家远程处理报表，每个月都需要一个能关门的地方。
    occupation: {scheme: SOC2018, code: "43-6014"}
  - person_id: u02
    dimension_points: {material: 25, safety: 10, healthcare: 20, opportunity: 10, leisure: 15, environment: 15, commute: 5}
    soft_preferences:
      - {need: fresh_food, stated_strength: high, note: 天天都要吃新鲜的}
      - {need: housing_space, stated_strength: low}
    hard_requirements:
      - need: fresh_food
        requirement: {category: food, min_fresh_meals_per_week: 14}
    material_points: {housing_space: 30, fresh_food: 40, workspace: 10, durables: 20}
    free_text: 吃得新鲜比住得大重要。
    occupation: {scheme: SOC2018, code: "43-6014"}
  - person_id: u03
    dimension_points: {material: 40, safety: 10, healthcare: 10, opportunity: 10, leisure: 10, environment: 10, commute: 10}
    soft_preferences:
      - {need: housing_space, stated_strength: high}
    material_points: {housing_space: 50, fresh_food: 30, workspace: 0, durables: 20}
    occupation: {scheme: SOC2018, code: "41-2031"}

