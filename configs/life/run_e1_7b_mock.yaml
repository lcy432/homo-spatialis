# E1-7B 的 mock 对照运行配置（DECISIONS/0031）：与 run_e1_7b_live.yaml 用同一份名单、事实表、信息条件与修订上限，只把规划器换成
# E1-7A 的可控 mock（没有受控行为，只按读观察的规则规划）。它说明同一套环境在一个确定性规划器下怎样运行，作为真实模型结果的
# 参照；不是"正确答案"，也不代表任何模型的能力。配置版本 e1-7a-run-v1 是 mock 运行的配置结构（没有模型设定与付费预算）。

run_notice: >-
  exploratory_synthetic：E1-7B 的 mock 对照。合成城市、合成参数、mock 规划器；不是现实城市评价，不代表真实模型能力。

run:
  run_config_id: run.e1-7b.mock
  status: exploratory_synthetic
  version: e1-7a-run-v1
  roster: configs/life/roster_e1_7b.yaml
  city_facts: configs/life/city_facts_e1_7b.yaml
  information:
    condition: product_stated_profile
    show_stated_dimension_points: true
    show_soft_preferences: true
    show_hard_requirements: true
    show_free_text: true
    show_energy_level: true
    show_stated_material_points: true
    permission_version: e1-7b-product-v1
  planning:
    plans_per_year: 1
    max_revisions_per_year: 2
    global_call_limit: 72
    run_order: roster_order
    transport_retries: 0
    note: 与真实模型运行相同的修订上限与调用上限；mock 没有网络，不重试
  planner:
    identity:
      kind: mock
      planner_id: mock.rules.e1-7a
      version: e1-7a-mock-v1
      rules_version: e1-7a-mock-rules-v1
      note: 可控的确定性模拟代理：只检查接线、状态传递与信息隔离，不代表任何真实模型的能力
    scripts: []
  prompt_template: e1-7b-prompt-v1
  memory_policy: e1-7a-memory-v1
  note: 同一名单的 mock 对照（8 个分身、3 年），零网络调用、零费用。
