# 产品生活规划器的默认运行配置（2026-10-13 起，DECISIONS/0032）：千问 Qwen3.8 Flash（configs/models.yaml 的 product_planner 角色）。
# 研究基座 base_a / base_b 与 E1-7B 的 Max 配置（run_e1_7b_live.yaml，base_b 的 qwen3.7-max-2026-06-08）不变；要用旧模型，显式选那份配置。
#
# 与 Max 配置相同：名单、事实表、信息条件、每年 1 + 2 份候选、提示模板、记忆政策、温度 0.2、思考关闭、JSON object、输出上限 4,096、超时 90 秒、
# SDK 自动重试关闭、每份候选最多 1 次服务重试——不为了表现调整提示、温度或输出上限。不同的只有：模型与角色、版本策略、报价、付费账本，以及
# 全局规划调用上限。
#
# qwen3.8-flash 没有带日期的快照（官方页面 2026-10-09 更新、账户模型列表 2026-10-13 都只有这个名字），所以这里显式写 version_policy:
# rolling——这个例外只在产品规划角色上；返回的型号只接受 qwen3.8-flash 本身或它后面接一个快照日期，每次实际返回的型号记在请求明细里。
#
# 付费预算：本轮授权的最小真实试跑（一个合成人设、一个城市、一个行动年），全部真实请求（含服务重试与计划修订）最多 3 次、应用侧估算最多
# 1 元，新账本在本轮证据目录里，不消耗也不重置旧试跑的账本。扩大试跑之前要由所有者另给预算，并换新的账本、运行编号与证据目录。
# 预算保护是按已记录报价执行的应用侧控制，不是供应商级的账单上限；费用以供应商账单为准。

run_notice: >-
  exploratory_synthetic：产品生活规划器的默认运行配置（Qwen3.8 Flash，滚动型号）。合成城市、合成参数、合成人设；结果只说明这个模型在这一次
  合成试跑里的表现，不代表模型的一般能力，也不是现实城市评价。

run:
  run_config_id: run.e1-7b.flash
  status: exploratory_synthetic
  version: e1-7b-run-v1
  roster: configs/life/roster_e1_7b.yaml
  city_facts: configs/life/city_facts_e1_7b.yaml
  information:
    condition: product_stated_profile
    show_stated_dimension_points: true
    show_soft_preferences: true
    show_hard_requirements: true
    show_free_text: true
    show_energy_level: true
    show_stated_material_points: true
    permission_version: e1-7b-product-v1
  planning:
    plans_per_year: 1
    max_revisions_per_year: 2
    global_call_limit: 3
    run_order: roster_order
    transport_retries: 1
    note: >-
      每个分身每年一次正常规划、最多两次修订（与 Max 配置相同）。全局规划调用上限 3：本轮授权的最小真实试跑只跑名单第一项的第 1 年；
      扩大试跑要另给预算并改这一项。每份候选最多再试 1 次服务请求，与计划修订分开计数。顺序调度，不并发
  planner:
    identity:
      kind: llm
      planner_id: llm.qwen.product_planner
      version: e1-7b-llm-v1
      model_snapshot: qwen3.8-flash
      note: 真实模型规划器：DashScope OpenAI 兼容端点上的千问滚动型号（没有带日期的快照）；只收安全投影的请求，计划由环境检查与结算
    llm:
      model_role: product_planner
      provider: dashscope
      model: qwen3.8-flash
      version_policy: rolling
      base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
      temperature: 0.2
      enable_thinking: false
      response_format: json_object
      max_output_tokens: 4096
      timeout_seconds: 90
      sdk_max_retries: 0
      service_retries: 1
      retry_wait_seconds: 5
      max_input_tokens: 64000
      token_estimate: ascii1_nonascii2_v1
      note: >-
        沿用 E1-7B 的调用设定（思考关闭、温度 0.2、JSON object、输出上限 4,096、超时 90 秒、SDK 自动重试关闭、每份候选最多 1 次服务重试），
        只换模型与角色；qwen3.8-flash 是滚动型号（没有带日期的快照）
  paid_budget:
    ledger_dir: runs/2026-10-13-product-flash-switch/budget
    max_requests: 3
    max_cost_cny: 1
    price:
      price_version: qwen3.8-flash@beijing@2026-10-09
      model: qwen3.8-flash
      region: 华北2（北京）
      currency: CNY
      input_per_million: 0.8
      output_per_million: 2.7
      source_url: https://help.aliyun.com/zh/model-studio/qwen3-8-flash
      checked_on: "2026-10-13"
      rule: >-
        官方页面（2026-10-09 更新）的标价：输入 0.8 元 / 百万 token、输出 2.7 元 / 百万 token，页面没有按输入长度分档；每个输入 token 都按
        未命中缓存的标价估算，不假设缓存折扣或促销。核对记录见 runs/2026-10-13-product-flash-switch/pricing/price_check.json
  prompt_template: e1-7b-prompt-v1
  memory_policy: e1-7a-memory-v1
  note: 产品默认模型 Qwen3.8 Flash；本轮最小真实试跑（3 次请求、1 元以内）。旧 Max 配置见 run_e1_7b_live.yaml。
