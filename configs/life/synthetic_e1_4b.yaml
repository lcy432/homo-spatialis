# ---------------------------------------------------------------------- 手算（合成；评分参数见 scoring_e1_4b.yaml）
# 月度满足感 u = Σ 维度权重 × 分项分；分项分 s = min(c, z/(z+τ))。u31 的权重（点数 / 100）：物质 0.35（面积 0.5、
# 新鲜食品 0.3、洗衣 0.2），安全 0.15，医疗、机会、休闲、环境、通勤各 0.10。
# A61，第 1 年（近处、新鲜食材、洗衣机、健身、线下文员）：
#   面积 600 × 0.01 = 6 → 6/12 = 0.5；新鲜 21 → 21/28 = 0.75；洗衣 3 → 3/4 = 0.75 → 物质 0.25 + 0.225 + 0.15 = 0.625
#   安全 3/6 = 0.5；医疗 4/8 = 0.5；机会 2/4 = 0.5；休闲 (4 + 8)/24 = 0.5；环境 3/6 = 0.5；通勤 60/(60 + 30) = 2/3
#   u = 0.35 × 0.625 + 0.15 × 0.5 + 4 × 0.10 × 0.5 + 0.10 × 2/3 = 0.21875 + 0.075 + 0.2 + 0.0666… ≈ 0.560417（12 个月相同）
#   下一年额度 = 250 × (1 + 0.10 × 0.560417) ≈ 264.0104 → 向下保留到 0.01 得 264.01 负担点
# 第 2 年同样的生活（夜校不计满足感）→ S 相同 → 第 3 年仍是 264.01（不从 264.01 再乘一次）。
# 第 2 年负担：工作 160 + 通勤 7.5 + 做饭 20 + 洗衣 1.5 + 打扫 6 + 健身 12 + 夜校 40 × 1.2 = 48 → 255：
#   开启反馈（264.01）可行；关闭反馈（250）不可行；α = 0.05 时 250 × (1 + 0.05 × 0.560417) ≈ 257.005 → 257.00，可行。
# 住远处、吃基本食品：新鲜 3 → 0.3，物质 0.49；通勤 60/130 ≈ 0.4615 → u ≈ 0.492654 → 额度 ≈ 262.3163 → 262.31（下降）。
# B62（安全 6/9、医疗 2/6、机会 6/8、休闲 (2 + 8)/22，环境、通勤同 A61）：u ≈ 0.589205 → 第 2 年额度 264.73。
