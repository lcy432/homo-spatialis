# E1-4B 满足感 → 下一年月度精力额度的合成生活样例（DECISIONS/0021）。评分配置另存在 scoring_e1_4b.yaml。
#
# **纯合成。** 城市、价格、工时、负担系数、净可分配小时、基础额度、评分参数与反馈强度 α 全部手工设定，不来自
# 任何真实城市、时间利用调查、生理学研究或 LLM。数字故意取整，方便手算（见文末）。**不是现实生活的可行性
# 判断，也不排序城市。** α = 0.10 是预先声明的合成参数，不是经验结论；对照 α = 0 与敏感性 α = 0.05 由主配置
# 只改反馈政策派生。
#
# 与 E1-4A 样例（synthetic_e1_4a.yaml，保留不动）的区别：生活规则版本 e1-4b-monthly-feedback-v1，协议必须显式
# 声明反馈政策 energy_feedback；每个人写明固定的个人基础额度（energy_quota_basis.base_level），第一年当前额度
# 等于基础额度；机会额外声明评分要用的需求功能（洗衣），城市写明功能供给，供 E1-3 探索评分检查。月度资源
# 规则、资源事实与 E1-4A 相同。

fixture_notice: >-
  synthetic_fixture_only：E1-4B 满足感反馈样例。价格、工时、负担系数、净可分配小时、基础额度与反馈强度全部
  手工合成，不对应任何真实地点或调查；税是合成测试替身；反馈的方向与幅度没有经验标定，不模拟临床疲劳、疾病或
  休息恢复。

protocol:
  protocol_id: life-v1-e1-4b
  schema_version: e1-4b-draft
  life_rules_version: e1-4b-monthly-feedback-v1
  scoring_scale_version: e1-3-supplement-v1
  info_permission_version: e1-4b-draft
  status: synthetic_fixture_only
  simulation_years: 3
  math_policies:
    score_mapping:
      state: undecided
      proposal: "E1-3 探索版与增补（ADR0018、ADR0019）的合成探索映射；E1-4B 只读它的完整年度平均"
    material_preference_aggregation: {state: undecided}
    energy_feedback:
      state: undecided
      settled_parts:
        - "月度精力额度约束：当月实际活动负担 ≤ 当月可承受额度；不结转、不回血（DECISIONS/0020）"
        - "探索版年度反馈：下一年额度 = 基础额度 × (1 + α × 上一年完整年度满足感)，向下保留到 0.01；只用上一年、不复利、不低于基础；关闭或 α = 0 即基础额度（DECISIONS/0021，仅用于合成探索）"
      open_parts:
        - "反馈的方向与幅度的经验标定、α 的取值；是否允许低于基础额度"
        - "出局、评分不完整年份之后的额度政策；与疾病、恢复的关系（E1-5）"
    income_payment_timing:
      state: decided
      decision_ref: DECISIONS/0017
    risk_scenarios: {state: undecided}
    discounting: {state: undecided}
    terminal_value: {state: undecided}
    failure_handling:
      state: undecided
      settled_parts:
        - 付不起最低住房与最低食品（两项合计）→ 出局；钱恰好够则通过
        - 自选项付不起不是出局；自选住房/食品给不了而最低仍可负担时，声明了兜底才降级，否则计划不可行
        - 最低生活或税的配置缺失、引用错误、不完整，或最低方案与合格目录矛盾，都是数据错误
        - 时间或精力超限 → 计划不可行（含出局当月已知劳动超限）：整份计划试算失败、不提交账目（DECISIONS/0020）
        - 反馈开着而上一年没有完整评分 → 下一年额度无法确定（反馈信息不足），当年结算保留（DECISIONS/0021）
      open_parts:
        - LLM 格式错误的有限重试与重试后的默认动作（E1-7）
        - 计划不可行退回之后的重试（E1-7）
        - 出局月份与剩余期间如何计分（E1-6）
  resource_rules:
    version: e1-4a-monthly-resources-v1
    time_unit: hour
    month_rule: annual_net_hours_div_12
    reserved_time: >-
      净可分配小时已预留每天 8 小时睡眠与 4 小时基本休息（吃饭、洗漱、个人照料），按 365 天计；
      这些不再进活动账
    energy_unit: burden_point
    energy_scale_version: e1-4a-monthly-quota-v1
    commute_minutes_key: commute_roundtrip_minutes
    commute_reference: >-
      每座合成城只有一个到岗工作地点（城市就业中心的抽象）：住房写明的往返分钟就是到那里的往返，
      所有需要到岗的岗位都在那里；不做地图与路线规划
    commute_burden_per_hour: 0.75
    household_tasks:
      - {task: laundry, baseline_hours_per_month: 12, burden_per_hour: 0.5,
         description: 没有洗衣机或洗衣服务时，自己手洗或去自助洗衣店}
      - {task: cleaning, baseline_hours_per_month: 10, burden_per_hour: 0.6,
         description: 自己打扫一居室}
    source: &rules
      kind: synthetic
      observed_on: 2026-10-08
      geography_scope: synthetic city (no real geography)
      mapping_version: synthetic-e1-4b
      synthetic_note: 手工设定的资源规则与负担系数，不是时间利用调查或生理学标定
  energy_feedback:
    policy_id: feedback.e1-4b.main
    version: e1-4b-satisfaction-quota-v1
    mode: enabled
    alpha: 0.10
    formula: base_times_one_plus_alpha_s
    lag_years: 1
    score_statistic: complete_year_mean_u
    scoring_spec_id: score.e1-4b.explore
    scoring_version: e1-3-supplement-v1
    preference_source: product_stated_numeric
    quantization: floor_to_0.01
    source: *rules
    note: >-
      合成探索参数：α = 0.10 预先声明，不看结果调；产品路径只用用户明确给出的七维与物质细项点数。对照臂
      （关闭、α = 0、α = 0.05）由本政策只改 mode / alpha / policy_id 派生，从相同初始状态分别运行。

consumption_needs: [housing_space, fresh_food, laundry, home_cleaning]
categories: [housing, food, durable, experience, job, service, training]
functions: [housing, food, laundry]
function_kinds: {laundry: presence}

