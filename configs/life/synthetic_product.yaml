# 产品协议的合成生活样例（life-v1-e3a-product）：测试、命令行运行与产品资料包共用的唯一一份基础样例。评分在 scoring_product.yaml，
# 评价规格在 evaluation_product.yaml，原计划名单在 roster_product.yaml，城市背景事实在 city_facts_product.yaml，运行配置在
# run_product_mock.yaml（mock）、run_product_haiku.yaml（真实 LLM 测试，Claude Haiku 5.5）与 run_product_flash.yaml（产品角色 Qwen3.8 Flash）。
#
# **纯合成。** 城市、报价、工资、学费、寿命、残余时间、疾病、治疗与税档全部手工设定，不来自任何真实城市、商品、服务、雇主、制度
# 或 LLM；只用来检验生活引擎、规划接线与产品链路，不是城市评价，不排序真实城市。
#
# 规则：生活规则 e1-5c-monthly-health-v1（月度时间与精力、满足感反馈、学习与岗位、目标储蓄、疾病与应急），评分 e1-convenience-v1
# （六维＋独立健康项，物质三项 housing_space、fresh_food、daily_convenience）。偏好是六维产品画像（用户确认的陈述，健康回答独立、
# 不占六维 100 分）。
#   * 两座合成城 K51、M52：住房、食品、岗位、课程、治疗与背景事实相同，只有两种减少杂务的方式价格不同——K51 的设备便宜、人工服务贵，
#     M52 反过来；
#   * 岗位：全职文员（开局的现职）、门店兼职（收入低、时间少，没有资格要求）、会计（要求会计资格）；
#   * 一位用户 u301（全职文员，看重省事），每城一个分身，3 年；疾病事件来源是 none（不发生新疾病的受控主场景）。

fixture_notice: >-
  synthetic_fixture_only：产品协议样例。报价、工资、学费、寿命、残余时间、负担、疾病、治疗价格与税档全部手工合成，不对应
  任何真实地点、商品、服务、雇主或制度；只用来检验便利评分与规划接线，不是城市评价，不排序真实城市。

protocol:
  protocol_id: life-v1-e3a-product
  schema_version: e3a-product-draft
  life_rules_version: e1-5c-monthly-health-v1
  scoring_scale_version: e1-life-v1
  info_permission_version: e3a-product-v1
  status: synthetic_fixture_only
  simulation_years: 3
  math_policies:
    score_mapping:
      state: undecided
      proposal: >-
        E1-3 探索映射加 E1-5A 补充的六维、E1-5C 的健康项（S = (1 − γ)·B + γ·H）与日常生活便利（物质第三项：s = min(c, q/(q + τ))，
        q 是实际减少的家务小时，DECISIONS/0033），合成方案；E1-6A 的跨月汇总只读它的逐月结果
    material_preference_aggregation: {state: undecided}
    energy_feedback:
      state: undecided
      settled_parts:
        - "月度精力额度约束：当月实际活动负担 ≤ 当月可承受额度；不结转、不回血（DECISIONS/0020）"
        - "探索版年度反馈：下一年额度 = 基础额度 × (1 + α × 上一年完整年度满足感)，向下保留到 0.01（DECISIONS/0021，仅用于合成探索）"
      open_parts:
        - "反馈的方向与幅度的经验标定、α 的取值；是否允许低于基础额度"
    income_payment_timing:
      state: decided
      decision_ref: DECISIONS/0017
    risk_scenarios:
      state: undecided
      settled_parts:
        - "E1-5C 合成探索版：健康 / 小病 / 大病三种状态，一次一病；指定事件与配对随机数（DECISIONS/0027）"
      open_parts:
        - 概率、恢复期与治疗效果的经验标定
    discounting:
      state: undecided
      settled_parts:
        - "E1-6A 合成探索版：评价规格显式声明月度时间权重 δ（主设定 δ = 1，非 1 对照只验证机制；DECISIONS/0028）"
      open_parts:
        - δ 的实证依据；是否区分用户自己的未来取舍与报告折现
    terminal_value:
      state: undecided
      settled_parts:
        - "E1-6A 合成探索版：从真实终态出发，按预先声明的少量参考方案在 12 个月估值期里真实结算与评分，取参考集合内最高（DECISIONS/0028）"
      open_parts:
        - 估值期长度与参考方案集合的依据；估值期之后的剩余资产；未完成课程的潜力
    failure_handling:
      state: undecided
      settled_parts:
        - 付不起最低住房与最低食品（两项合计）→ 出局；钱恰好够则通过
        - 时间或精力超限 → 计划不可行（DECISIONS/0020）
        - 反馈开着而上一年没有完整评分 → 反馈信息不足，当年结算保留（DECISIONS/0021）
        - 年初无事件试算不可行 → 计划问题；疾病之后应急安排不足或资料缺口 → 停在那个月（DECISIONS/0027）
        - "评价口径（所有者 2026-10-11，DECISIONS/0028）：确认的生活出局不进城市平均、不当未知分数；模拟问题造成的未完成计算另作不确定性分析；停止不自动改称出局"
      open_parts:
        - 规划修订、调度与批次失败见 E1-7A（DECISIONS/0030）；真实模型的服务重试、预算与停下见 E1-7B（DECISIONS/0031）
  resource_rules:
    version: e1-4a-monthly-resources-v1
    time_unit: hour
    month_rule: annual_net_hours_div_12
    reserved_time: >-
      净可分配小时已预留每天 8 小时睡眠与 4 小时基本休息（吃饭、洗漱、个人照料），按 365 天计；
      这些不再进活动账
    energy_unit: burden_point
    energy_scale_version: e1-4a-monthly-quota-v1
    commute_minutes_key: commute_roundtrip_minutes
    commute_reference: >-
      每座合成城只有一个到岗工作地点（城市就业中心的抽象）：住房写明的往返分钟就是到那里的往返，
      所有需要到岗的岗位都在那里；不做地图与路线规划
    commute_burden_per_hour: 0.75
    household_tasks:
      - {task: laundry, baseline_hours_per_month: 12, burden_per_hour: 0.5,
         description: 洗衣：没有设备或服务时，自己手洗或去自助洗衣店，连同晾晒、叠放与收纳}
      - {task: cleaning, baseline_hours_per_month: 10, burden_per_hour: 0.6,
         description: 打扫：自己打扫一居室（扫地、拖地、整理）}
    source: &rules
      kind: synthetic
      observed_on: 2026-10-18
      geography_scope: synthetic city (no real geography)
      mapping_version: synthetic-e1-convenience
      synthetic_note: 手工设定的规则、负担系数、职业、目标、疾病与恢复规则，不是时间利用调查、医疗资料、价格资料或制度的标定
  energy_feedback:
    policy_id: feedback.e3a-product.main
    version: e1-4b-satisfaction-quota-v1
    mode: enabled
    alpha: 0.10
    formula: base_times_one_plus_alpha_s
    lag_years: 1
    score_statistic: complete_year_mean_u
    scoring_spec_id: score.e1-life.explore
    scoring_version: e1-life-v1
    # 评分内容身份（DECISIONS/0025）：scoring_product.yaml 的规格的内容身份。规格一改（τ、c、任务组合……）这里就要换，
    # 并从共同初始状态重跑。
    scoring_content_fingerprint: 8444d8d20d88e0bacf492990dc66d4183983e973a840e6473718287b73f2baa8
    preference_source: product_confirmed_six_dim
    quantization: floor_to_0.01
    source: *rules
    note: 沿用 E1-4B 的合成探索参数 α = 0.10；E1-6A 估值期的额度用第 3 年的完整年度满足感按同一公式重算
  career_rules:
    version: e1-5a-career-v1
    attendance: planned_month_fee_settled
    completion: participated_months_reach_required
    grant: union_by_ability_id
    effective_from: next_action_year
    qualification_basis: year_start_state
    job_access: deterministic_if_available_and_qualified
    abilities:
      - ability_id: accounting_cert
        kind: credential
        label: 会计从业资格（合成）
        description: 参加满 12 个月的会计资格课程后取得的证书；会计岗位要求它
        scope: {kind: general}
        source: *rules
    employers:
      - {employer_id: firm.office51, label: 合成写字楼（K51）, city: {country: US, scheme: SYNTH2026, code: K51}, source: *rules}
      - {employer_id: firm.audit51, label: 合成会计事务所（K51）, city: {country: US, scheme: SYNTH2026, code: K51}, source: *rules}
      - {employer_id: firm.shop51, label: 合成百货（K51）, city: {country: US, scheme: SYNTH2026, code: K51}, source: *rules}
      - {employer_id: firm.office52, label: 合成写字楼（M52）, city: {country: US, scheme: SYNTH2026, code: M52}, source: *rules}
      - {employer_id: firm.audit52, label: 合成会计事务所（M52）, city: {country: US, scheme: SYNTH2026, code: M52}, source: *rules}
      - {employer_id: firm.shop52, label: 合成百货（M52）, city: {country: US, scheme: SYNTH2026, code: M52}, source: *rules}
    source: *rules
    note: 沿用 E1-5A 的合成职业规则：一门会计课、会计岗位要求会计资格
  savings_rules:
    version: e1-5b-savings-goals-v1
    goal_kinds: [durable_purchase, training_tuition]
    max_open_goals: 1
    changes: year_start_plan_only
    funding: single_cash_ledger_no_earmark
    progress: month_end_cash_vs_current_quote
    realization: linked_executed_full_payment
    due: record_unrealized_at_target_month_end
    automatic: none
    source: *rules
    note: 沿用 E1-5B 的目标规则；开局没有目标，分身可以自己设
  health_rules:
    version: e1-5c-health-v1
    states: healthy_minor_major
    concurrency: one_illness_at_a_time
    onset: new_events_only_in_healthy_months
    month_state: month_start_state_sets_month
    treatment_effect: recover_at_end_of_treated_month
    treatment_offer: only_when_it_shortens_the_course
    charge: once_per_treated_illness
    payment_order: minimum_check_housing_food_then_treatment_then_other
    pause_rule: declared_order_as_needed_then_skip_treatment_then_stop
    minor:
      severity: minor
      work: continues
      participation: as_planned
      untreated_months: 2
      recovery_hours_per_month: 10
      recovery_burden_per_hour: 2.0
      description: 小病：照常上班；不治疗持续 2 个月；每个病月本人额外花 10 小时恢复，每小时负担 2.0（合成）
    major:
      severity: major
      work: sick_leave_unpaid
      participation: paused
      untreated_months: 3
      recovery_hours_per_month: 60
      recovery_burden_per_hour: 1.0
      description: 大病：整月病假、没有工资；暂停有参与时间的主动活动；不治疗持续 3 个月；每个病月恢复 60 小时 × 1.0（合成）
    treatment_needs:
      - {severity: minor, need_id: minor_illness_care, description: 小病的门诊与药物：接受后当月月末恢复（全组共用的疗效）}
      - {severity: major, need_id: major_illness_care, description: 大病的住院治疗：接受后当月月末恢复（全组共用的疗效）}
    risk:
      unit: per_month
      burden_measure: previous_month_work_relative_burden
      history_window_months: 1
      first_month_burden_band: moderate
      age_rule: integer_age_plus_one_per_year
      age_bands:
        - {band_id: under_40, min_age: 14, max_age: 39}
        - {band_id: age_40_59, min_age: 40, max_age: 59}
        - {band_id: age_60_plus, min_age: 60}
      burden_bands:
        - {band_id: light, lower: 0, upper: 0.4}
        - {band_id: moderate, lower: 0.4, upper: 0.7}
        - {band_id: heavy, lower: 0.7}
      cells:
        - {age_band: under_40, burden_band: light, minor: 0.02, major: 0.002}
        - {age_band: under_40, burden_band: moderate, minor: 0.03, major: 0.004}
        - {age_band: under_40, burden_band: heavy, minor: 0.05, major: 0.008}
        - {age_band: age_40_59, burden_band: light, minor: 0.03, major: 0.004}
        - {age_band: age_40_59, burden_band: moderate, minor: 0.045, major: 0.007}
        - {age_band: age_40_59, burden_band: heavy, minor: 0.07, major: 0.012}
        - {age_band: age_60_plus, burden_band: light, minor: 0.045, major: 0.008}
        - {age_band: age_60_plus, burden_band: moderate, minor: 0.065, major: 0.012}
        - {age_band: age_60_plus, burden_band: heavy, minor: 0.10, major: 0.02}
    source: *rules
    note: 合成探索规则，与 E1-5C 样例逐项相同（内容指纹相同）；不是医学或流行病学结论
  illness_events:
    mode: none
    stream_version: e1-5c-illness-stream-v1
    note: 受控主场景：不发生新疾病（先观察日常生活便利的选择）；疾病规则照常声明，离线测试另用指定事件检验生病时取消购买与暂停
  health_input:
    kind: independent_health_answers
    semantics: independent_health_answers_v1
    questionnaire_version: e3a-health-coping-q-v0.1-draft
    use: agent_planning_information_only
    note: >-
      健康回答是独立的健康风险应对问卷（e3a-health-coping-q-v0.1-draft），不占六维 100 分、不是第七个评分权重；只供分身做计划，
      结算、风险抽签与评分都不读它

consumption_needs: [housing_space, food_life, daily_convenience, personal_enjoyment]
categories: [housing, food, durable, job, training, experience, service]
functions: [housing, food]
# 生活扩展（DECISIONS/0041）的公开词表：菜系、休闲活动类别、装备能力、享受功能。机会只能用这里声明过的键；怎样换算成满足感只在评分规格里。
cuisines: [home_style, sichuan, italian]
leisure_categories: [music, racket_sports, arts_culture, culinary, fitness]
capabilities: [guitar_playable, racket_playable]
enjoyment_functions: [home_comfort, personal_care]

tax_policies:
  - policy_id: tax.synth.e1conv
    status: synthetic_test_double
    money_basis_id: USD_2024_LOCAL
    applies_to: {path: [US, ZF]}
    brackets: [{lower: 0, rate: 0.0}, {lower: 12000, rate: 0.1}, {lower: 30000, rate: 0.2}]
    note: >-
      合成测试替身：全年应税收入 12,000 以内 0%，12,000–30,000 的部分 10%，超过 30,000 的部分 20%；按当年累计工资逐月预扣
      （累计到某个月的应纳税额减去之前已扣的）。不对应任何真实税制

