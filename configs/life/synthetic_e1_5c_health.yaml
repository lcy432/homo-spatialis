# ---------------------------------------------------------------------- 手算（合成）
# 基本生活每月：收入 1,500（年 18,000 < 40,000，税 0）；远处一居室 1,000 + 基本食品 380 = 1,380；净存 120。
# 资源（每月，基本生活）：兼职 80 h × 1.0 = 80；通勤 70 分钟 × 10 次 / 60 = 11.67 h × 0.75 = 8.75；基本食品 30 h × 0.5 = 15；
#   洗衣 12 h × 0.5 = 6；打扫 10 h × 0.6 = 6；合计 115.75 ≤ 250。小病月加恢复 10 h × 2.0 = 20、门诊 2 h × 1.0 = 2；大病月没有工作与
#   通勤，加恢复 60 h × 1.0 = 60、住院 8 h × 1.0 = 8。
# u91（A91）：500 → 第 1、2 月 620、740；第 3 月小病：740 + 1,500 − 1,380 − 300 = 560（治疗，月末恢复）；年末 560 + 9 × 120 = 1,640。
# u91（B92）：第 3 月小病，计划治而门诊资料未知 → 资料缺口，停在第 3 月；保留第 1、2 月（余额 740），不是看不起病。
# u92：第 3、4 月小病不治（每月多 20 负担，不付钱）；第 4 月月末自然恢复；年末 500 + 12 × 120 = 1,940。
# u93：0 → 第 1 月小病：住房食品之后 120 < 300，治不起；第 2 月仍是小病，但本来就在月末结束——治疗没有作用、不购买；年末 1,440。
# u94：3,000 → 第 4 月末 3,480；第 5 月大病：没有工资，3,480 − 1,380 − 2,000 = 100（住院，月末恢复）；年末 100 + 7 × 120 = 940。
# u95：第 5 月大病不治：3,480 − 1,380 = 2,100；第 6 月 720；第 7 月没有工资，720 < 1,380 → 出局（缺 660）。
# u96：5,000 → 第 1 月 5,000 + 1,500 − 1,380 − 1,200 = 3,920；第 3 月末 4,160；第 4 月大病：4,160 − 1,380 − 2,000 = 780（停课、病假、
#   住院）；年末 780 + 8 × 120 = 1,740；课程参加 11/12；第 2 年第 1 月学完（不再收学费），能力第 3 年起可用；第 2 年末 3,180。
# u97：4,000 → 第 11 月末 5,320；第 12 月大病不治：5,320 − 1,380 = 3,940；第 2 年第 1 月 2,560、第 2 月 1,180（第 2 月月末自然
#   恢复）；第 6 月 1,660 < 2,400 → 购买被拒、目标到期未兑现；第 2 年末 2,380。第 3 年改时点到第 3 月：2,740 − 2,400 = 340（兑现）；
#   第 12 月小病不治（照常上班）；年末 1,420；终态带着没好的小病（病了 1 个月），不自动痊愈。
# u98：会计每月 3,000（年 36,000 < 40,000，税 0）；住房食品 1,380 + 健身 60 → 每月净存 1,560；第 4 月末 7,240。资源：工作 160 × 1.1
#   = 176、通勤 70 × 20 / 60 = 23.33 h × 0.75 = 17.5、食品 15、洗衣 6、打扫 6、健身 8 × 1.5 × 1.0 = 12，合计 232.5。第 5 月小病：
#   加恢复 20 与门诊 2 = 254.5 > 250；没有可暂停的活动；放弃治疗仍是 252.5 > 250 → 停在第 5 月（第 1–4 月保留）。
# u99：同样的生活，暂停顺序列了健身：第 5 月暂停健身（不付款）：176 + 17.5 + 15 + 6 + 6 + 20 + 2 = 242.5 ≤ 250，门诊 300；
#   余额 7,240 + 3,000 − 1,380 − 300 = 8,560；年末 8,560 + 7 × 1,560 = 19,480。
