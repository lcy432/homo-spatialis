# E1-5C 疾病、应急与恢复的合成生活样例（DECISIONS/0027）。评分配置另存在 scoring_e1_5c_health.yaml。
#
# **纯合成。** 城市、报价、工资、学费、时长、负担、疾病概率、恢复期与治疗价格全部手工设定，不来自任何真实城市、医疗资料、
# 职业数据或 LLM；不是医学结论。税档设成年收入 40,000 以内 0%（合成测试替身），让每个月的现金流可以直接手算。**不是现实
# 结论，也不排序城市。**
#
# 生活规则 e1-5c-monthly-health-v1 = E1-5B（学习、岗位、月度资源、年度反馈、目标储蓄）+ 疾病、应急与恢复。
# 事件来源是"指定事件"（先用确定的事件检验）；配对随机数的一臂由演示从同一个初始状态另开（只换 illness_events）。
#
# 九个人、十个分身（全部 35 岁，重复序号 0）。基本生活：远处一居室 1,000 + 基本食品 380；门店兼职每月 1,500，净存 120。
#   u91  第 1 年第 3 月小病，计划"条件允许就治"：A91 门诊 300 → 当月月末恢复；B92 的小病治疗资料未知 → 资料缺口，停在第 3 月
#   u92  第 3 月小病，计划"不治"：病 2 个月（第 3、4 月），第 4 月月末自然恢复
#   u93  开局没钱；第 1 月小病：住房食品之后只剩 120 < 300，治不起；第 2 月治疗已经没用（本来就在月末结束）
#   u94  第 5 月大病，计划治：整月病假没有工资，住院 2,000，月末恢复
#   u95  第 5 月大病，计划不治：病假 3 个月，第 7 月付不起最低生活而出局
#   u96  上会计课时第 4 月大病：病假、停课、住院，第 5 月复课；第 1 年参加 11 个月，第 2 年第 1 月学完
#   u97  第 1 年第 12 月大病不治，跨年病到第 2 年第 2 月；病假少挣的钱让第 2 年第 6 月的洗烘一体机目标逾期；第 3 年第 12 月
#        小病不治，带着没好的病进入终态
#   u98  全职会计 + 每月健身卡（没有列进暂停顺序）：第 5 月小病，加上恢复负担超出精力额度 → 停在第 5 月
#   u99  同样的生活，但把健身列进暂停顺序：第 5 月暂停健身、治疗，照常过完一年
# 手算见文末。

fixture_notice: >-
  synthetic_fixture_only：E1-5C 疾病、应急与恢复样例。报价、工资、学费、时长、负担、疾病概率、恢复期、治疗价格与税档全部
  手工合成，不对应任何真实地点、医疗服务、雇主或制度；不是医学诊断或医疗建议。

protocol:
  protocol_id: life-v1-e1-5c-health
  schema_version: e1-5c-health-draft
  life_rules_version: e1-5c-monthly-health-v1
  scoring_scale_version: e1-5c-health-v1
  info_permission_version: e1-5c-draft
  status: synthetic_fixture_only
  simulation_years: 3
  math_policies:
    score_mapping:
      state: undecided
      proposal: >-
        E1-3 探索映射（ADR0018、ADR0019）加 E1-5A 补充（DECISIONS/0024）的六维；E1-5C（DECISIONS/0027）加全组共用的健康项：
        S = (1 − γ)·B + γ·H(月初状态)，γ = 0.2，H = 1 / 0.5 / 0（合成方案）
    material_preference_aggregation: {state: undecided}
    energy_feedback:
      state: undecided
      settled_parts:
        - "月度精力额度约束：当月实际活动负担 ≤ 当月可承受额度；不结转、不回血（DECISIONS/0020）"
        - "探索版年度反馈：下一年额度 = 基础额度 × (1 + α × 上一年完整年度满足感)，向下保留到 0.01（DECISIONS/0021，仅用于合成探索）"
      open_parts:
        - "反馈的方向与幅度的经验标定、α 的取值；是否允许低于基础额度"
    income_payment_timing:
      state: decided
      decision_ref: DECISIONS/0017
    risk_scenarios:
      state: undecided
      settled_parts:
        - "E1-5C 合成探索版：健康 / 小病 / 大病三种状态，一次一病；月概率按年龄段 × 上月实际工作相对负担；指定事件与配对随机数（DECISIONS/0027）"
      open_parts:
        - 概率、恢复期与治疗效果的经验标定；慢性病、多病叠加、伤残与死亡（不在本轮）
    discounting: {state: undecided}
    terminal_value:
      state: undecided
      open_parts:
        - 期末未花的现金、未兑现的目标、物品残值与期末仍未恢复的疾病怎样评价（E1-6）
    failure_handling:
      state: undecided
      settled_parts:
        - 付不起最低住房与最低食品（两项合计）→ 出局；钱恰好够则通过
        - 时间或精力超限 → 计划不可行（DECISIONS/0020）
        - 反馈开着而上一年没有完整评分 → 反馈信息不足，当年结算保留（DECISIONS/0021）
        - 计划里写了年初不满足要求的项目 → 输入错误，整份计划退回（DECISIONS/0023）
        - 资金目标的指令或关联不成立 → 输入错误，整份计划退回；目标到期未兑现只记录，不出局（DECISIONS/0026）
        - 年初无事件试算不可行 → 计划问题，什么都不提交；疾病之后应急安排不足或资料缺口 → 停在那个月，之前的生活保留（DECISIONS/0027）
      open_parts:
        - LLM 格式错误的有限重试与重试后的默认动作（E1-7）
        - 计划退回之后与停止之后的重试（E1-7）
        - 出局、停止的月份与剩余期间如何计分（E1-6）
  resource_rules:
    version: e1-4a-monthly-resources-v1
    time_unit: hour
    month_rule: annual_net_hours_div_12
    reserved_time: >-
      净可分配小时已预留每天 8 小时睡眠与 4 小时基本休息（吃饭、洗漱、个人照料），按 365 天计；
      这些不再进活动账
    energy_unit: burden_point
    energy_scale_version: e1-4a-monthly-quota-v1
    commute_minutes_key: commute_roundtrip_minutes
    commute_reference: >-
      每座合成城只有一个到岗工作地点（城市就业中心的抽象）：住房写明的往返分钟就是到那里的往返，
      所有需要到岗的岗位都在那里；不做地图与路线规划
    commute_burden_per_hour: 0.75
    household_tasks:
      - {task: laundry, baseline_hours_per_month: 12, burden_per_hour: 0.5,
         description: 没有洗衣设备或洗衣服务时，自己手洗或去自助洗衣店}
      - {task: cleaning, baseline_hours_per_month: 10, burden_per_hour: 0.6,
         description: 自己打扫一居室}
    source: &rules
      kind: synthetic
      observed_on: 2026-10-11
      geography_scope: synthetic city (no real geography)
      mapping_version: synthetic-e1-5c-health
      synthetic_note: 手工设定的规则、负担系数、职业、目标、疾病与恢复规则，不是时间利用调查、医疗资料、价格资料或制度的标定
  energy_feedback:
    policy_id: feedback.e1-5c.main
    version: e1-4b-satisfaction-quota-v1
    mode: enabled
    alpha: 0.10
    formula: base_times_one_plus_alpha_s
    lag_years: 1
    score_statistic: complete_year_mean_u
    scoring_spec_id: score.e1-5c.explore
    scoring_version: e1-5c-health-v1
    # 评分内容身份（DECISIONS/0025）：scoring_e1_5c_health.yaml 里规格的 LifeScoringSpec.content_fingerprint。新评分版本（六维 +
    # 健康项）是另一套评分内容；γ = 0 对照要换这一行，那就是另一个实验身份。
    scoring_content_fingerprint: bf5fabac734d8784f2e4d350182861b8a6279c88b8d59ab51aae529821ec2dae
    preference_source: product_stated_numeric
    quantization: floor_to_0.01
    source: *rules
    note: 沿用 E1-4B 的合成探索参数 α = 0.10；新评分的尺度不同，下一年额度也会跟着不同（这是预期的，DECISIONS/0027）
  career_rules:
    version: e1-5a-career-v1
    attendance: planned_month_fee_settled
    completion: participated_months_reach_required
    grant: union_by_ability_id
    effective_from: next_action_year
    qualification_basis: year_start_state
    job_access: deterministic_if_available_and_qualified
    abilities:
      - ability_id: accounting_cert
        kind: credential
        label: 会计从业资格（合成）
        description: 通过会计资格课程后取得的证书；会计岗位要求它
        scope: {kind: general}
        source: *rules
    employers:
      - {employer_id: firm.shop91, label: 街角百货（合成）, city: {country: US, scheme: SYNTH2026, code: A91}, source: *rules}
      - {employer_id: firm.cafe91, label: 周末咖啡馆（合成）, city: {country: US, scheme: SYNTH2026, code: A91}, source: *rules}
      - {employer_id: firm.office91, label: 合成办公室（合成）, city: {country: US, scheme: SYNTH2026, code: A91}, source: *rules}
      - {employer_id: firm.shop92, label: 河边百货（合成）, city: {country: US, scheme: SYNTH2026, code: B92}, source: *rules}
    source: *rules
    note: 沿用 E1-5A 的合成职业规则；本样例只用一门会计课、一个会计岗位与两份兼职
  savings_rules:
    version: e1-5b-savings-goals-v1
    goal_kinds: [durable_purchase, training_tuition]
    max_open_goals: 1
    changes: year_start_plan_only
    funding: single_cash_ledger_no_earmark
    progress: month_end_cash_vs_current_quote
    realization: linked_executed_full_payment
    due: record_unrealized_at_target_month_end
    automatic: none
    source: *rules
    note: 沿用 E1-5B 的目标规则：医疗花费与病假少挣的钱都从同一本现金账里体现，目标不圈钱、不自动延期
  health_rules:
    version: e1-5c-health-v1
    states: healthy_minor_major
    concurrency: one_illness_at_a_time
    onset: new_events_only_in_healthy_months
    month_state: month_start_state_sets_month
    treatment_effect: recover_at_end_of_treated_month
    treatment_offer: only_when_it_shortens_the_course
    charge: once_per_treated_illness
    payment_order: minimum_check_housing_food_then_treatment_then_other
    pause_rule: declared_order_as_needed_then_skip_treatment_then_stop
    minor:
      severity: minor
      work: continues
      participation: as_planned
      untreated_months: 2
      recovery_hours_per_month: 10
      recovery_burden_per_hour: 2.0
      description: 小病：照常上班；不治疗持续 2 个月；每个病月本人额外花 10 小时恢复，每小时负担 2.0（合成）
    major:
      severity: major
      work: sick_leave_unpaid
      participation: paused
      untreated_months: 3
      recovery_hours_per_month: 60
      recovery_burden_per_hour: 1.0
      description: 大病：整月病假、没有工资；暂停有参与时间的主动活动；不治疗持续 3 个月；每个病月恢复 60 小时 × 1.0（合成）
    treatment_needs:
      - {severity: minor, need_id: minor_illness_care, description: 小病的门诊与药物：接受后当月月末恢复（全组共用的疗效）}
      - {severity: major, need_id: major_illness_care, description: 大病的住院治疗：接受后当月月末恢复（全组共用的疗效）}
    risk:
      unit: per_month
      burden_measure: previous_month_work_relative_burden
      history_window_months: 1
      first_month_burden_band: moderate
      age_rule: integer_age_plus_one_per_year
      age_bands:
        - {band_id: under_40, min_age: 14, max_age: 39}
        - {band_id: age_40_59, min_age: 40, max_age: 59}
        - {band_id: age_60_plus, min_age: 60}
      burden_bands:
        - {band_id: light, lower: 0, upper: 0.4}
        - {band_id: moderate, lower: 0.4, upper: 0.7}
        - {band_id: heavy, lower: 0.7}
      cells:
        - {age_band: under_40, burden_band: light, minor: 0.02, major: 0.002}
        - {age_band: under_40, burden_band: moderate, minor: 0.03, major: 0.004}
        - {age_band: under_40, burden_band: heavy, minor: 0.05, major: 0.008}
        - {age_band: age_40_59, burden_band: light, minor: 0.03, major: 0.004}
        - {age_band: age_40_59, burden_band: moderate, minor: 0.045, major: 0.007}
        - {age_band: age_40_59, burden_band: heavy, minor: 0.07, major: 0.012}
        - {age_band: age_60_plus, burden_band: light, minor: 0.045, major: 0.008}
        - {age_band: age_60_plus, burden_band: moderate, minor: 0.065, major: 0.012}
        - {age_band: age_60_plus, burden_band: heavy, minor: 0.10, major: 0.02}
    source: *rules
    note: >-
      合成探索规则：月概率、病程、恢复负担与疗效都是手工设定，不是医学或流行病学结论；概率表与疾病—工作负担的关系默认
      不告诉代理
  illness_events:
    mode: injected
    stream_version: e1-5c-illness-stream-v1
    injected:
      - {person_id: u91, repeat_index: 0, year_index: 1, month: 3, severity: minor, note: 故事一：小病，两座城同一个人同一件事}
      - {person_id: u92, repeat_index: 0, year_index: 1, month: 3, severity: minor, note: 小病，计划不治}
      - {person_id: u93, repeat_index: 0, year_index: 1, month: 1, severity: minor, note: 小病，治不起}
      - {person_id: u94, repeat_index: 0, year_index: 1, month: 5, severity: major, note: 大病，计划治}
      - {person_id: u95, repeat_index: 0, year_index: 1, month: 5, severity: major, note: 大病，计划不治}
      - {person_id: u96, repeat_index: 0, year_index: 1, month: 4, severity: major, note: 上课时大病}
      - {person_id: u97, repeat_index: 0, year_index: 1, month: 12, severity: major, note: 年末大病，跨年}
      - {person_id: u97, repeat_index: 0, year_index: 3, month: 12, severity: minor, note: 最后一个月小病，带进终态}
      - {person_id: u98, repeat_index: 0, year_index: 1, month: 5, severity: minor, note: 小病，应急安排不足}
      - {person_id: u99, repeat_index: 0, year_index: 1, month: 5, severity: minor, note: 小病，按暂停顺序让出健身}
    note: 先用确定的指定事件检验疾病处理器；配对随机数的一臂由演示另开（只换这一项，从共同初始状态重跑）
  health_input:
    dimension: healthcare
    semantics: health_risk_coping_v1
    use: agent_planning_information_only
    question_text: "健康风险应对：生病或可能生病时，你愿意为及时治疗、预防和给自己留余地付出多少（钱、时间、少做别的事）？给这一项的点数越多，分身做计划时越看重应对健康风险。它不改变生病的概率、病有多难受或治疗效果，也不进入生活满足感"
    note: 新协议重新询问这一项；旧问卷的"医疗可及性"答案不能改读成这个含义

