# E1-6A 单分身跨期评价的评价规格 v2（DECISIONS/0029：E1-6A 收尾 F3）。生活输入在 synthetic_e1_6a_evaluation.yaml，评分配置在
# scoring_e1_6a_evaluation.yaml。旧的 v1 规格 evaluation_e1_6a.yaml 原样保留作历史（当前代码不再执行 v1 / r1）。
#
# 与 v1 的区别只有一处：参考方案改为不含治疗选择的**基础生活模板**，治疗选择是独立的估值分支——
#   估值期初健康：每个模板一个分支（没有新发疾病，治疗选择"未触发"，不代表偏好）；
#   估值期初带病：每个模板展开"条件允许就治"（模板.treat）与"不治疗"（模板.decline）两个分支，只针对这场病。
# 原来的 p5（基本生活、生病不治疗）就是 p1 的不治疗分支，所以这里只剩四个模板：健康期初 4 次试算，带病期初 8 次。
#
#   L_actual    = Σ_m δ^(m−1) S_m ÷ Σ_m δ^(m−1)，m = 1..T，T = 12N（T 个月都有合法评分才给）
#   V_p         = Σ_k δ^(k−1) S_future[p,k] ÷ Σ_k δ^(k−1)，k = 1..H（分支 p 在估值期里真实结算、评分）
#   V_reference = 参考集合内能完整执行、完整评分、已知满足硬要求的最高 V_p（有无法评价的分支就不给）
#   J           = [Σ_m δ^(m−1) S_m + Σ_k δ^(T+k−1) S_future[k]] ÷ (W_actual + W_future)
#
# **全部是合成探索设定。** δ = 1、H = 12、"估值期没有新发疾病"、四个模板与各城绑定都是为检验机制手工选的，不是用户的未来
# 取舍、不是现实估计，不能用来排序城市。V_reference 是参考集合内的最高可实现评分，不是预测，也不是全局最优，也不声称分身
# 实际一定会这样选择。

evaluation_notice: >-
  exploratory_synthetic：E1-6A 跨期评价规格。月度时间权重 δ、估值期长度 H、估值期事件条件、参考方案与槽位绑定全部是
  合成探索设定，不代表任何人的真实时间偏好或未来生活，不能用于城市排序。v2：生活模板与治疗分支分开。

spec:
  spec_id: eval.e1-6a.v2.main
  version: e1-6a-evaluation-v2
  status: exploratory_synthetic
  execution_revision: e1-6a-r2
  monthly_discount_factor: "1"
  valuation_horizon_months: 12
  valuation_event_condition: no_new_illness
  treatment_branching: by_continuing_illness_v1
  selection_rule: best_complete_feasible_in_reference_set
  combination: month_weighted_actual_plus_reference_v1
  note: >-
    主设定 δ = 1：每个月同等重要（实际 36 个月与估值 12 个月逐月同权）。估值期只评价 12 个月，之后的剩余资产不追加第二次
    终值，所以会低估更长远的收益；基础生活模板只有四个（治疗选择是独立分支），不新开课程、不续学未完成的课程。
  slots:
    - {slot_id: housing_basic, role: housing, description: 基本住房：离工作地远、房租较低的一居室}
    - {slot_id: housing_comfort, role: housing, description: 较舒适的住房：离工作地近、房租较高的一居室}
    - {slot_id: food_basic, role: food, description: 基本食品方案}
    - {slot_id: food_comfort, role: food, description: 新鲜食材方案}
    - {slot_id: exercise, role: service, description: 健身房月卡（声明了每月锻炼次数的按月服务）}
    - {slot_id: laundry_appliance, role: durable, description: 长寿命的洗衣设备（洗烘一体机）；已持有在用就不再买}
    - {slot_id: qualified_job, role: job, description: 要求会计资格的全职岗位（只有估值期初已经合格才适用）}
  life_templates:
    - template_id: p1_current_basic
      label: 现职 + 基本生活
      jobs: current_positions
      housing_slot: housing_basic
      food_slot: food_basic
      description: 延续终态里的当前岗位，远处住房、基本食品
    - template_id: p2_current_comfort
      label: 现职 + 较舒适的生活
      jobs: current_positions
      housing_slot: housing_comfort
      food_slot: food_comfort
      service_slots: [exercise]
      durable_purchases: [{slot_id: laundry_appliance, month: 1, rule: buy_if_not_held}]
      description: 延续当前岗位，近处住房、新鲜食材、健身；没有在用的洗衣设备就在第 1 月买一台
    - template_id: p3_qualified_basic
      label: 改做已具资格的岗位 + 基本生活
      jobs: qualified_alternative
      job_slot: qualified_job
      housing_slot: housing_basic
      food_slot: food_basic
      description: 估值期初已具会计资格才适用：改做会计，远处住房、基本食品
    - template_id: p4_qualified_comfort
      label: 改做已具资格的岗位 + 较舒适的生活
      jobs: qualified_alternative
      job_slot: qualified_job
      housing_slot: housing_comfort
      food_slot: food_comfort
      service_slots: [exercise]
      durable_purchases: [{slot_id: laundry_appliance, month: 1, rule: buy_if_not_held}]
      description: 估值期初已具会计资格才适用：改做会计，近处住房、新鲜食材、健身，没有洗衣设备就买
  city_bindings:
    - city: {country: US, scheme: SYNTH2026, code: A93}
      targets:
        - {slot_id: housing_basic, status: opportunity, opportunity_id: a93.housing.far}
        - {slot_id: housing_comfort, status: opportunity, opportunity_id: a93.housing.near}
        - {slot_id: food_basic, status: opportunity, opportunity_id: a93.food.basic}
        - {slot_id: food_comfort, status: opportunity, opportunity_id: a93.food.fresh}
        - {slot_id: exercise, status: opportunity, opportunity_id: a93.service.gym}
        - {slot_id: laundry_appliance, status: opportunity, opportunity_id: a93.durable.washer_dryer}
        - {slot_id: qualified_job, status: opportunity, opportunity_id: a93.job.accountant_office}
    - city: {country: US, scheme: SYNTH2026, code: B94}
      targets:
        - {slot_id: housing_basic, status: opportunity, opportunity_id: b94.housing.far}
        - {slot_id: housing_comfort, status: opportunity, opportunity_id: b94.housing.near}
        - {slot_id: food_basic, status: opportunity, opportunity_id: b94.food.basic}
        - {slot_id: food_comfort, status: opportunity, opportunity_id: b94.food.fresh}
        - {slot_id: exercise, status: opportunity, opportunity_id: b94.service.gym}
        - {slot_id: laundry_appliance, status: opportunity, opportunity_id: b94.durable.washer_dryer}
        - {slot_id: qualified_job, status: unavailable, reason: 合成情景：B94 的目录里确定没有要求会计资格的岗位}
