# E1-3 增补的合成生活样例（DECISIONS/0019）。评分配置另存在 scoring_e1_3s.yaml。
#
# **纯合成。** 城市、价格、规格、工作、偏好全部手工设定，不来自任何真实城市、数据源或 LLM。
# 数字故意取整，方便手算（见文末）。**不是现实城市的幸福估计，不能用来排序城市。**
#
# 与 E1-3 样例（synthetic_e1_3.yaml，保留不动）的区别：
#   * 机会声明了需求功能 functions（通信、工作设备、洗衣、储物、工作空间……）与暂不评价的方案属性
#     attributes（品牌、档次、菜系、准备方式）；两部手机都是"通信"，第二部不再加分；
#   * 住房方案把月租与每工作日往返分钟写成同一方案的事实：近处 1,400 / 30 分钟，远处 1,000 / 70 分钟，
#     住房条件相同；工作写明工作方式 work_mode（onsite / remote）；
#   * 原来的"耐用品"一个叶子拆成通信 / 工作设备 / 洗衣 / 储物四个叶子，每个人都**明确给了点数**——
#     不是把旧权重均分；
#   * 保洁服务只记录功能与时间事实，对应的"家务"需求本轮没有评分分项（未支持的需求）。
#
# 2026-10-08 迁移（DECISIONS/0019 第十二节，边界修复）：补两类**元数据**，所有数值不变——
#   * function_kinds：评分要用的需求功能声明数量语义（存在型 / 容量型）；
#   * 每座城的 function_supply：评分要用的功能是可得、确定不可得还是资料未知。目录里没有记录
#     不等于确定没有，所以要逐城写明。这里的声明是合成设定（目录已列出的就是这座合成城的全部方案）。

fixture_notice: >-
  synthetic_fixture_only：E1-3 增补样例。城市、价格、规格、工作、偏好全部手工合成，不对应任何真实地点；
  税是合成测试替身；评分参数是合成探索设定，不是现实标定；租金与通勤分钟是合成情景，不是现实租金斜率。

protocol:
  protocol_id: life-v1-e1-3s
  schema_version: e1-3s-draft
  life_rules_version: e1-2-monthly-v1
  scoring_scale_version: e1-3-supplement-v1
  info_permission_version: e1-3-draft
  status: synthetic_fixture_only
  simulation_years: 3
  math_policies:
    score_mapping:
      state: undecided
      proposal: "E1-3 探索版与增补（ADR0018、ADR0019）：s = min(c, z/(z+τ))，环境景观与方案级通勤为局部映射；仅用于合成探索"
    material_preference_aggregation:
      state: undecided
      proposal: "物质细项线性加权；功能叶子用 any 去重、容量型按声明的容量相加（ADR0019）；仅用于合成探索"
    energy_feedback: {state: undecided}
    income_payment_timing:
      state: decided
      decision_ref: DECISIONS/0017
    risk_scenarios: {state: undecided}
    discounting: {state: undecided}
    terminal_value: {state: undecided}
    failure_handling:
      state: undecided
      settled_parts:
        - 付不起最低住房与最低食品（两项合计）→ 出局；钱恰好够则通过
        - 自选项付不起不是出局；自选住房/食品给不了而最低仍可负担时，声明了兜底才降级，否则计划不可行
        - 最低生活或税的配置缺失、引用错误、不完整，或最低方案与合格目录矛盾，都是数据错误
      open_parts:
        - LLM 格式错误的有限重试与重试后的默认动作（E1-7）
        - 计划不可行退回之后的重试（E1-7）
        - 出局月份与剩余期间如何计分（E1-6）

consumption_needs: [housing_space, fresh_food, workspace, communication, work_device, laundry, storage, home_cleaning]
categories: [housing, food, durable, experience, job, service]
functions: [housing, food, workspace, communication, work_device, laundry, storage, home_cleaning, exercise]
attribute_keys: [brand, tier, cuisine, prep_mode]
# 存在型：有没有，同功能第二件不再加分；容量型：按声明的容量（升 × 件数）相加，收益递减。
function_kinds: {workspace: presence, communication: presence, work_device: presence, laundry: presence,
                 home_cleaning: presence, storage: capacity}

tax_policies:
  - policy_id: tax.synth.za
    status: synthetic_test_double
    money_basis_id: USD_2024_LOCAL
    applies_to: {path: [US, ZA]}
    brackets: [{lower: 0, rate: 0.0}, {lower: 12000, rate: 0.2}]
    note: 合成测试替身：全年应税收入 12,000 以内 0%，超出部分 20%
  - policy_id: tax.synth.zb
    status: synthetic_test_double
    money_basis_id: USD_2024_LOCAL
    applies_to: {path: [US, ZB]}
    brackets: [{lower: 0, rate: 0.0}, {lower: 12000, rate: 0.2}]
    note: 合成测试替身：与 tax.synth.za 同档，税区不同

