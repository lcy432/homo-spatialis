# 产品协议样例的 mock 运行配置：与 run_product_haiku.yaml、run_product_flash.yaml 用同一份名单、事实表、信息条件、提示模板与修订
# 上限，只把规划器换成可控的 mock（规则 e3b-product-mock-rules-v2）。它说明同一套环境在一个确定性规划器下怎样运行，作为真实模型结果的
# 参照；不是"正确答案"，也不代表任何模型的能力。配置版本 e1-7a-run-v1 是 mock 运行的配置结构（没有模型设定与付费预算）。

run_notice: >-
  exploratory_synthetic：产品协议样例的 mock 运行。合成城市、合成参数、mock 规划器；不是现实城市评价，不代表真实模型能力。

run:
  run_config_id: run.product.mock
  status: exploratory_synthetic
  version: e1-7a-run-v1
  roster: configs/life/roster_product.yaml
  city_facts: configs/life/city_facts_product.yaml
  information:
    condition: product_stated_profile
    show_stated_dimension_points: true
    show_hard_requirements: true
    show_free_text: true
    show_energy_level: true
    show_stated_material_points: true
    permission_version: e3a-product-v1
    show_health_answers: true
    show_interests: true
  planning:
    plans_per_year: 1
    max_revisions_per_year: 2
    global_call_limit: 18
    run_order: roster_order
    transport_retries: 0
    note: 与真实模型运行相同的修订上限；mock 没有网络，不重试；调用上限按 2 个分身 × 3 年 × 3 份候选
  planner:
    identity:
      kind: mock
      planner_id: mock.rules.e3a-product
      version: e3b-product-mock-v2
      rules_version: e3b-product-mock-rules-v2
      note: 可控的确定性模拟代理（六维产品画像版规则）：只检查接线、状态传递与信息隔离，不代表任何真实模型的能力；读六维精确点数与物质分配，M1b 不用车到不了岗位或满足不了硬要求时按公开的通勤表与报价考虑用车，M5 按公开报价、寿命与残余时间挑设备或按月服务；应急是固定测试政策（小病、大病都 treat_if_possible），不从健康回答推断
    scripts: []
  prompt_template: e3b-product-prompt-v3
  memory_policy: e1-life-memory-v2
  note: 产品协议样例的 mock 运行（2 个分身、3 年），零网络调用、零费用。
