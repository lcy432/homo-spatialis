# E1 补充"日常生活便利"的城市背景事实（DECISIONS/0033；结构沿用 DECISIONS/0030 第三节）：分身可以看到的城市背景，与它们到评分输入的
# 内部对应。两座合成城 K51、M52 的背景事实与 E1-7B 的 C97 逐项相同（两城只有设备包与杂务服务的价格不同）。
#
# sheets 是**代理可见**的事实（逐字段投影进规划请求）；links 是**内部**对应——把事实写成评分条件里已有的背景量 b 的换算与它
# 自己的来源，不进观察与提示。加载器（ledger.life_city_facts）在开跑前逐项核对：各城定义相同；每条已知事实按换算得到的 b 与
# scoring_product.yaml 里这座城的 b 逐位相等；有城市背景的评分分项都有可见事实。任何一条对不上就拒绝启动。日常生活便利
# 与交通读实际生活的事实（方案级），没有城市背景值。
#
# **全部是合成设定。** 指数不是任何真实城市的犯罪率、就业机会、设施或环境统计；只在这组合成城市之间可比。

city_facts:
  facts_notice: >-
    exploratory_synthetic：E1 补充"日常生活便利"的合成城市背景事实。事实表可见；事实到评分输入的换算是内部合成设定（b = 0.5 × 指数），
    不进观察与提示。
  version: e1-7a-city-facts-v1
  comparison_group_id: group.e1-convenience.synth
  sheets:
    - city: {country: US, scheme: SYNTH2026, code: K51}
      label: 合成城 K51
      facts:
        - fact_id: safety_index
          label: 安全条件（合成指数）
          meaning: &m_safety >-
            合成的城市安全条件指数，0–10，越高越安全。不是任何真实城市的犯罪率或统计口径，只在这组合成城市之间可比
          value_kind: number
          unit: 合成指数（0–10）
          period: &period 合成快照（2026-10 设定，基年 2024）
          status: known
          number: 6
          source: &factsrc
            kind: synthetic
            observed_on: 2026-10-18
            geography_scope: synthetic city (no real geography)
            mapping_version: synthetic-e1-convenience-facts
            synthetic_note: 手工设定的合成城市背景指数；不是任何真实城市的资料
        - fact_id: development_index
          label: 发展机会（合成指数）
          meaning: &m_dev >-
            合成的城市职业与成长机会指数，0–10，越高表示城市本身提供的发展条件越好（不含你自己的学习进度）。不是真实的
            就业或教育统计
          value_kind: number
          unit: 合成指数（0–10）
          period: *period
          status: known
          number: 4
          source: *factsrc
        - fact_id: leisure_index
          label: 休闲条件（合成指数）
          meaning: &m_leisure >-
            合成的城市休闲设施与公共空间指数，0–10，越高表示不花钱也能享受的休闲条件越好（健身、体验等要另外安排）。不是
            真实的设施统计
          value_kind: number
          unit: 合成指数（0–10）
          period: *period
          status: known
          number: 8
          source: *factsrc
        - fact_id: environment_index
          label: 环境质量（合成指数）
          meaning: &m_env >-
            合成的城市环境质量指数（空气、绿地、噪声的合成概括），0–10，越高越好。不是真实的环境监测数据
          value_kind: number
          unit: 合成指数（0–10）
          period: *period
          status: known
          number: 6
          source: *factsrc
    - city: {country: US, scheme: SYNTH2026, code: M52}
      label: 合成城 M52
      facts:
        - {fact_id: safety_index, label: 安全条件（合成指数）, meaning: *m_safety, value_kind: number,
           unit: 合成指数（0–10）, period: *period, status: known, number: 6, source: *factsrc}
        - {fact_id: development_index, label: 发展机会（合成指数）, meaning: *m_dev, value_kind: number,
           unit: 合成指数（0–10）, period: *period, status: known, number: 4, source: *factsrc}
        - {fact_id: leisure_index, label: 休闲条件（合成指数）, meaning: *m_leisure, value_kind: number,
           unit: 合成指数（0–10）, period: *period, status: known, number: 8, source: *factsrc}
        - {fact_id: environment_index, label: 环境质量（合成指数）, meaning: *m_env, value_kind: number,
           unit: 合成指数（0–10）, period: *period, status: known, number: 6, source: *factsrc}
  links:
    - fact_id: safety_index
      component_id: safety
      rule: linear_base_v1
      factor: "0.5"
      source: &linksrc
        kind: synthetic
        observed_on: 2026-10-18
        geography_scope: synthetic city (no real geography)
        mapping_version: synthetic-e1-convenience-fact-links
        synthetic_note: >-
          合成换算：评分条件里的背景量 b = 0.5 × 0–10 的合成指数。只是把可见事实写成已有评分条件里的那个 b，不是经验换算，
          也没有新增评分公式
    - {fact_id: development_index, component_id: opportunity, rule: linear_base_v1, factor: "0.5", source: *linksrc}
    - {fact_id: leisure_index, component_id: leisure, rule: linear_base_v1, factor: "0.5", source: *linksrc}
    - {fact_id: environment_index, component_id: environment, rule: linear_base_v1, factor: "0.5", source: *linksrc}
