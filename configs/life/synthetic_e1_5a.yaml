# E1-5A 学习与技能 → 岗位选择 → 实际收入的合成生活样例（DECISIONS/0023）。评分配置另存在 scoring_e1_5a.yaml。
#
# **纯合成。** 城市、雇主、能力、学费、学习时长与负担、工资、工时与额度全部手工设定，不来自任何真实城市、职业
# 数据、培训回报研究或 LLM。数字故意取整，方便手算（见文末）。**不是现实职业发展的结论，也不排序城市。**
#
# 在 E1-4B 样例（synthetic_e1_4b.yaml，保留不动）之上：生活规则版本 e1-5a-monthly-career-v1，协议必须再声明职业
# 规则 career_rules（学习成果、生效时点、岗位取得规则、能力词表与雇主）。岗位写明雇主，培训写明完成后授予的能力，
# 岗位要求用 ability:<能力> 写。每个人开局写明岗位记录（用户陈述的职业 + 声明的起始岗位）。
#
# 本样例不带健身卡：基本生活每月负担 195，加 48 的会计课是 243 ≤ 250，可以边上班边学。

fixture_notice: >-
  synthetic_fixture_only：E1-5A 学习—资格—岗位样例。能力、学费、学习时长与负担、工资与工时全部手工合成，不对应
  任何真实地点、雇主、证书或职业调查；"学了能换到哪份工作"是确定性的合成规则，不是现实录用或涨薪结论。

protocol:
  protocol_id: life-v1-e1-5a
  schema_version: e1-5a-draft
  life_rules_version: e1-5a-monthly-career-v1
  scoring_scale_version: e1-3-supplement-v1
  info_permission_version: e1-5a-draft
  status: synthetic_fixture_only
  simulation_years: 3
  math_policies:
    score_mapping:
      state: undecided
      proposal: "E1-3 探索版与增补（ADR0018、ADR0019）的合成探索映射；学习与职业本身不计满足感（CA-06 未实现）"
    material_preference_aggregation: {state: undecided}
    energy_feedback:
      state: undecided
      settled_parts:
        - "月度精力额度约束：当月实际活动负担 ≤ 当月可承受额度；不结转、不回血（DECISIONS/0020）"
        - "探索版年度反馈：下一年额度 = 基础额度 × (1 + α × 上一年完整年度满足感)，向下保留到 0.01（DECISIONS/0021，仅用于合成探索）"
      open_parts:
        - "反馈的方向与幅度的经验标定、α 的取值；是否允许低于基础额度"
        - "与疾病、恢复的关系（E1-5C）"
    income_payment_timing:
      state: decided
      decision_ref: DECISIONS/0017
    risk_scenarios: {state: undecided}
    discounting: {state: undecided}
    terminal_value: {state: undecided}
    failure_handling:
      state: undecided
      settled_parts:
        - 付不起最低住房与最低食品（两项合计）→ 出局；钱恰好够则通过
        - 时间或精力超限 → 计划不可行（DECISIONS/0020）
        - 反馈开着而上一年没有完整评分 → 反馈信息不足，当年结算保留（DECISIONS/0021）
        - 计划里写了年初不满足要求的项目 → 输入错误，整份计划退回（DECISIONS/0023）
      open_parts:
        - LLM 格式错误的有限重试与重试后的默认动作（E1-7）
        - 计划退回之后的重试（E1-7）
        - 出局月份与剩余期间如何计分（E1-6）
  resource_rules:
    version: e1-4a-monthly-resources-v1
    time_unit: hour
    month_rule: annual_net_hours_div_12
    reserved_time: >-
      净可分配小时已预留每天 8 小时睡眠与 4 小时基本休息（吃饭、洗漱、个人照料），按 365 天计；
      这些不再进活动账
    energy_unit: burden_point
    energy_scale_version: e1-4a-monthly-quota-v1
    commute_minutes_key: commute_roundtrip_minutes
    commute_reference: >-
      每座合成城只有一个到岗工作地点（城市就业中心的抽象）：住房写明的往返分钟就是到那里的往返，
      所有需要到岗的岗位都在那里；不做地图与路线规划
    commute_burden_per_hour: 0.75
    household_tasks:
      - {task: laundry, baseline_hours_per_month: 12, burden_per_hour: 0.5,
         description: 没有洗衣机或洗衣服务时，自己手洗或去自助洗衣店}
      - {task: cleaning, baseline_hours_per_month: 10, burden_per_hour: 0.6,
         description: 自己打扫一居室}
    source: &rules
      kind: synthetic
      observed_on: 2026-10-08
      geography_scope: synthetic city (no real geography)
      mapping_version: synthetic-e1-5a
      synthetic_note: 手工设定的规则、负担系数与职业设定，不是时间利用调查、生理学或职业数据的标定
  energy_feedback:
    policy_id: feedback.e1-5a.main
    version: e1-4b-satisfaction-quota-v1
    mode: enabled
    alpha: 0.10
    formula: base_times_one_plus_alpha_s
    lag_years: 1
    score_statistic: complete_year_mean_u
    scoring_spec_id: score.e1-5a.explore
    scoring_version: e1-3-supplement-v1
    preference_source: product_stated_numeric
    quantization: floor_to_0.01
    source: *rules
    note: 沿用 E1-4B 的合成探索参数 α = 0.10；学习与岗位不改变反馈公式
  career_rules:
    version: e1-5a-career-v1
    attendance: planned_month_fee_settled
    completion: participated_months_reach_required
    grant: union_by_ability_id
    effective_from: next_action_year
    qualification_basis: year_start_state
    job_access: deterministic_if_available_and_qualified
    abilities:
      - ability_id: accounting_cert
        kind: credential
        label: 会计从业资格（合成）
        description: 通过会计资格课程后取得的证书；会计岗位要求它，不论雇主是会计事务所还是互联网公司
        scope: {kind: general}
        source: *rules
      - ability_id: python_programming
        kind: skill
        label: Python 编程
        description: 一门编程语言的实际使用能力；软件开发岗位要求它。会计资格不能代替它
        scope: {kind: general}
        source: *rules
      - ability_id: hr_rules_netco
        kind: knowledge
        label: 网鹊科技内部人事规则
        description: 网鹊科技的考勤、薪酬与招聘流程；只对网鹊科技的岗位有用
        scope: {kind: employer, employer_id: firm.netco}
        source: *rules
      - ability_id: hr_rules_ledgerco
        kind: knowledge
        label: 账房事务所内部人事规则
        description: 账房事务所的人事流程；熟悉网鹊科技的规则不等于熟悉它
        scope: {kind: employer, employer_id: firm.ledgerco}
        source: *rules
    employers:
      - {employer_id: firm.netco, label: 网鹊科技（互联网公司，合成）, city: {country: US, scheme: SYNTH2026, code: A71}, source: *rules}
      - {employer_id: firm.ledgerco, label: 账房事务所（会计事务所，合成）, city: {country: US, scheme: SYNTH2026, code: A71}, source: *rules}
    source: *rules
    note: 合成试点规则：少量命名能力、显式岗位要求、下一年生效、确定性取得；没有技能树、录用概率、竞争或遗忘

