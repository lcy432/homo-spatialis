# ---------------------------------------------------------------------- 手算（合成）
# 每月负担（负担点）：文员 160 × 1.0 = 160；通勤 30 分钟 × 20 次 / 60 = 10 小时 × 0.75 = 7.5；新鲜食材 40 × 0.5 = 20；
#   洗衣（有洗衣机）3 × 0.5 = 1.5；打扫 10 × 0.6 = 6 → 基本生活 195。时间：160 + 10 + 40 + 3 + 10 = 223 小时 ≤ 365。
# 会计课 40 × 1.2 = 48 → 243 ≤ 250，时间 263；自学 Python 30 × 1.0 = 30 → 225，时间 253；人事内训 10 → 205。
# 同时上会计课与自学 Python：195 + 48 + 30 = 273 > 250 → 计划不可行（派生情景）。
# 换岗后：会计 160 × 1.1 = 176 → 211；开发 160 × 1.2 = 192 → 227；人事 160 → 195。
# 年收入与合成税（12,000 以内 0%、以上 20%）：文员 36,000 − 4,800 = 31,200；会计 48,000 − 7,200 = 40,800；
#   开发 60,000 − 9,600 = 50,400；人事 44,000 − 6,400 = 37,600。
# 第 1 年支出：房 1,400 × 12 = 16,800；食 450 × 12 = 5,400；洗衣机 700 → 22,900；会计课再加 1,200（自学 Python 与内训 0）。
#   年末现金：学会计 3,000 + 31,200 − 24,100 = 10,100；不学或免费学 3,000 + 31,200 − 22,900 = 11,300。
# 第 2 年（支出 22,200）：会计 10,100 + 40,800 − 22,200 = 28,700；仍做文员 10,100 + 31,200 − 22,200 = 19,100；
#   不学 11,300 + 9,000 = 20,300；开发 11,300 + 50,400 − 22,200 = 39,500。
# u53：每月最低生活 1,000 + 380 = 1,380；4,000 → 2,620 → 1,240 < 1,380，第 3 月出局；自学进度 2/12，没有能力。
