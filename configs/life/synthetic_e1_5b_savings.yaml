# ---------------------------------------------------------------------- 手算（合成）
# 每月：收入 1,500（年 18,000 < 40,000，税 0）；付远处一居室 1,000 + 基本食品 380 = 1,380；净存 120。
# u81：第 1 年 500 → 500 + 12 × 120 = 1,940（洗烘一体机 2,400，差 460）。第 2 年第 4 月末 1,940 + 4 × 120 = 2,420
#   （余额不少于报价，但没买，不算兑现）；第 5 月 2,420 + 1,500 − 1,380 − 2,400 = 140（买下，兑现，按时）；年末 140 + 7 × 120 = 980。
# u82：第 1 年 300 → 1,740（第 8 月末 1,260 起余额不少于学费 1,200，但没付，不算兑现）。第 2 年第 6 月末 2,460；
#   第 7 月 2,460 + 1,500 − 1,380 − 1,200 = 1,380（学费付清，兑现，按时；本年参加 6/12）；年末 1,380 + 5 × 120 = 1,980。
#   第 3 年第 6 月学完（不再收学费），能力从第 4 年（终态）起才可用；年末 1,980 + 1,440 = 3,420。
# u83：第 1 年 1,000 → 2,440。第 2 年第 1 月末 2,560；第 2 月 2,560 + 1,500 − 1,380 − 1,500（探亲）= 1,180；第 5 月末 1,540；
#   第 6 月 1,540 + 1,500 − 1,380 = 1,660 < 2,400 → 购买因资金不足被拒，月末"到期未兑现"（差 740，不出局）；
#   年末 1,660 + 6 × 120 = 2,380（差 20）。第 3 年改时点到第 3 月：第 2 月末 2,620，第 3 月 2,620 + 1,500 − 1,380 − 2,400 = 340
#   （兑现，按改后的时点按时）；年末 340 + 9 × 120 = 1,420。
# 资源（每月）：兼职 80 h × 1.0 = 80；通勤 70 分钟 × 10 次 / 60 = 11.67 h × 0.75 = 8.75；基本食品 30 h × 0.5 = 15；
#   洗衣 12 h × 0.5 = 6（有洗烘一体机后 2 h × 0.5 = 1）；打扫 10 h × 0.6 = 6；合计 115.75 ≤ 250。上课的月份再加 40 h × 1.2 = 48；
#   探亲当月再加 16 h × 0.5 = 8。都不超额度，时间也远低于每月 365 小时。
