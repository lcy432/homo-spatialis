# E1-5B 目标储蓄的合成生活样例（DECISIONS/0026）。评分配置另存在 scoring_e1_5b_savings.yaml。
#
# **纯合成。** 城市、报价、工资、学费、时长与负担全部手工设定，不来自任何真实城市、商品价格、职业数据或 LLM。
# 税档设成年收入 40,000 以内 0%（合成测试替身），让每个月的现金流可以直接手算。**不是现实结论，也不排序城市。**
#
# 生活规则 e1-5b-monthly-savings-v1 = E1-5A（学习、授予、下一年生效、岗位、月度资源与年度反馈）+ 结构化资金目标。
# 评分沿用 E1-5A 补充的评分版本 e1-5a-growth-transport-v1，评分内容与 scoring_e1_5a_growth_transport.yaml 相同
# （评分内容身份 5b985b4a…，只改了编号与协议引用）：本轮不改任何评分数学，目标本身不进入评分。
#
# 三个人都是门店兼职（每月 1,500）、住远处一居室（1,000）、吃基本食品（380），每月净存 120：
#   u81 攒钱买洗烘一体机（2,400）：第 1 年设目标，第 2 年第 5 月买下；
#   u82 攒会计课学费（1,200）：第 1 年设目标，第 2 年第 7 月付清并开始上课，第 3 年第 6 月学完；
#   u83 也攒洗烘一体机：第 2 年第 2 月一笔合法的额外开支（探亲往返 1,500，不是疾病事件），第 6 月买不起、到期未兑现；
#       第 3 年改时点并买下。手算见文末。

fixture_notice: >-
  synthetic_fixture_only：E1-5B 目标储蓄样例。报价、工资、学费、时长、负担与税档全部手工合成，不对应任何真实地点、
  商品、雇主或制度；目标只是年度计划里的软约束，不另开账户、不圈存、不发满足感。

protocol:
  protocol_id: life-v1-e1-5b-savings
  schema_version: e1-5b-savings-draft
  life_rules_version: e1-5b-monthly-savings-v1
  scoring_scale_version: e1-5a-growth-transport-v1
  info_permission_version: e1-5b-draft
  status: synthetic_fixture_only
  simulation_years: 3
  math_policies:
    score_mapping:
      state: undecided
      proposal: >-
        E1-3 探索映射（ADR0018、ADR0019）加 E1-5A 补充（DECISIONS/0024）。E1-5B 不改评分：目标、存钱与兑现本身不加分，
        买到的物品与付学费后的学习按原规则产生结果
    material_preference_aggregation: {state: undecided}
    energy_feedback:
      state: undecided
      settled_parts:
        - "月度精力额度约束：当月实际活动负担 ≤ 当月可承受额度；不结转、不回血（DECISIONS/0020）"
        - "探索版年度反馈：下一年额度 = 基础额度 × (1 + α × 上一年完整年度满足感)，向下保留到 0.01（DECISIONS/0021，仅用于合成探索）"
      open_parts:
        - "反馈的方向与幅度的经验标定、α 的取值；是否允许低于基础额度"
        - "与疾病、恢复的关系（E1-5C）"
    income_payment_timing:
      state: decided
      decision_ref: DECISIONS/0017
    risk_scenarios: {state: undecided}
    discounting: {state: undecided}
    terminal_value:
      state: undecided
      open_parts:
        - 期末未花的现金、未兑现的目标与物品残值怎样评价（E1-6）
    failure_handling:
      state: undecided
      settled_parts:
        - 付不起最低住房与最低食品（两项合计）→ 出局；钱恰好够则通过
        - 时间或精力超限 → 计划不可行（DECISIONS/0020）
        - 反馈开着而上一年没有完整评分 → 反馈信息不足，当年结算保留（DECISIONS/0021）
        - 计划里写了年初不满足要求的项目 → 输入错误，整份计划退回（DECISIONS/0023）
        - 资金目标的指令或关联不成立 → 输入错误，整份计划退回；目标到期未兑现只记录，不出局（DECISIONS/0026）
      open_parts:
        - LLM 格式错误的有限重试与重试后的默认动作（E1-7）
        - 计划退回之后的重试（E1-7）
        - 出局月份与剩余期间如何计分（E1-6）
  resource_rules:
    version: e1-4a-monthly-resources-v1
    time_unit: hour
    month_rule: annual_net_hours_div_12
    reserved_time: >-
      净可分配小时已预留每天 8 小时睡眠与 4 小时基本休息（吃饭、洗漱、个人照料），按 365 天计；
      这些不再进活动账
    energy_unit: burden_point
    energy_scale_version: e1-4a-monthly-quota-v1
    commute_minutes_key: commute_roundtrip_minutes
    commute_reference: >-
      每座合成城只有一个到岗工作地点（城市就业中心的抽象）：住房写明的往返分钟就是到那里的往返，
      所有需要到岗的岗位都在那里；不做地图与路线规划
    commute_burden_per_hour: 0.75
    household_tasks:
      - {task: laundry, baseline_hours_per_month: 12, burden_per_hour: 0.5,
         description: 没有洗衣设备或洗衣服务时，自己手洗或去自助洗衣店}
      - {task: cleaning, baseline_hours_per_month: 10, burden_per_hour: 0.6,
         description: 自己打扫一居室}
    source: &rules
      kind: synthetic
      observed_on: 2026-10-09
      geography_scope: synthetic city (no real geography)
      mapping_version: synthetic-e1-5b-savings
      synthetic_note: 手工设定的规则、负担系数、职业与目标规则，不是时间利用调查、价格资料或制度的标定
  energy_feedback:
    policy_id: feedback.e1-5b.main
    version: e1-4b-satisfaction-quota-v1
    mode: enabled
    alpha: 0.10
    formula: base_times_one_plus_alpha_s
    lag_years: 1
    score_statistic: complete_year_mean_u
    scoring_spec_id: score.e1-5b.explore
    scoring_version: e1-5a-growth-transport-v1
    # 评分内容身份（DECISIONS/0025）：scoring_e1_5b_savings.yaml 里规格的 LifeScoringSpec.content_fingerprint。与 E1-5A
    # 补充同一套评分内容（编号与协议引用不参与身份）；改任何评分参数都要换这一行，那就是另一个实验身份。
    scoring_content_fingerprint: 5b985b4ac351cc26c35039c969ebc2bb839cb20b058256c95ae97db80b3a8768
    preference_source: product_stated_numeric
    quantization: floor_to_0.01
    source: *rules
    note: 沿用 E1-4B 的合成探索参数 α = 0.10；资金目标不进入满足感，也就不改变反馈公式
  career_rules:
    version: e1-5a-career-v1
    attendance: planned_month_fee_settled
    completion: participated_months_reach_required
    grant: union_by_ability_id
    effective_from: next_action_year
    qualification_basis: year_start_state
    job_access: deterministic_if_available_and_qualified
    abilities:
      - ability_id: accounting_cert
        kind: credential
        label: 会计从业资格（合成）
        description: 通过会计资格课程后取得的证书；会计岗位要求它
        scope: {kind: general}
        source: *rules
    employers:
      - {employer_id: firm.shop81, label: 街角百货（合成）, city: {country: US, scheme: SYNTH2026, code: A81}, source: *rules}
      - {employer_id: firm.office81, label: 合成办公室（合成）, city: {country: US, scheme: SYNTH2026, code: A81}, source: *rules}
    source: *rules
    note: 沿用 E1-5A 的合成职业规则；本样例只用一门会计课与一个会计岗位
  savings_rules:
    version: e1-5b-savings-goals-v1
    goal_kinds: [durable_purchase, training_tuition]
    max_open_goals: 1
    changes: year_start_plan_only
    funding: single_cash_ledger_no_earmark
    progress: month_end_cash_vs_current_quote
    realization: linked_executed_full_payment
    due: record_unrealized_at_target_month_end
    automatic: none
    source: *rules
    note: >-
      本项目选择的最小目标规则：一次只有一个目标、只在年初改、同一本现金账不圈存、只认关联行动的实际全额付款、
      到期只记录；没有利息、借贷、分期、自动购买或"安心分"

consumption_needs: [housing_space, fresh_food, laundry, home_cleaning]
