# ---------------------------------------------------------------------- 手算（合成）
# α 每月：门店兼职 1,500（年 18,000 < 40,000，税 0）；远处一居室 1,000 + 基本食品 380 = 1,380；净存 120。两座城价格相同。
#   r0、r4：健康 → 期末 2,000 + 36 × 120 = 6,320。
#   r1：第 2 年第 5 月大病（月初现金 2,000 + 16 × 120 = 3,920）。A95：病假没有工资，付 1,380 → 2,540，住院 2,000 → 540，月末恢复；
#       期末 540 + 19 × 120 = 2,820。B96：要住院而住院资料未知 → E1-5C 停止（资料缺口），第 2 年第 5 月之前的生活保留。
#   r2：第 1 年第 2 月大病（月初 2,000 + 120 = 2,120）。A95：病假没有工资，付 1,380 → 740，住院 2,000 付不起；第 3 月月初 740 < 1,380
#       → 付不起最低生活，出局（差 640）。B96：要住院而资料未知 → 第 1 年第 2 月停止（资料缺口）——同样的事件，在 A95 是确认出局，
#       在 B96 是模拟停止，不能混为一谈。
#   r3：第 2 年第 3 月小病（照常上班）。A95：门诊 300，月末恢复，期末 6,320 − 300 = 6,020。B96：门诊确定没有，病 2 个月（照常
#       上班），期末 6,320。
# β 每月同样净存 120：r0 期末 4,000 + 4,320 = 8,320；r1 第 3 年第 12 月大病不治：没有工资，8,200 − 1,380 = 6,820，带着病了 1 个月
#   的大病进入终态。β 在 B96 住远处住房（往返 90 分钟），硬要求"往返 ≤ 70 分钟"每个月都不满足——单独报告，不删人、不扣分。
