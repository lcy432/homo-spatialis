# E1-7A 城市背景事实（DECISIONS/0030 第三节）：分身可以看到的城市背景，与它们到评分输入的内部对应。
#
# sheets 是**代理可见**的事实（逐字段投影进规划请求）；links 是**内部**对应——把事实写成评分条件里已有的背景量 b 的换算与它
# 自己的来源，不进观察与提示。加载器（ledger.life_city_facts）在开跑前逐项核对：各城定义相同；每条已知事实按换算得到的 b 与
# scoring_e1_7a_loop.yaml 里这座城的 b 逐位相等；有城市背景的评分分项都有可见事实。任何一条对不上就拒绝启动。
#
# **全部是合成设定。** 指数不是任何真实城市的犯罪率、就业机会、设施或环境统计；只在这组合成城市之间可比。两座城的背景事实
# 与 E1-6B 的评分条件一致（两城相同）；城市差异在价格、岗位、住房往返分钟与治疗资料，这些在机会目录与治疗目录里，本来就可见。

city_facts:
  facts_notice: >-
    exploratory_synthetic：E1-7A 合成城市背景事实。事实表可见；事实到评分输入的换算是内部合成设定（b = 0.5 × 指数），
    不进观察与提示。将来 E3 用同一个结构接真实资料（原始数值、定义、单位、地区范围、年份与转换依据）。
  version: e1-7a-city-facts-v1
  comparison_group_id: group.e1-7a.synth
  sheets:
    - city: {country: US, scheme: SYNTH2026, code: A95}
      label: 合成城 A95
      facts:
        - &safety
          fact_id: safety_index
          label: 安全条件（合成指数）
          meaning: >-
            合成的城市安全条件指数，0–10，越高越安全。不是任何真实城市的犯罪率或统计口径，只在这组合成城市之间可比
          value_kind: number
          unit: 合成指数（0–10）
          period: 合成快照（2026-10 设定，基年 2024）
          status: known
          number: 6
          source: &factsrc
            kind: synthetic
            observed_on: 2026-10-12
            geography_scope: synthetic city (no real geography)
            mapping_version: synthetic-e1-7a-facts
            synthetic_note: 手工设定的合成城市背景指数，与 E1-6B 评分条件里的背景量一致；不是任何真实城市的资料
        - &development
          fact_id: development_index
          label: 发展机会（合成指数）
          meaning: >-
            合成的城市职业与成长机会指数，0–10，越高表示城市本身提供的发展条件越好（不含你自己的学习进度）。不是真实的
            就业或教育统计
          value_kind: number
          unit: 合成指数（0–10）
          period: 合成快照（2026-10 设定，基年 2024）
          status: known
          number: 4
          source: *factsrc
        - &leisure
          fact_id: leisure_index
          label: 休闲条件（合成指数）
          meaning: >-
            合成的城市休闲设施与公共空间指数，0–10，越高表示不花钱也能享受的休闲条件越好（健身、体验等要另外安排）。不是
            真实的设施统计
          value_kind: number
          unit: 合成指数（0–10）
          period: 合成快照（2026-10 设定，基年 2024）
          status: known
          number: 8
          source: *factsrc
        - &environment
          fact_id: environment_index
          label: 环境质量（合成指数）
          meaning: >-
            合成的城市环境质量指数（空气、绿地、噪声的合成概括），0–10，越高越好。不是真实的环境监测数据
          value_kind: number
          unit: 合成指数（0–10）
          period: 合成快照（2026-10 设定，基年 2024）
          status: known
          number: 6
          source: *factsrc
    - city: {country: US, scheme: SYNTH2026, code: B96}
      label: 合成城 B96
      facts: [*safety, *development, *leisure, *environment]
  links:
    - fact_id: safety_index
      component_id: safety
      rule: linear_base_v1
      factor: "0.5"
      source: &linksrc
        kind: synthetic
        observed_on: 2026-10-12
        geography_scope: synthetic city (no real geography)
        mapping_version: synthetic-e1-7a-fact-links
        synthetic_note: >-
          合成换算：评分条件里的背景量 b = 0.5 × 0–10 的合成指数。只是把可见事实写成已有评分条件里的那个 b，不是经验换算，
          也没有新增评分公式
    - {fact_id: development_index, component_id: opportunity, rule: linear_base_v1, factor: "0.5", source: *linksrc}
    - {fact_id: leisure_index, component_id: leisure, rule: linear_base_v1, factor: "0.5", source: *linksrc}
    - {fact_id: environment_index, component_id: environment, rule: linear_base_v1, factor: "0.5", source: *linksrc}
