# E1-7B 原计划名单（DECISIONS/0031）。在跑任何生活之前写好并冻结（沿用 E1-6B 的冻结与标准开局 v1 检查）；不从收到多少结果
# 反推原计划人数。名单顺序就是运行顺序（run_order = roster_order）。
#
# 两位用户 × 两座城 × 每城 2 个重复分身 = 8 个分身，3 年。先导试跑只跑名单第一项（u201.c97.r0）的第 1 年；主试跑跑全部 8 个。
# 真实模型（run_e1_7b_live.yaml）与 mock 对照（run_e1_7b_mock.yaml）用同一份名单。主臂一个（evaluation_e1_7b.yaml）。

roster_notice: >-
  exploratory_synthetic：E1-7B 真实模型小规模试跑的原计划名单。全部是合成样例，不是现实城市评价，也不是模型能力的一般结论。

roster:
  roster_id: roster.e1-7b.pilot
  status: exploratory_synthetic
  aggregation_version: e1-6b-aggregation-v1
  life_input: configs/life/synthetic_e1_7b_pilot.yaml
  scoring_config: configs/life/scoring_e1_7b_pilot.yaml
  comparison_group_id: group.e1-7b.synth
  note: 两位用户、两座城、每城 2 个重复分身；r1 第 2 年第 5 月有一次指定的大病。每一年的计划由规划器给出，名单冻结时还没有任何计划。
  users:
    - {user_id: user.career, person_id: u201, label: u201（看重发展，想考会计证换工作）}
    - {user_id: user.comfort, person_id: u202, label: u202（看重住得舒服、吃得新鲜、通勤别太累）}
  arms:
    - {arm_id: arm.main, role: main, evaluation_config: configs/life/evaluation_e1_7b.yaml, note: 主设定 δ = 1、四个基础生活模板}
  entries:
    - {user_id: user.career, clone_id: u201.c97.r0, city: {country: US, scheme: SYNTH2026, code: C97}, repeat_index: 0}
    - {user_id: user.career, clone_id: u201.c97.r1, city: {country: US, scheme: SYNTH2026, code: C97}, repeat_index: 1}
    - {user_id: user.career, clone_id: u201.d98.r0, city: {country: US, scheme: SYNTH2026, code: D98}, repeat_index: 0}
    - {user_id: user.career, clone_id: u201.d98.r1, city: {country: US, scheme: SYNTH2026, code: D98}, repeat_index: 1}
    - {user_id: user.comfort, clone_id: u202.c97.r0, city: {country: US, scheme: SYNTH2026, code: C97}, repeat_index: 0}
    - {user_id: user.comfort, clone_id: u202.c97.r1, city: {country: US, scheme: SYNTH2026, code: C97}, repeat_index: 1}
    - {user_id: user.comfort, clone_id: u202.d98.r0, city: {country: US, scheme: SYNTH2026, code: D98}, repeat_index: 0}
    - {user_id: user.comfort, clone_id: u202.d98.r1, city: {country: US, scheme: SYNTH2026, code: D98}, repeat_index: 1}
