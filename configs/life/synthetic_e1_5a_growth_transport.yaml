# E1-5A 补充：成长满足感与广义交通评分的合成生活样例（DECISIONS/0024）。评分配置另存在
# scoring_e1_5a_growth_transport.yaml。
#
# **纯合成。** 城市、雇主、能力、学费、学习时长与负担、工资、工时、到岗次数与额度全部手工设定，不来自任何真实
# 城市、职业数据、出行调查、培训研究或 LLM。数字故意取整，方便手算（见文末）。**不是现实结论，也不排序城市。**
#
# 生活规则沿用 E1-5A（e1-5a-monthly-career-v1）：学习、授予、下一年生效、岗位取得与结算都不变。变的是评分：新协议
# life-v1-e1-5a-growth-transport 的反馈政策读新评分版本 e1-5a-growth-transport-v1——发展维加"当月实际新增的能力
# 进度"，通勤维改为广义交通（无工作、远程、混合、多岗位都按资源账的到岗次数评分）。E1-5A 原样例与评分配置不动。
#
# 本样例的人：u61 看重发展（发展维 20 点）、u62 不看重发展（0 点）、u63 看重交通（交通 20 点，五种出行安排）、
# u64 有积蓄、第一年不工作专心自学。

fixture_notice: >-
  synthetic_fixture_only：E1-5A 补充（成长满足感、广义交通评分）样例。能力、学费、学习时长与负担、工资、工时与到岗
  次数全部手工合成，不对应任何真实地点、雇主、证书、出行或职业调查；成长与交通的评分参数是合成探索设定。

protocol:
  protocol_id: life-v1-e1-5a-growth-transport
  schema_version: e1-5a-growth-transport-draft
  life_rules_version: e1-5a-monthly-career-v1
  scoring_scale_version: e1-5a-growth-transport-v1
  info_permission_version: e1-5a-draft
  status: synthetic_fixture_only
  simulation_years: 3
  math_policies:
    score_mapping:
      state: undecided
      proposal: >-
        E1-3 探索映射（ADR0018、ADR0019）加 E1-5A 补充（DECISIONS/0024）：发展维 z = b + η_growth × 当月新增能力进度；
        通勤维为广义交通 k = ρ + (1 − ρ)·D/D_ref、T_eq = k·T、S = τ_T/(τ_T + T_eq)。全部是合成探索参数
    material_preference_aggregation: {state: undecided}
    energy_feedback:
      state: undecided
      settled_parts:
        - "月度精力额度约束：当月实际活动负担 ≤ 当月可承受额度；不结转、不回血（DECISIONS/0020）"
        - "探索版年度反馈：下一年额度 = 基础额度 × (1 + α × 上一年完整年度满足感)，向下保留到 0.01（DECISIONS/0021，仅用于合成探索）"
      open_parts:
        - "反馈的方向与幅度的经验标定、α 的取值；是否允许低于基础额度"
        - "与疾病、恢复的关系（E1-5C）"
    income_payment_timing:
      state: decided
      decision_ref: DECISIONS/0017
    risk_scenarios: {state: undecided}
    discounting: {state: undecided}
    terminal_value: {state: undecided}
    failure_handling:
      state: undecided
      settled_parts:
        - 付不起最低住房与最低食品（两项合计）→ 出局；钱恰好够则通过
        - 时间或精力超限 → 计划不可行（DECISIONS/0020）
        - 反馈开着而上一年没有完整评分 → 反馈信息不足，当年结算保留（DECISIONS/0021）
        - 计划里写了年初不满足要求的项目 → 输入错误，整份计划退回（DECISIONS/0023；E1-7 按可修改、可重试的计划拒绝处理）
      open_parts:
        - LLM 格式错误的有限重试与重试后的默认动作（E1-7）
        - 计划退回之后的重试（E1-7）
        - 出局月份与剩余期间如何计分（E1-6）
  resource_rules:
    version: e1-4a-monthly-resources-v1
    time_unit: hour
    month_rule: annual_net_hours_div_12
    reserved_time: >-
      净可分配小时已预留每天 8 小时睡眠与 4 小时基本休息（吃饭、洗漱、个人照料），按 365 天计；
      这些不再进活动账
    energy_unit: burden_point
    energy_scale_version: e1-4a-monthly-quota-v1
    commute_minutes_key: commute_roundtrip_minutes
    commute_reference: >-
      每座合成城只有一个到岗工作地点（城市就业中心的抽象）：住房写明的往返分钟就是到那里的往返，
      所有需要到岗的岗位都在那里；不做地图与路线规划
    commute_burden_per_hour: 0.75
    household_tasks:
      - {task: laundry, baseline_hours_per_month: 12, burden_per_hour: 0.5,
         description: 没有洗衣机或洗衣服务时，自己手洗或去自助洗衣店}
      - {task: cleaning, baseline_hours_per_month: 10, burden_per_hour: 0.6,
         description: 自己打扫一居室}
    source: &rules
      kind: synthetic
      observed_on: 2026-10-09
      geography_scope: synthetic city (no real geography)
      mapping_version: synthetic-e1-5a-growth-transport
      synthetic_note: 手工设定的规则、负担系数与职业设定，不是时间利用调查、生理学或职业数据的标定
  energy_feedback:
    policy_id: feedback.e1-5a-gt.main
    version: e1-4b-satisfaction-quota-v1
    mode: enabled
    alpha: 0.10
    formula: base_times_one_plus_alpha_s
    lag_years: 1
    score_statistic: complete_year_mean_u
    scoring_spec_id: score.e1-5a-gt.explore
    scoring_version: e1-5a-growth-transport-v1
    # 评分内容身份（DECISIONS/0025）：configs/life/scoring_e1_5a_growth_transport.yaml 里规格的 LifeScoringSpec.content_fingerprint。
    # 改任何评分参数（η、ρ、D_ref、τ、来源规则……）都要换这一行，那就是另一个实验身份；只改说明文字不变。
    scoring_content_fingerprint: 5b985b4ac351cc26c35039c969ebc2bb839cb20b058256c95ae97db80b3a8768
    preference_source: product_stated_numeric
    quantization: floor_to_0.01
    source: *rules
    note: 沿用 E1-4B 的合成探索参数 α = 0.10；新评分版本进入反馈政策的内容指纹，旧评分产生的中间状态不能接着用
  career_rules:
    version: e1-5a-career-v1
    attendance: planned_month_fee_settled
    completion: participated_months_reach_required
    grant: union_by_ability_id
    effective_from: next_action_year
    qualification_basis: year_start_state
    job_access: deterministic_if_available_and_qualified
    abilities:
      - ability_id: accounting_cert
