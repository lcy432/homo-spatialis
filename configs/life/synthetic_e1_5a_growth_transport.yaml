# ---------------------------------------------------------------------- 手算（合成）
# 发展维（b = 2、τ = 2、上限 0.9、η_growth = 12）：不学习的月份 2/(2+2) = 0.5；会计课每参加一个月新增进度 1/12，
#   z = 2 + 12 × 1/12 = 3，3/5 = 0.6。发展权重 0.2 的人这个月总分多 0.2 × 0.1 = 0.02；权重 0 的人一样多学，总分不变。
#   暂停：第 1 年第 1–6 月 0.6、第 7–12 月 0.5；第 2 年全年 0.5（暂停没有成长）；第 3 年第 1–6 月 0.6（只计新增的
#   6/12），第 6 月学完，第 4 年起可用（第 4 年是终态）；学费只在第 1 年付一次。
# 交通（τ_T = 60，ρ = 0.25，D_ref = 20，近处住房往返 T = 30 分钟）：k = 0.25 + 0.75 × D/20，T_eq = k × 30，
#   S = 60/(60 + T_eq)。到岗 20 次 k = 1，S = 60/90 = 2/3；混合 10 次 k = 0.625，T_eq = 18.75，S = 60/78.75 = 16/21；
#   远程或不工作 0 次 k = 0.25，T_eq = 7.5，S = 60/67.5 = 8/9；两份兼职 10 + 10 = 20 次，同天天到岗 2/3；早晚两班
#   20 + 20 = 40 次 k = 1.75，T_eq = 52.5，S = 60/112.5 = 8/15。到岗 20 次的结果与旧的方案级通勤（60/90）相同。
# 工作通勤的时间账不变：Σ 30 分钟 × 各岗位到岗次数 / 60——天天到岗 10 小时、混合 5 小时、远程 0、两份兼职 5 + 5、
#   早晚两班 10 + 10 小时；负担 × 0.75。
# 每月负担：文员 160 + 通勤 7.5 + 做饭 20 + 洗衣 1.5 + 打扫 6 = 195；会计课再加 48 → 243；混合 191.25；远程 187.5；
#   两份兼职 195；早晚两班 60 + 60 + 15 + 27.5 = 162.5；u64 不工作只自学：30 + 20 + 1.5 + 6 = 57.5。
# 现金（第 1 年支出：房 16,800 + 食 5,400 + 洗衣机 700 = 22,900；之后每年 22,200）：文员一年 36,000 − 4,800 = 31,200；
#   u61.learn 第 1 年 3,000 + 31,200 − 22,900 − 1,200 = 10,100，第 2 年会计 48,000 − 7,200：10,100 + 40,800 − 22,200
#   = 28,700；u63 早晚两班 48,000 − 7,200：3,000 + 40,800 − 22,900 = 20,900；u64 第 1 年 30,000 − 22,900 = 7,100，第 2 年
#   开发 60,000 − 9,600：7,100 + 50,400 − 22,200 = 35,300。
