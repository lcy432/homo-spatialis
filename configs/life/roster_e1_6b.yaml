# E1-6B 原计划名单（DECISIONS/0029）。在跑任何生活、看任何结果之前写好并冻结；不从收到多少结果反推原计划人数。
#
# 汇总单位：同一用户（偏好组）× 城市 × 重复分身序号。不同用户分别出报告，不混成一个人的城市推荐分。主臂一个，评价对照臂两个
# （δ = 0.99、只含基本生活模板）：三个臂评价同一批实际生活，只改评价假设。
#
# 演示刻意不运行 u101.a95.r4（模拟"结果没有返回"）：它仍在原计划名单里，进分母与缺失范围。

roster_notice: >-
  exploratory_synthetic：E1-6B 合成汇总演示的原计划名单。全部是合成样例，不是现实城市评价。

roster:
  roster_id: roster.e1-6b.demo
  status: exploratory_synthetic
  aggregation_version: e1-6b-aggregation-v1
  life_input: configs/life/synthetic_e1_6b_aggregation.yaml
  scoring_config: configs/life/scoring_e1_6b_aggregation.yaml
  comparison_group_id: group.e1-6b.synth
  note: 两位用户、两座城；α 每城 5 个重复分身，β 每城 2 个。
  users:
    - {user_id: user.alpha, person_id: u101, label: α（标准偏好）}
    - {user_id: user.beta, person_id: u102, label: β（只看重交通，有通勤硬要求）}
  arms:
    - {arm_id: arm.main, role: main, evaluation_config: configs/life/evaluation_e1_6b.yaml, note: 主设定 δ = 1、四个基础生活模板}
    - {arm_id: arm.delta099, role: sensitivity, evaluation_config: configs/life/evaluation_e1_6b_delta099.yaml,
       note: δ = 0.99（只验证机制）}
    - {arm_id: arm.basic_only, role: sensitivity, evaluation_config: configs/life/evaluation_e1_6b_basic_only.yaml,
       note: 只含基本生活模板 p1、p3}
  entries:
    - {user_id: user.alpha, clone_id: u101.a95.r0, city: {country: US, scheme: SYNTH2026, code: A95}, repeat_index: 0}
    - {user_id: user.alpha, clone_id: u101.a95.r1, city: {country: US, scheme: SYNTH2026, code: A95}, repeat_index: 1}
    - {user_id: user.alpha, clone_id: u101.a95.r2, city: {country: US, scheme: SYNTH2026, code: A95}, repeat_index: 2}
    - {user_id: user.alpha, clone_id: u101.a95.r3, city: {country: US, scheme: SYNTH2026, code: A95}, repeat_index: 3}
    - {user_id: user.alpha, clone_id: u101.a95.r4, city: {country: US, scheme: SYNTH2026, code: A95}, repeat_index: 4}
    - {user_id: user.alpha, clone_id: u101.b96.r0, city: {country: US, scheme: SYNTH2026, code: B96}, repeat_index: 0}
    - {user_id: user.alpha, clone_id: u101.b96.r1, city: {country: US, scheme: SYNTH2026, code: B96}, repeat_index: 1}
    - {user_id: user.alpha, clone_id: u101.b96.r2, city: {country: US, scheme: SYNTH2026, code: B96}, repeat_index: 2}
    - {user_id: user.alpha, clone_id: u101.b96.r3, city: {country: US, scheme: SYNTH2026, code: B96}, repeat_index: 3}
    - {user_id: user.alpha, clone_id: u101.b96.r4, city: {country: US, scheme: SYNTH2026, code: B96}, repeat_index: 4}
    - {user_id: user.beta, clone_id: u102.a95.r0, city: {country: US, scheme: SYNTH2026, code: A95}, repeat_index: 0}
    - {user_id: user.beta, clone_id: u102.a95.r1, city: {country: US, scheme: SYNTH2026, code: A95}, repeat_index: 1}
    - {user_id: user.beta, clone_id: u102.b96.r0, city: {country: US, scheme: SYNTH2026, code: B96}, repeat_index: 0}
    - {user_id: user.beta, clone_id: u102.b96.r1, city: {country: US, scheme: SYNTH2026, code: B96}, repeat_index: 1}
