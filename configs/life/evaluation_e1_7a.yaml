# E1-7A 代理规划闭环样例的评价规格（主臂；DECISIONS/0030）。由 evaluation_e1_6b.yaml 复制而来，只改了规格编号（另订正了 B96 槽位说明里继承下来的城市名笔误“B94”，说明不进入内容身份）：时间权重、
# 估值期、基础生活模板、治疗分支与 A95、B96 的槽位绑定逐项相同（评价内容身份因此相同）。期末估值由已有代码执行，
# 不是再让代理选一次第 4 年的生活；估值结果与参考分支不返回给生活中的代理。

evaluation_notice: >-
  exploratory_synthetic：E1-6A 跨期评价规格。月度时间权重 δ、估值期长度 H、估值期事件条件、参考方案与槽位绑定全部是
  合成探索设定，不代表任何人的真实时间偏好或未来生活，不能用于城市排序。v2：生活模板与治疗分支分开。

spec:
  spec_id: eval.e1-7a.main
  version: e1-6a-evaluation-v2
  status: exploratory_synthetic
  execution_revision: e1-6a-r2
  monthly_discount_factor: "1"
  valuation_horizon_months: 12
  valuation_event_condition: no_new_illness
  treatment_branching: by_continuing_illness_v1
  selection_rule: best_complete_feasible_in_reference_set
  combination: month_weighted_actual_plus_reference_v1
  note: >-
    主设定 δ = 1：每个月同等重要（实际 36 个月与估值 12 个月逐月同权）。估值期只评价 12 个月，之后的剩余资产不追加第二次
    终值，所以会低估更长远的收益；基础生活模板只有四个（治疗选择是独立分支），不新开课程、不续学未完成的课程。
  slots:
    - {slot_id: housing_basic, role: housing, description: 基本住房：离工作地远、房租较低的一居室}
    - {slot_id: housing_comfort, role: housing, description: 较舒适的住房：离工作地近、房租较高的一居室}
    - {slot_id: food_basic, role: food, description: 基本食品方案}
    - {slot_id: food_comfort, role: food, description: 新鲜食材方案}
    - {slot_id: exercise, role: service, description: 健身房月卡（声明了每月锻炼次数的按月服务）}
    - {slot_id: laundry_appliance, role: durable, description: 长寿命的洗衣设备（洗烘一体机）；已持有在用就不再买}
    - {slot_id: qualified_job, role: job, description: 要求会计资格的全职岗位（只有估值期初已经合格才适用）}
  life_templates:
    - template_id: p1_current_basic
      label: 现职 + 基本生活
      jobs: current_positions
      housing_slot: housing_basic
      food_slot: food_basic
      description: 延续终态里的当前岗位，远处住房、基本食品
    - template_id: p2_current_comfort
      label: 现职 + 较舒适的生活
      jobs: current_positions
      housing_slot: housing_comfort
      food_slot: food_comfort
      service_slots: [exercise]
      durable_purchases: [{slot_id: laundry_appliance, month: 1, rule: buy_if_not_held}]
      description: 延续当前岗位，近处住房、新鲜食材、健身；没有在用的洗衣设备就在第 1 月买一台
    - template_id: p3_qualified_basic
      label: 改做已具资格的岗位 + 基本生活
      jobs: qualified_alternative
      job_slot: qualified_job
      housing_slot: housing_basic
      food_slot: food_basic
      description: 估值期初已具会计资格才适用：改做会计，远处住房、基本食品
    - template_id: p4_qualified_comfort
      label: 改做已具资格的岗位 + 较舒适的生活
      jobs: qualified_alternative
      job_slot: qualified_job
      housing_slot: housing_comfort
      food_slot: food_comfort
      service_slots: [exercise]
      durable_purchases: [{slot_id: laundry_appliance, month: 1, rule: buy_if_not_held}]
      description: 估值期初已具会计资格才适用：改做会计，近处住房、新鲜食材、健身，没有洗衣设备就买
  city_bindings:
    - city: {country: US, scheme: SYNTH2026, code: A95}
      targets:
        - {slot_id: housing_basic, status: opportunity, opportunity_id: a95.housing.far}
        - {slot_id: housing_comfort, status: opportunity, opportunity_id: a95.housing.near}
        - {slot_id: food_basic, status: opportunity, opportunity_id: a95.food.basic}
        - {slot_id: food_comfort, status: opportunity, opportunity_id: a95.food.fresh}
        - {slot_id: exercise, status: opportunity, opportunity_id: a95.service.gym}
        - {slot_id: laundry_appliance, status: opportunity, opportunity_id: a95.durable.washer_dryer}
        - {slot_id: qualified_job, status: opportunity, opportunity_id: a95.job.accountant_office}
    - city: {country: US, scheme: SYNTH2026, code: B96}
      targets:
        - {slot_id: housing_basic, status: opportunity, opportunity_id: b96.housing.far}
        - {slot_id: housing_comfort, status: opportunity, opportunity_id: b96.housing.near}
        - {slot_id: food_basic, status: opportunity, opportunity_id: b96.food.basic}
        - {slot_id: food_comfort, status: opportunity, opportunity_id: b96.food.fresh}
        - {slot_id: exercise, status: opportunity, opportunity_id: b96.service.gym}
        - {slot_id: laundry_appliance, status: opportunity, opportunity_id: b96.durable.washer_dryer}
        - {slot_id: qualified_job, status: unavailable, reason: 合成情景：B96 的目录里确定没有要求会计资格的岗位}
