# 故事一 u01.a11.c0 第 1 年：工资每月 3,000；税：累计收入到第 4 月为 12,000，第 1–4 月税 0，
#   第 5–12 月每月 600（全年 4,800 = 20% × 24,000）。住房 + 食品每月 1,300。
#   月末现金：2,200 / 900（第 2 月买电脑 3,000）/ 2,600 / 4,300 / 5,400 / 6,350（音乐会 150）
#             / 5,770（年卡 480、学费 1,200）/ 6,870 / 7,970 / 9,070 / 10,170 / 11,270。
#   核对：500 + 36,000 − 4,800 − 15,600 − 3,000 − 150 − 480 − 1,200 = 11,270。
#   年末：电脑剩 37 个月；年卡还覆盖下一年第 1–6 月；簿记课 6/12。
#   第 2 年末 26,870（电脑 25 个月；年卡第 6 月到期；簿记课 12/12 完成）；
#   第 3 年末 42,470（电脑 13 个月）；之后是终态，编号 4 = N + 1。
# 故事二 u02.b12.c0：兼职每月 1,000、税 0；最低住房 1,000 + 最低食品 300 = 1,300。
#   月末现金 900 / 600 / 300 / 0（第 4 月 1,300 恰好够）；第 5 月入账后 1,000 < 1,300 → 出局。
#   归因（先住房后食品）：住房够，食品缺，缺口 300。
# 故事三 u02.a11.c0：第 1 月两居室 1,400 付得起（月末 400）；第 2 月入账后 1,400，最低 1,300
#   付得起，但两居室在为最低食品预留 400 之后只有 1,000 可用 → 按声明降级到单间 900
#   （月末 100）；第 3 月入账后 1,100 < 1,300 → 出局，食品缺 200。
#   没有声明兜底时，第 2 月返回"计划不可行"，什么都不提交。
# u01.b12.c0：年薪 40,000 按累计舍入摊月：3,333.33 / 3,333.34 / 3,333.33 循环，全年恰好 40,000；
#   税全年 5,600，各月预扣之和恰好等于它。年末 19,300。
