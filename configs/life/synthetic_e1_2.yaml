# E1-2 月度结算的合成样例（DECISIONS/0017）。
#
# **纯合成。** 所有城市、价格、税档、工作都是手工设定的测试夹具，不来自任何真实城市、
# 数据源或 LLM。数字故意取整，方便手算核对（见文末"手算结果"）。**它们不是科学默认值，
# 不能用来排序城市。**
#
# 与 E1-1 样例（synthetic_e1_1.yaml，保留不动）的区别：
#   * 每座城都声明了最低住房与最低食品（minimum_living）和合成税策略（tax_policy_id），
#     所以能结算；
#   * 同一个人在各城的开局**对齐**：现金、技能、精力、时间预算相同，都没有持有物。
#     E1-1 里 u02 在 A01 有洗衣机、在 B02 没有，那只适合结构测试，不适合公平比较；
#   * 计划带结构化的月份（start_month / end_month / month）。

fixture_notice: >-
  synthetic_fixture_only：E1-2 月度结算样例。城市、价格、税档、工作、偏好全部手工合成，
  不对应任何真实地点；税是合成测试替身，账目只验证记账规则，不是真实税后生活成本。
  第二国家 ZZ 与币种 XTS（ISO 4217 测试保留码）均为虚构，不与美元城市比较。

protocol:
  protocol_id: life-v1-e1-2
  schema_version: e1-2-draft
  life_rules_version: e1-2-monthly-v1
  scoring_scale_version: undefined
  info_permission_version: e1-2-draft
  status: synthetic_fixture_only
  simulation_years: 3
  math_policies:
    score_mapping: {state: undecided, proposal: "见 DECISIONS/0016 第六节，未采纳"}
    material_preference_aggregation: {state: undecided}
    energy_feedback: {state: undecided}
    income_payment_timing:
      state: decided
      decision_ref: DECISIONS/0017
      settled_parts:
        - 一年一份计划，环境按月记账，不增加月度 LLM 调用
        - 当月收入先入账，可用于同年后续月份；不能动用未来月份尚未挣到的工资
        - 年薪 ÷ 12、周价按每月 52/12 周，用累计舍入摊月，12 个月之和恰好等于年额
        - 按月计费的服务按实际覆盖月收费；年付服务在起始月一次付清、覆盖 12 个月，不拆分期
        - 税按日历年、跨所有工作累计预扣；出局后不对未挣到的收入计税
        - 同月竞争资金按计划顺序；没有借款、透支或自动变卖
    risk_scenarios: {state: undecided}
    discounting: {state: undecided}
    terminal_value: {state: undecided}
    failure_handling:
      state: undecided
      settled_parts:
        - 付不起最低住房与最低食品（两项合计）→ 出局，记录年月、缺哪项与缺口；钱恰好够则通过
        - 自选项付不起不是出局：拒绝该项并记原因，不给免费收入或物品
        - 自选住房或食品给不了而最低仍可负担：声明了兜底才降级（并披露），否则计划不可行
        - 结算前能发现的计划与格式错误报为输入错误，不留半本账，不记为出局
        - 最低生活或税的配置缺失、引用错误或不完整是数据错误，不是出局
        - 出局分身保留全部记录、不复活、不从分母里删除
      open_parts:
        - LLM 输出格式错误时的有限重试次数，以及重试后仍失败的默认动作（E1-7）
        - 计划不可行退回之后的重试规则（E1-7）
        - 出局月份与剩余期间如何计分（E1-6）

consumption_needs: [housing_space, fresh_food, convenience_food, food_prep_time, durables, workspace]
categories: [housing, food, durable, training, experience, job, service]

