# E1-4A 月度时间与精力的合成生活样例（DECISIONS/0020）。
#
# **纯合成。** 城市、价格、工时、准备时间、家务基准、负担系数、净可分配小时与精力额度全部是手工设定，
# 不来自任何真实城市、时间利用调查、生理学研究或 LLM。数字故意取整，方便手算（见文末）。
# **不是现实生活的可行性判断，不能用来排序城市。**
#
# 与 E1-3 系列样例（保留不动）的区别：协议的生活规则版本是 e1-4a-monthly-v1，必须带月度资源规则；
# 每项机会都写资源事实 resource（零也显式写），旧字段 time_cost_hours_per_year / energy_burden 保持 0；
# 每个人的 time_budget_hours 是年度净可分配小时（每月 = /12），energy.level 是每月可承受负担额度
# （尺度 e1-4a-monthly-quota-v1），并写明资源预算依据（预留了什么）。

fixture_notice: >-
  synthetic_fixture_only：E1-4A 月度时间与精力样例。价格、工时、准备时间、家务基准、负担系数、净可分配小时与
  精力额度全部手工合成，不对应任何真实地点或调查；税是合成测试替身；负担点不是经过标定的生理量。

protocol:
  protocol_id: life-v1-e1-4a
  schema_version: e1-4a-draft
  life_rules_version: e1-4a-monthly-v1
  scoring_scale_version: e1-3-supplement-v1
  info_permission_version: e1-4a-draft
  status: synthetic_fixture_only
  simulation_years: 3
  math_policies:
    score_mapping:
      state: undecided
      proposal: "E1-3 探索版与增补（ADR0018、ADR0019）的合成探索映射；本样例不评分"
    material_preference_aggregation: {state: undecided}
    energy_feedback:
      state: undecided
      settled_parts:
        - "月度精力额度约束：当月实际活动负担 ≤ 当月可承受额度；不结转、不回血，满足感不改变额度（DECISIONS/0020）"
      open_parts:
        - "满足感 → 下一年精力的反馈：公式、上限、滞后与关闭对照（E1-4B）"
    income_payment_timing:
      state: decided
      decision_ref: DECISIONS/0017
    risk_scenarios: {state: undecided}
    discounting: {state: undecided}
    terminal_value: {state: undecided}
    failure_handling:
      state: undecided
      settled_parts:
        - 付不起最低住房与最低食品（两项合计）→ 出局；钱恰好够则通过
        - 自选项付不起不是出局；自选住房/食品给不了而最低仍可负担时，声明了兜底才降级，否则计划不可行
        - 最低生活或税的配置缺失、引用错误、不完整，或最低方案与合格目录矛盾，都是数据错误
        - 时间或精力超限 → 计划不可行：整份计划试算失败、不提交账目、带资源诊断（DECISIONS/0020）
      open_parts:
        - LLM 格式错误的有限重试与重试后的默认动作（E1-7）
        - 计划不可行退回之后的重试（E1-7）
        - 出局月份与剩余期间如何计分（E1-6）
  resource_rules:
    version: e1-4a-monthly-resources-v1
    time_unit: hour
    month_rule: annual_net_hours_div_12
    reserved_time: >-
      净可分配小时已预留每天 8 小时睡眠与 4 小时基本休息（吃饭、洗漱、个人照料），按 365 天计；
      这些不再进活动账
    energy_unit: burden_point
    energy_scale_version: e1-4a-monthly-quota-v1
    commute_minutes_key: commute_roundtrip_minutes
    commute_reference: >-
      每座合成城只有一个到岗工作地点（城市就业中心的抽象）：住房写明的往返分钟就是到那里的往返，
      所有需要到岗的岗位都在那里；不做地图与路线规划
    commute_burden_per_hour: 0.75
    household_tasks:
      - {task: laundry, baseline_hours_per_month: 12, burden_per_hour: 0.5,
         description: 没有洗衣机或洗衣服务时，自己手洗或去自助洗衣店}
      - {task: cleaning, baseline_hours_per_month: 10, burden_per_hour: 0.6,
         description: 自己打扫一居室}
    source: &rules
      kind: synthetic
      observed_on: 2026-10-07
      geography_scope: synthetic city (no real geography)
      mapping_version: synthetic-e1-4a
      synthetic_note: 手工设定的资源规则与负担系数，不是时间利用调查或生理学标定

consumption_needs: [housing_space, fresh_food]
categories: [housing, food, durable, experience, job, service, training]

