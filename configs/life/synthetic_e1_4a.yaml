# ---------------------------------------------------------------------- 手算结果（合成）
# 每月时间预算 = 净可分配小时 / 12；负担 = 小时 × 每小时负担；家务本人小时 = min(基准, 在用替代的残余)。
# ① u21 近处：工作 160 + 通勤 30×20/60 = 10 + 做饭 40 + 洗衣 3（有洗衣机）+ 打扫 10 + 健身 8×1.5 = 12
#    = 235 小时（预算 365，剩 130）；负担 160 + 7.5 + 20 + 1.5 + 6 + 12 = 207（额度 250，剩 43）。
# ② u21 远处：通勤 70×20/60 = 70/3 ≈ 23.33 小时、负担 17.5 → 248⅓ 小时、217 负担点；每月房租少 400。
# ③ u21 便利：做饭 10（现成餐）、打扫 2（保洁）→ 197 小时、187.2 负担点；每月多花 250 + 约 173.33。
# ④ u21 志愿：第 6 月 235 + 140 = 375 > 365，超 10 小时；负担 207 + 14 = 221 ≤ 250 → 只有时间超限。
# ⑤ u21 远程（B52）：通勤 0 → 160 + 40 + 3 + 10 = 213 小时；负担 144 + 20 + 1.5 + 6 = 171.5。
# ⑥ u21 混合（B52）：通勤 80×8/60 = 32/3 ≈ 10.67 小时、负担 8 → 223⅔ 小时、160 + 8 + 20 + 1.5 + 6 = 195.5 负担点。
