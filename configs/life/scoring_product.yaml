# 生活扩展的探索评分配置（生活输入在 synthetic_product.yaml；DECISIONS/0033、DECISIONS/0041）。在“日常生活便利”版本上：
# 物质维四项：居住面积、饮食生活（实际完整食品方案的新鲜餐与合口味餐）、日常生活便利（实际减少的家务小时）、个人消费与享受（实际
# 提供的享受功能或服务量）；休闲维把“一次体验算一次”换成“实际参与小时”，确认的兴趣在同样参与小时下有适度更高的效率。
#
# **全部是合成探索参数，不是经验估计，不能声称已经现实标定，不能用来排序城市。** 新增参数在看任何 mock 结果与城市排序之前定下：
# η_taste = 0.5、κ = 0.5、η_hour = 1、个人消费与享受的 τ = 3 与各功能 η（见参数目录 PI-26–PI-29）。

scoring_notice: >-
  exploratory_synthetic：生活扩展的探索评分配置。物质维四项：居住面积、饮食生活、日常生活便利（实际减少的家务小时）、个人消费与享受；
  休闲按实际参与小时计、确认的兴趣有适度更高的效率。
  不代表任何真实城市的生活质量、医疗水平或人的心理规律。

spec:
  spec_id: score.e1-life.explore
  scoring_version: e1-life-v1
  status: exploratory_synthetic
  function: saturating_capped_v1
  protocol_id: life-v1-e3a-product
  note: >-
    物质维四个叶子：居住面积、饮食生活（实际完整食品方案）、日常生活便利（这个月本人实际少做的洗衣与打扫小时）、个人消费与享受（实际
    提供的享受功能与服务量）。安全、环境只有城市基础条件；休闲由城市基础条件、声明了使用安排的锻炼与实际活动参与小时改善；发展维 = 城市发展条件 + 当月实际新增的能力进度；通勤维为广义交通。医疗维没有分项；健康由
    全组共用的健康项 γ·H(月初状态) 评价。工资、现金、付款、成交与剩余时间不进入满足感。
  health:
    gamma: 0.2
    state_values: {healthy: 1.0, minor: 0.5, major: 0.0}
    rule: month_start_state
    definition: >-
      H 读这个月的月初健康状态（与工作限制同一个时点）：健康 1、小病 0.5、大病 0（合成方案）。同等病情对每个人的直接扣分都是
      γ(1 − H)，不乘个人医疗点数；付医疗费不加分，没有"没看病"的额外惩罚；治疗只改变之后的月份
  components:
    - component_id: housing_space
      dimension: material
      material_need: housing_space
      unit: 百平方英尺
      tau: 6
      combine: max
      description: 这个月实际住的那一处居所的面积。房租与通勤分钟都不进入这一项。
      sources:
        - source_id: dwelling
          records: [housing]
          value: spec_number
          measure: level
          spec_key: floor_area_sqft
          unit: 平方英尺
          note: 实际住的那一处；降级后读最低方案那一处的规格
    - component_id: food_life
      dimension: material
      material_need: food_life
      unit: 餐/周（折算）
      tau: 7
      description: >-
        饮食生活：这个月实际执行的完整食品方案每周有几顿新鲜餐、几顿合确认口味的餐。基本饮食覆盖是可行性（最低生活检查），不在这里
        加分；价格、餐馆档次与外食次数都不是输入；降级时读最低方案。
      food_life:
        rule: food_plan_fresh_and_taste_v1
        eta_fresh: 1.0
        eta_taste: 0.5
        cap: 0.9
        unit: 餐/周
        definition: >-
          z = η_fresh·F + η_taste·T，s = min(c, z/(z + τ))；F = 每周新鲜餐数，T = 主要菜系在确认口味里的组成每周几餐（每个组成只算
          一次）。η_fresh 与原“新鲜食品”项的 1 相同（中性用户的饮食分不变）；η_taste = 0.5 是探索设定
    - component_id: daily_convenience
      dimension: material
      material_need: daily_convenience
      unit: 小时/月
      tau: 8
      description: >-
        日常生活便利：这个月本人实际少做了多少小时家务（洗衣与打扫这组代表性杂务）。设备（一次购买、服务期内持续）与人工服务（按月购买、
        实际买到的月份）都只通过资源账里的本人残余小时起作用；成交、花钱与目标兑现不另计分。
      convenience:
        tasks: [laundry, cleaning]
        cap: 0.9
        rule: household_baseline_minus_residual_v1
        unit: 小时/月
        definition: >-
          q = Σ（协议家务基准小时 − 当月资源账里本人的残余小时），s = min(c, q/(q + τ))；同一项家务只取当月在用方案里残余最小的那一个
          （结算写出），不读价格、付款或成交。代表性杂务组合，不含做饭、通勤、工作、学习与疾病恢复
    - component_id: personal_enjoyment
      dimension: material
      material_need: personal_enjoyment
      unit: 享受功能（折算）
      tau: 3
      description: >-
        个人消费与享受：这个月实际在用的居家舒适用品与实际接受的享受型服务。按功能计：同功能的第二件用品不再加，服务按实际份数相加；
        纯爱好装备没有享受功能（它只让活动可以开展）；成交、花钱与购买次数不计分。
      enjoyment:
        rule: enjoyment_by_function_v1
        cap: 0.9
        unit: 功能（折算）
        definition: >-
          v_f = 1（presence：这个月有在用的、提供功能 f 的用品）或 Σ 份数（units：实际接受的服务次数）；z = Σ η_f·v_f，
          s = min(c, z/(z + τ))。η 与 τ 是探索设定
        functions:
          - {function: home_comfort, label: 居家舒适, measure: presence, eta: 1.5, unit: 在用}
          - {function: personal_care, label: 放松护理, measure: units, eta: 1.0, unit: 次}
    - component_id: safety
      dimension: safety
      unit: 指数（合成）
      tau: 3
      description: 统一城市背景；当前没有行动改善机制。
    - component_id: opportunity
      dimension: opportunity
      unit: 指数（合成）
      tau: 2
      description: >-
        发展维：城市的发展条件（背景 b，不由本人的学习结果回填）加上这个人这个月实际新增的能力进度。只计实际参加的学习；
        生病暂停的月份不上课，也就没有成长。证书本身、换岗、职位名称与涨薪都不另加分。
      growth:
        eta: 12
        progress_rule: ability_progress_increment_v1
        unit: 能力进度/月
        definition: >-
          g_m = 词表里每项能力当月新增进度之和；年初已有的能力进度为 1，未有的取授予它的课程里最高的"实际累计参加月数 /
          要求月数"。一门课授予两项能力就有两份进度：能力拆分粒度会影响成长量（合成假设，见参数目录 CA-06）
    - component_id: leisure
      dimension: leisure
      unit: 每月参与次数（折算）
      tau: 12
      combine: sum
      description: >-
        城市基础休闲条件，加上声明了使用安排的锻炼次数与实际活动参与小时（只计参与，不计准备与往返）。确认的兴趣在同样参与小时下效率
        高 κ；生病暂停的月份没有参与，也就没有改善。
      sources:
        - source_id: usage_plan
          records: [prepaid_service, periodic_service]
          requires_spec_key: visits_per_month
          value: spec_number
          measure: capacity
          spec_key: visits_per_month
          per_unit: true
          unit: 次/月
          note: 使用假设：只有声明了每月锻炼次数的会员才算锻炼
      participation:
        rule: participation_hours_interest_match_v1
        eta_hour: 1.0
        match_bonus: 0.5
        unit: 参与小时
        definition: >-
          x = Σ 参与小时 × (1 + κ·1[主要类别 ∈ 确认的兴趣])，贡献 η_hour·x 加进休闲的 z。η_hour = 1/小时：原来一次 4 小时的体验
          按“次”计 4，换成小时后锚点同步换成每小时 1；κ = 0.5 是探索设定，有界（0–1），只放大活动参与、不放大城市背景
    - component_id: environment
      dimension: environment
      unit: 指数（合成）
      tau: 3
      description: 城市基础环境（显式合成）。本样例不启用自然景观加分。
    - component_id: commute
      dimension: commute
      unit: 分钟/工作日往返
      tau: 60
      description: >-
        交通便捷程度及出行对生活的影响（维度键沿用 commute）。按这个月实际所住住房的往返分钟与实际累计到岗次数评分；
        大病病假的月份没有到岗，只剩 ρ 份不因上班消失的出行影响。时间与负担由月度资源账另算。
      transport:
        minutes_key: commute_roundtrip_minutes
        rho: 0.25
        reference_visits: 20
        unit: 分钟/工作日往返
        visits_unit: 次/月
        definition: >-
          k = ρ + (1 − ρ)·D/D_ref，T_eq = k·T，S = τ_T/(τ_T + T_eq)。T：实际住房到就业中心的往返分钟；D：资源账的当月累计
          到岗次数（多岗位相加；病假月份为 0）。T_eq 是评分中间量，不是实际出行分钟
  omissions:
    - what: 代表性杂务（洗衣、打扫）以外的家务与照护（采购、维修、照顾家人）；做饭的省时另在新鲜食品与时间账里
      affects: 家务负担主要不在洗衣与打扫上的人、有照护责任的人
      owner: V2（需要时间利用资料与所有者裁决）
    - what: 日常生活便利把"花钱换省事"合成一项：设备与人工、品牌与服务质量的偏好差异、对陌生人进家的顾虑、维修与转卖都没有区分
      affects: 喜欢某类设备却不愿意请人上门（或相反）的人；看重品牌或服务质量的人
      owner: V2（商品异质性，需要同规格报价）
    - what: 物质生活里住房、食品、杂务、居家舒适与放松护理之外的需求（通信、储物、工作设备、衣着）；品牌偏好只保留原文
      affects: 物质偏好集中在这些方面的人、很看重品牌的人（物质维的评价会偏窄）
      owner: E3 首发词表 / V2
    - what: 同时替代正餐的活动套餐（餐食覆盖、费用与时间的组合规则）；装备租赁库存
      affects: 想用美食活动或套餐代替一顿正餐的人；只想租不想买装备的人
      owner: V2（需要组合规则与所有者裁决）
    - what: 非工作出行（购物、社交、就医）的时间与满足感；公共交通可及性
      affects: 不上班但出行多的人、依赖公共交通或住得离日常设施远的人
      owner: V2（需要共同粒度的出行资料）
    - what: 学习之外的职业成长（持续成就感、职位名称、晋升、涨薪带来的满足感）
      affects: 很看重职位、晋升与长期成就感的人
      owner: CA-06 后续
    - what: 疾病的心理后果（焦虑、对生病的担心）、疲劳累积、慢性病、多病叠加、住院以外的照护与疾病名称
      affects: 体弱、慢性病、照护负担重或很担心健康的人
      owner: V2（需要外部资料与所有者裁决）
    - what: 期末仍未恢复的疾病、留存到期末的现金与物品的评价
      affects: 模拟最后几个月生病的人、看重储蓄与未来消费的人
      owner: E1-6A 只估 12 个月期末；更远的价值与课程潜力待定

comparison_group:
  group_id: group.e1-convenience.synth
  cities:
    - {country: US, scheme: SYNTH2026, code: K51}
    - {country: US, scheme: SYNTH2026, code: M52}
  scoring_version: e1-life-v1
  geography_scope: synthetic city (no real geography)
  currency: USD
  base_year: 2024
  time_basis: 2024 年不变价、当地价格水平（USD_2024_LOCAL）；年度决策、月度执行
  action_roles: [housing, food, job, durable_good, training, periodic_service, experience]
  allowed_source_kinds: [synthetic]
  commute_granularity: plan_level
  units:
    floor_area_sqft: 平方英尺
    visits_per_month: 次/月
    commute_roundtrip_minutes: 分钟/工作日往返
  note: >-
    合成比较组：两座城，全部用合成设定、同一地理口径、同一币种与基年；家务任务与基准由协议统一声明，两城的便利设备包与日常杂务服务
    效果定义（残余小时、寿命）逐项相同、只有价格不同；治疗目录按同一套需求定义与计价粒度写明。

