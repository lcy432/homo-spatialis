# E1 补充"日常生活便利"的探索评分配置（生活输入在 synthetic_product.yaml；DECISIONS/0033）。由 scoring_e1_7b_pilot.yaml 复制而来：
# 物质维第三项从"有没有洗衣设备"（laundry，any）换成"这个月实际少做了多少小时家务"（daily_convenience）；其余分项、健康项、
# 比较组口径与城市评分条件逐项相同（两座新合成城 K51、M52 的背景事实与 E1-7B 的 C97 相同）。
#
# **全部是合成探索参数，不是经验估计，不能声称已经现实标定，不能用来排序城市。** τ = 8 小时/月、c = 0.9 是开跑前冻结的合成设定，
# 不按 LLM 的结果调。

scoring_notice: >-
  exploratory_synthetic：E1 补充"日常生活便利"的探索评分配置。物质维三项：居住面积、新鲜食品、日常生活便利（实际减少的家务小时）。
  不代表任何真实城市的生活质量、医疗水平或人的心理规律。

spec:
  spec_id: score.e1-convenience.explore
  scoring_version: e1-convenience-v1
  status: exploratory_synthetic
  function: saturating_capped_v1
  protocol_id: life-v1-e3a-product
  note: >-
    物质维三个叶子：居住面积、新鲜食品、日常生活便利（这个月本人实际少做的洗衣与打扫小时）。安全、环境只有城市基础条件；休闲由城市
    基础条件与实际发生的锻炼、体验改善；发展维 = 城市发展条件 + 当月实际新增的能力进度；通勤维为广义交通。医疗维没有分项；健康由
    全组共用的健康项 γ·H(月初状态) 评价。工资、现金、付款、成交与剩余时间不进入满足感。
  health:
    gamma: 0.2
    state_values: {healthy: 1.0, minor: 0.5, major: 0.0}
    rule: month_start_state
    definition: >-
      H 读这个月的月初健康状态（与工作限制同一个时点）：健康 1、小病 0.5、大病 0（合成方案）。同等病情对每个人的直接扣分都是
      γ(1 − H)，不乘个人医疗点数；付医疗费不加分，没有"没看病"的额外惩罚；治疗只改变之后的月份
  components:
    - component_id: housing_space
      dimension: material
      material_need: housing_space
      unit: 百平方英尺
      tau: 6
      combine: max
      description: 这个月实际住的那一处居所的面积。房租与通勤分钟都不进入这一项。
      sources:
        - source_id: dwelling
          records: [housing]
          value: spec_number
          measure: level
          spec_key: floor_area_sqft
          unit: 平方英尺
          note: 实际住的那一处；降级后读最低方案那一处的规格
    - component_id: fresh_food
      dimension: material
      material_need: fresh_food
      unit: 新鲜餐/周（折算）
      tau: 7
      combine: max
      description: 这个月实际执行的食品方案每周有几顿新鲜餐。准备时间是时间事实，不另给一份"省时幸福"。
      sources:
        - source_id: food_plan
          records: [food]
          value: spec_number
          measure: level
          spec_key: fresh_meals_per_week
          unit: 餐/周
          note: 实际吃的那一份方案；降级后读最低方案那一份
    - component_id: daily_convenience
      dimension: material
      material_need: daily_convenience
      unit: 小时/月
      tau: 8
      description: >-
        日常生活便利：这个月本人实际少做了多少小时家务（洗衣与打扫这组代表性杂务）。设备（一次购买、服务期内持续）与人工服务（按月购买、
        实际买到的月份）都只通过资源账里的本人残余小时起作用；成交、花钱与目标兑现不另计分。
      convenience:
        tasks: [laundry, cleaning]
        cap: 0.9
        rule: household_baseline_minus_residual_v1
        unit: 小时/月
        definition: >-
          q = Σ（协议家务基准小时 − 当月资源账里本人的残余小时），s = min(c, q/(q + τ))；同一项家务只取当月在用方案里残余最小的那一个
          （结算写出），不读价格、付款或成交。代表性杂务组合，不含做饭、通勤、工作、学习与疾病恢复
    - component_id: safety
      dimension: safety
      unit: 指数（合成）
      tau: 3
      description: 统一城市背景；当前没有行动改善机制。
    - component_id: opportunity
      dimension: opportunity
      unit: 指数（合成）
      tau: 2
      description: >-
        发展维：城市的发展条件（背景 b，不由本人的学习结果回填）加上这个人这个月实际新增的能力进度。只计实际参加的学习；
        生病暂停的月份不上课，也就没有成长。证书本身、换岗、职位名称与涨薪都不另加分。
      growth:
        eta: 12
        progress_rule: ability_progress_increment_v1
        unit: 能力进度/月
        definition: >-
          g_m = 词表里每项能力当月新增进度之和；年初已有的能力进度为 1，未有的取授予它的课程里最高的"实际累计参加月数 /
          要求月数"。一门课授予两项能力就有两份进度：能力拆分粒度会影响成长量（合成假设，见参数目录 CA-06）
    - component_id: leisure
      dimension: leisure
      unit: 每月参与次数（折算）
      tau: 12
      combine: sum
      description: 城市基础休闲条件，加上声明了使用安排的锻炼次数与实际发生的体验。生病暂停的月份没有使用，也就没有改善。
      sources:
        - source_id: usage_plan
          records: [prepaid_service, periodic_service]
          requires_spec_key: visits_per_month
          value: spec_number
          measure: capacity
          spec_key: visits_per_month
          per_unit: true
          unit: 次/月
          note: 使用假设：只有声明了每月锻炼次数的会员才算锻炼
        - source_id: events
          records: [experience]
          value: quantity
          measure: count
          unit: 次
          note: 这个月实际发生的一次体验
    - component_id: environment
      dimension: environment
      unit: 指数（合成）
      tau: 3
      description: 城市基础环境（显式合成）。本样例不启用自然景观加分。
    - component_id: commute
      dimension: commute
      unit: 分钟/工作日往返
      tau: 60
      description: >-
        交通便捷程度及出行对生活的影响（维度键沿用 commute）。按这个月实际所住住房的往返分钟与实际累计到岗次数评分；
        大病病假的月份没有到岗，只剩 ρ 份不因上班消失的出行影响。时间与负担由月度资源账另算。
      transport:
        minutes_key: commute_roundtrip_minutes
        rho: 0.25
        reference_visits: 20
        unit: 分钟/工作日往返
        visits_unit: 次/月
        definition: >-
          k = ρ + (1 − ρ)·D/D_ref，T_eq = k·T，S = τ_T/(τ_T + T_eq)。T：实际住房到就业中心的往返分钟；D：资源账的当月累计
          到岗次数（多岗位相加；病假月份为 0）。T_eq 是评分中间量，不是实际出行分钟
  omissions:
    - what: 代表性杂务（洗衣、打扫）以外的家务与照护（采购、维修、照顾家人）；做饭的省时另在新鲜食品与时间账里
      affects: 家务负担主要不在洗衣与打扫上的人、有照护责任的人
      owner: V2（需要时间利用资料与所有者裁决）
    - what: 日常生活便利把"花钱换省事"合成一项：设备与人工、品牌与服务质量的偏好差异、对陌生人进家的顾虑、维修与转卖都没有区分
      affects: 喜欢某类设备却不愿意请人上门（或相反）的人；看重品牌或服务质量的人
      owner: V2（商品异质性，需要同规格报价）
    - what: 物质生活里住房、食品、杂务之外的需求（通信、储物、工作设备、衣着）
      affects: 物质偏好集中在这些方面的人（物质维的评价会偏窄）
      owner: E3 首发词表 / V2
    - what: 非工作出行（购物、社交、就医）的时间与满足感；公共交通可及性
      affects: 不上班但出行多的人、依赖公共交通或住得离日常设施远的人
      owner: V2（需要共同粒度的出行资料）
    - what: 学习之外的职业成长（持续成就感、职位名称、晋升、涨薪带来的满足感）
      affects: 很看重职位、晋升与长期成就感的人
      owner: CA-06 后续
    - what: 疾病的心理后果（焦虑、对生病的担心）、疲劳累积、慢性病、多病叠加、住院以外的照护与疾病名称
      affects: 体弱、慢性病、照护负担重或很担心健康的人
      owner: V2（需要外部资料与所有者裁决）
    - what: 期末仍未恢复的疾病、留存到期末的现金与物品的评价
      affects: 模拟最后几个月生病的人、看重储蓄与未来消费的人
      owner: E1-6A 只估 12 个月期末；更远的价值与课程潜力待定

comparison_group:
  group_id: group.e1-convenience.synth
  cities:
    - {country: US, scheme: SYNTH2026, code: K51}
    - {country: US, scheme: SYNTH2026, code: M52}
  scoring_version: e1-convenience-v1
  geography_scope: synthetic city (no real geography)
  currency: USD
  base_year: 2024
  time_basis: 2024 年不变价、当地价格水平（USD_2024_LOCAL）；年度决策、月度执行
  action_roles: [housing, food, job, durable_good, training, periodic_service, experience]
  allowed_source_kinds: [synthetic]
  commute_granularity: plan_level
  units:
    floor_area_sqft: 平方英尺
    fresh_meals_per_week: 新鲜餐/周
    visits_per_month: 次/月
    commute_roundtrip_minutes: 分钟/工作日往返
  note: >-
    合成比较组：两座城，全部用合成设定、同一地理口径、同一币种与基年；家务任务与基准由协议统一声明，两城的便利设备包与日常杂务服务
    效果定义（残余小时、寿命）逐项相同、只有价格不同；治疗目录按同一套需求定义与计价粒度写明。

