    label: 合成城 K51
    components:
      - {component_id: housing_space, status: known, base: 0, cap: 0.9, efficiencies: [{source_id: dwelling, eta: 0.01}], source: &cond
          {kind: synthetic, observed_on: 2026-10-18, geography_scope: synthetic city (no real geography),
           mapping_version: scoring-e1-convenience, synthetic_note: 手工设定的探索参数，不是经验估计}}
      - {component_id: fresh_food, status: known, base: 0, cap: 0.9, efficiencies: [{source_id: food_plan, eta: 1.0}], source: *cond}
      - {component_id: daily_convenience, status: plan_level, source: *cond}
      - {component_id: safety, status: known, base: 3, cap: 0.9, source: *cond}
      - {component_id: opportunity, status: known, base: 2, cap: 0.9, source: *cond}
      - {component_id: leisure, status: known, base: 4, cap: 0.9,
         efficiencies: [{source_id: usage_plan, eta: 1.0}, {source_id: events, eta: 4.0}], source: *cond}
      - {component_id: environment, status: known, base: 3, cap: 0.9, source: *cond}
