    components:
      - {component_id: housing_space, status: known, base: 0, cap: 0.9, efficiencies: [{source_id: dwelling, eta: 0.01}], source: &cond
          {kind: synthetic, observed_on: 2026-10-06, geography_scope: synthetic city (no real geography),
           mapping_version: scoring-e1-3, synthetic_note: 手工设定的探索参数，不是经验估计}}
      - {component_id: fresh_food, status: known, base: 0, cap: 0.9, efficiencies: [{source_id: food_plan, eta: 1.0}], source: *cond}
      - {component_id: workspace, status: known, base: 1, cap: 0.9, eta_any: 3, source: *cond}
      - {component_id: durables, status: known, base: 0, cap: 0.9, efficiencies: [{source_id: owned, eta: 1.0}], source: *cond}
      - {component_id: safety, status: known, base: 3, cap: 0.9, source: *cond}
      - {component_id: healthcare, status: known, base: 4, cap: 0.9, source: *cond}
      - {component_id: opportunity, status: known, base: 2, cap: 0.9, source: *cond}
      - {component_id: leisure, status: known, base: 4, cap: 0.9,
