# E1-1 生活契约的合成样例（DECISIONS/0016）。
#
# **纯合成。** 所有城市、价格、工作、偏好都是手工设定的测试夹具，不来自任何真实
# 城市、数据源或 LLM。数值只用来检验结构：两城的相对价格结构不同、两人的消费偏好
# 不同、三种可得状态都在场。**它们不是科学默认值，不能用来排序城市。**
#
# 不得根据"工业城""北方"这类标签让 LLM 编造实际价格——这里一个都没有那样来。

fixture_notice: >-
  synthetic_fixture_only：E1-1 结构验证样例。城市、价格、工作、偏好全部手工合成，
  不对应任何真实地点；第二国家 ZZ 与币种 XTS（ISO 4217 测试保留码）均为虚构。

protocol:
  protocol_id: life-v1-contract
  schema_version: e1-1-draft
  life_rules_version: e1-1-draft-no-settlement
  scoring_scale_version: undefined
  info_permission_version: e1-1-draft
  status: synthetic_fixture_only
  math_policies:
    score_mapping: {state: undecided, proposal: "见 DECISIONS/0016 第六节，未采纳"}
    material_preference_aggregation: {state: undecided}
    energy_feedback: {state: undecided}
    income_payment_timing: {state: undecided}
    risk_scenarios: {state: undecided}
    discounting: {state: undecided}
    terminal_value: {state: undecided}
    failure_handling: {state: undecided}

consumption_needs: [housing_space, fresh_food, convenience_food, food_prep_time, durables, workspace]
categories: [housing, food, durable, training, experience, job, workspace]

catalogs:
  # ------------------------------------------------------------------ A01：住房便宜、食品贵
