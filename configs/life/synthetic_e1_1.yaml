      - {need: fresh_food, status: partial, note: 只有一种新鲜食材方案}
      - {need: convenience_food, status: supported}
      - {need: food_prep_time, status: partial, note: 准备时间只由方案的时间成本间接表达}
      - {need: durables, status: supported}
      - {need: workspace, status: supported}

