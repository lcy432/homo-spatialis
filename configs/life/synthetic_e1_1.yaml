        source: *synth
      - opportunity_id: a01.job.office_admin
        category: job
        label: 行政文员
        unit: position
        quality: 全职，坐班
        availability: available
        compensation: {amount: {amount: 46000, numeraire: USD_2024_LOCAL}, billing: per_year, per_unit: position-year}
        occupation: {scheme: SOC2018, code: "43-6014"}
        time_cost_hours_per_year: 1900
        energy_burden: 6.0
