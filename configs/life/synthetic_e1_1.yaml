# ---------------------------------------------------------------------- 两位用户
# 陈述（产品可见）与真值（研究内部）是两个独立的列表。
stated_profiles:
  - person_id: u01
    dimension_points: {material: 35, safety: 15, healthcare: 10, opportunity: 15, leisure: 5, environment: 5, commute: 15}
    soft_preferences:
      - {need: housing_space, stated_strength: high, note: 想要宽敞一点}
      - {need: food_prep_time, stated_strength: high, note: 不想花时间做饭}
      - {need: fresh_food, stated_strength: low}
    hard_requirements:
      - need: workspace
        requirement: {home_office: true}
        acceptable_substitutes:
          - {description: 共享办公会员, satisfies_with: {category: workspace}}
          - {description: 两居室中的一间, satisfies_with: {min_bedrooms: 2}}
    free_text: 我在家远程处理报表，需要一个能关门的地方；做饭能省就省。
    occupation: {scheme: SOC2018, code: "43-6014"}
  - person_id: u02
    dimension_points: {material: 25, safety: 10, healthcare: 20, opportunity: 10, leisure: 15, environment: 15, commute: 5}
    soft_preferences:
      - {need: fresh_food, stated_strength: high, note: 每周都要买新鲜蔬菜}
      - {need: housing_space, stated_strength: low, note: 住小一点没关系}
      - {need: durables, stated_strength: medium}
    hard_requirements:
      - need: fresh_food
        requirement: {fresh_produce_weekly: true}
        acceptable_substitutes:
          - {description: 新鲜食材配送套餐, satisfies_with: {fresh_share: high}}
    free_text: 吃得新鲜比住得大重要。
    occupation: {scheme: SOC2018, code: "43-6014"}

internal_truths:
  - person_id: u01
    status: synthetic_fixture_only
    dimension_weights: {material: 0.35, safety: 0.15, healthcare: 0.10, opportunity: 0.15, leisure: 0.05, environment: 0.05, commute: 0.15}
    material_subweights: {housing_space: 0.40, fresh_food: 0.05, convenience_food: 0.15, food_prep_time: 0.20, durables: 0.05, workspace: 0.15}
  # u02 的真值故意与陈述不完全一致（陈述 material 25 / healthcare 20），
  # 用来检验：产品模式即使显示陈述，真值也到不了 payload。
  - person_id: u02
    status: synthetic_fixture_only
    dimension_weights: {material: 0.28, safety: 0.10, healthcare: 0.17, opportunity: 0.10, leisure: 0.15, environment: 0.15, commute: 0.05}
    material_subweights: {housing_space: 0.10, fresh_food: 0.45, convenience_food: 0.05, food_prep_time: 0.10, durables: 0.25, workspace: 0.05}

