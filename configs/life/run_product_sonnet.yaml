# 非全量的真实 LLM 测试配置（所有者 2026-10-19）：Claude Sonnet 5.5（configs/models.yaml 的 test_planner_sonnet 角色），effort max，经
# Claude Agent SDK 单轮调用。scripts/run_life_e1_7b.py 不写 --config 时就用它。名单 roster_product.yaml（一位用户 × 两座城 × 每城一个分身
# × 3 年）、提示模板 e3a-product-prompt-v2。全规模的产品流程测试不用它，用 scripts/run_product_full.py（Qwen Flash）。
# 不记账（unmetered_reason，走本机已登录的 Claude 订阅），只受全局规划调用上限约束。

run_notice: >-
  exploratory_synthetic：产品协议样例的非全量真实 LLM 测试配置（Claude Sonnet 5.5，effort max，滚动型号，Claude Agent SDK 单轮调用）。合成城市、合成参数、
  合成人设；结果只说明这个模型在这一次合成试跑里的表现，不代表模型的一般能力，也不是现实城市评价。

run:
  run_config_id: run.product.sonnet
  status: exploratory_synthetic
  version: e1-7b-run-v1
  roster: configs/life/roster_product.yaml
  city_facts: configs/life/city_facts_product.yaml
  information:
    condition: product_stated_profile
    show_stated_dimension_points: true
    show_hard_requirements: true
    show_free_text: true
    show_energy_level: true
    show_stated_material_points: true
    permission_version: e3a-product-v1
    show_health_answers: true
  planning:
    plans_per_year: 1
    max_revisions_per_year: 2
    global_call_limit: 12
    run_order: roster_order
    transport_retries: 1
    note: >-
      每个分身每年一次正常规划、最多两次修订（与 Flash 配置相同）。全局规划调用上限 12；两个分身 × 3 年至少要 6 次，实际还受共用账本的额度约束。
      每份候选最多再试 1 次服务请求，与计划修订分开计数。顺序调度，不并发
  planner:
    identity:
      kind: llm
      planner_id: llm.claude.test_planner_sonnet
      version: e1-7b-llm-v1
      model_snapshot: claude-sonnet-5-5
      note: 真实模型规划器：Claude Agent SDK 单轮调用（一个输入、一轮、一个输出；无工具、不读设置、隔离环境）上的 Claude 滚动型号（没有带日期的快照）；只收安全投影的请求，计划由环境检查与结算
    llm:
      model_role: test_planner_sonnet
      provider: claude_agent_sdk
      model: claude-sonnet-5-5
      version_policy: rolling
      base_url: https://api.anthropic.com
      response_format: prompt_only
      auth: claude_subscription
      thinking: adaptive
      effort: max
      max_output_tokens: 128000
      timeout_seconds: 600
      sdk_max_retries: 0
      service_retries: 1
      retry_wait_seconds: 5
      max_input_tokens: 64000
      token_estimate: ascii1_nonascii2_v1
      note: >-
        Claude Agent SDK 单轮调用：max_turns 1、无工具、不读设置、隔离的工作目录与配置目录、命令行内部重试与提示缓存关闭；输出不另设上限（用模型
        自身的最大值 128,000，与命令行不设时的默认相同；所有者 2026-10-18 要求）、超时 600 秒；每份候选最多 1 次服务重试与 Flash 相同；不设温度，思考由命令行固定为自适应，effort max（所有者 2026-10-19 指定：非全量测试用 Sonnet 5.5 max）
  unmetered_reason: >-
    使用 Claude 订阅额度（auth: claude_subscription，所有者 2026-10-18：先不计算费用）；只受全局规划调用上限约束，
    token 用量照记在请求明细里
  prompt_template: e3a-product-prompt-v2
  memory_policy: e1-7a-memory-v1
  note: 非全量真实 LLM 测试的默认配置（Claude Sonnet 5.5，effort max）；mock 对照见 run_product_mock.yaml，全规模见 scripts/run_product_full.py。
