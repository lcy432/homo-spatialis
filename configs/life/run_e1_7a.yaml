# E1-7A 运行配置（DECISIONS/0030）。开跑之前写好；运行清单记下它的内容身份——改了任何一项（名单、事实表、信息条件、修订
# 上限、调用上限、运行顺序、规划器与它的受控行为、提示模板、记忆政策），都不能冒充原来那次运行继续。
#
# 本轮的规划器是可控的 mock（agentlayer.life_mock）：它只检验接口、状态传递、错误处理与信息隔离，不代表任何真实模型的能力；
# 运行没有网络调用。两段受控行为对应 E1-7A 的生活故事（其余分身只按 mock 的读观察规则规划）：
#   u101.a95.r1 第 1 年：第一份草稿多做一份工作（精力超限）→ 按安全诊断修订；第 2 年第 5 月的大病发生在执行中，不能回到年初重选
#   u101.b96.r3 第 2 年：每次都返回不是 JSON 的文字 → 三份候选都不合格，规划停止；第 1 年的生活保留

run_notice: >-
  exploratory_synthetic：E1-7A 代理规划闭环的演示运行配置。合成城市、合成参数、mock 规划器；不是现实城市评价，不代表真实模型能力。

run:
  run_config_id: run.e1-7a.demo
  status: exploratory_synthetic
  version: e1-7a-run-v1
  roster: configs/life/roster_e1_7a.yaml
  city_facts: configs/life/city_facts_e1_7a.yaml
  information:
    condition: product_stated_profile
    show_stated_dimension_points: true
    show_soft_preferences: true
    show_hard_requirements: true
    show_free_text: true
    show_energy_level: true
    show_stated_material_points: true
    permission_version: e1-7a-product-v1
  planning:
    plans_per_year: 1
    max_revisions_per_year: 2
    global_call_limit: 60
    run_order: roster_order
    transport_retries: 0
    note: >-
      每个分身每年一次正常规划、最多两次修订（三份候选）；全局调用上限 60 次（10 个分身 × 3 年的正常规划是 30 次，留出修订的
      余量）。网络重试另计，本轮不实现（固定 0）。顺序调度，不并发
  planner:
    identity:
      kind: mock
      planner_id: mock.rules.e1-7a
      version: e1-7a-mock-v1
      rules_version: e1-7a-mock-rules-v1
      note: 可控的确定性模拟代理：只检查接线、状态传递与信息隔离，不代表任何真实模型的能力
    scripts:
      - {clone_id: u101.a95.r1, behavior: overcommit_first_draft, years: [1],
         note: 故事二：第一份草稿保留现职、再做一份门店组长，精力超限 → 按诊断删掉一份工作}
      - {clone_id: u101.b96.r3, behavior: malformed_output, years: [2],
         note: 故事三：第 2 年每次都给不出 JSON → 修订耗尽，规划停止；第 1 年的生活照常进入评价}
  prompt_template: e1-7b-prompt-v1
  memory_policy: e1-7a-memory-v1
  note: 两位用户、两座城、10 个分身；主臂一个。
