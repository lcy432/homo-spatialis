# 门一：产品前提。零大模型调用。
#
# 判据（§9.1.1.1）：在福利离散度高于 τ 的选择集上，L_rep 的中位数是否超过
# §9.3 的噪声地板。若在任何现实可构造的选择集上都不超过 → 判定个人化在本
# 装置上不可测量，停下来报告。
#
# **本文件必须在跑之前 commit**（硬规则 20）。事后调阈值等于没有阈值。
# 这里的每一个数都是预注册的判据，不是可调参数。

meta:
  gate: one
  criterion_source: "README §9.1.1.1"
  status: PREREGISTERED_AMENDED
  preregistered_at: fe0ab6e          # 原始冻结 commit
  preregistered_sha256_16: cf1b22dbce286df2
  amendments:
    - date: 2026-09-10
      field: perturbation.aggregation
      from: median_within_then_across
      to: mean_within_then_across
      reason: structural           # 见 DECISIONS/0010；理由先验成立，与实测无关
      original_still_reported: true
  llm_calls: 0

# ---------------------------------------------------------------------------
# τ 梯子：不是单点，是一条曲线
# ---------------------------------------------------------------------------
#
# 门一只需要问"是否**存在**现实可构造的 τ 让 L_rep 超过地板"，但 §1.2 问题三
# 本来就要"信噪比随选择集变化"这条曲线，两者用同一批数据。
#
# 目标量是 ln_welfare_dispersion（硬规则 27：规范形式是 ln V，不是美元）。
# 参考量级：随机生成的世界对典型人设给出的离散度在 0.3 附近。梯子跨了大约
# 一个数量级，两端都超出典型值，这样"低于 τ 时不成立"这半句话才有内容。
#
# P5 的求解器能精确达成任意目标（残差 1e-16），所以这些不是"分组的边界"，
# 是**构造出来的世界**：每一档只在离散度上不同，排序完全相同（缩放是仿射
# 且斜率为正）。分组比较因此不会把"题目本身换了"当成信号。
tau_ladder:
  quantity: ln_welfare_dispersion
  values: [0.05, 0.10, 0.20, 0.40, 0.80]

  # 预检实测（500 人设，世界 seed 20260906，2026-09-06 跑）。
  # 参考：未调整世界的基线离散度中位数 0.322，p10 0.180，p90 0.522。
  # 梯子从远低于典型值跨到远高于，"低于 τ 时不成立"那半句话才有内容。
  feasibility_precheck:
    n_personas: 500
    world_seed: 20260906
    measured: {0.05: 1.000, 0.10: 1.000, 0.20: 1.000, 0.40: 0.990, 0.80: 0.862}

  # 掉出去的人设**有系统特征**：不可行者的 w₁ 中位数在 τ=0.4 是 0.84、
  # τ=0.8 是 0.66，远高于总体的 0.29。w₁ 高则 θ 小，舒适度维杠杆不足
  # （要挪动 Δ 得改 Δ/θ_k），够不到目标。非随机缺失，必须报。
  on_infeasible: report_and_exclude

  # **预注册判据**：可行比例低于阈值的档不参与门一判定，只作描述性报告。
  # 理由是"存在某个 τ 让 L_rep 超过地板"这句话，若那一档只有一半人设可行、
  # 且掉的全是高 w₁ 的，它描述的就不是总体。
  #
  # 0.80 是事前定的起点。按预检五档全部达标（最低 0.862），所以这条判据
  # 当前不排除任何一档——但它必须在跑之前写死，否则跑完发现某档不好看
  # 再拿它当借口，就成了事后规则。
  min_feasible_fraction: 0.80
  below_threshold: descriptive_only

# ---------------------------------------------------------------------------
# 噪声地板：问卷粒度诱导的 EV 变动
# ---------------------------------------------------------------------------
perturbation:
  # §9.3：每维 ±5 分。这个数来自定和量表的粒度，所以判据有依据、不是拍的。
  cap_points: 5.0

  # **总和守恒**。定和量表是一百分的分配，"每维独立 ±5"会让总分漂移，
  # 那不是这份问卷可能产生的答卷。
  constant_sum: true

  # 逐维对称截断：cap_k = min(5, 该维当前分数)。
  #
  # 三条约束（幅度、守恒、非负）里，前两条定义的多面体在 δ → −δ 下对称，
  # 均匀分布的均值恰好为零。第三条怎么加，决定扰动有没有方向性推力。
  # 1000 人设实测：
  #
  #   对称抽样再拒绝 w+δ<0     E[ΔH_norm] = +0.0167 (z=+80)，|E[δ]|max 0.86 分
  #   按人设整体缩放           零均值，但 δ_max 中位数只有 0.23 分，地板被压扁
  #   逐维对称截断（本方案）    E[ΔH_norm] = −0.0102，每维幅度中位 3.71 分
  #
  # H_norm 对 w 凹，零均值扰动按 Jensen 应当**降低**期望熵；非负约束从不
  # 生效的那批人设实测 −0.0127，理论对上了。拒绝法把符号翻成正的，因为它
  # 在一个非对称事件上做条件（小维度不能往下走），净效果是推向均匀＝
  # **推向中心**——而那正是本项目要测的东西，标尺不能带着它。
  #
  # 逐维截断两侧同时做，多面体保持对称，零均值由**构造**保证；非负性也由
  # 构造保证（cap_k ≤ points_k），不需要事后过滤。
  sampler: per_dimension_symmetric_truncation

  # 坐标对 Gibbs。cap 异质时从均匀单纯形上拒绝的接受率中位数只有 1.2%
  # （五成以上人设低于 2%），那是采样器差不是分布不好。Gibbs 命中率百分之
  # 百，实测滞后一自相关 +0.036。
  gibbs_sweeps: 30

  draws_per_persona: 32

  # 人设内取**均值**，跨人设取中位数（2026-09-10 修订，见 DECISIONS/0010）。
  #   每个人设：32 次扰动诱导的 EV 变动的**均值** → 这个人的噪声地板
  #   跨人设：  上述值的中位数                     → 报告的噪声地板
  #
  # 原为两级中位数。改的理由是结构性的、先验成立的：argmax 是离散的，
  # 不翻转则损失严格为零，所以人设内是一个**零膨胀分布**，对它取中位数
  # 在翻转概率低于 50% 时**恒等于零**——不是噪声小，是中位数落在零点质量上。
  #
  # 均值才与 L_rep 同类（期望美元成本），而且美元单位的全部意义就是线性
  # 可加，取中位数把线性性丢掉了。均值还天然可分解成
  # P(翻转) × E[损失|翻转]，两者是同一个数，拆开报信息更多。
  #
  # 跨人设那一轴不动：人口摘要要对 1/w₁ 的重尾稳健，且与 L_rep 一侧对称。
  aggregation: mean_within_then_across

  # **原判据照样计算、照样进产出**，读者自行判断修订有没有改变结论。
  also_report: median_within_then_across

  # 方向性推力诊断**必进产出**，两个方案都报。不是可选的健全性检查：
  # 一个带方向性推力的地板会把被测对象掺进标尺，而那不会报错。
  report_diagnostics_for:
    - per_dimension_symmetric_truncation
    - symmetric_with_rejection
# ---------------------------------------------------------------------------
# 三条基准线（C1）。全部在真值参数下评价，只有 argmax 用近似参数。
# ---------------------------------------------------------------------------
#
# 硬规则 13：若用近似参数同时做选择和评价，算出的是自洽的胡话而不是损失。
baselines:
  evaluate_with: true_params_always
  argmax_with: approximate_params

  # w_mat = (1,0,0,0,0,0,0)：现状的生活成本计算器没有偏好权重维度，
  # 只按实际收入排序。s̄ 是代表性篮子。两者是**两个不同的近似**，
  # 不能混为一谈（§1.2 问题二）。
  definitions:
    L_rep:   { shares: representative, weights: material_only }
    L_s:     { shares: representative, weights: true }
    L_amen:  { shares: true,           weights: material_only }

  # L_s + L_amen ≠ L_rep（argmax 不可加）。三项分别报，不要相加。
  additive: false

# ---------------------------------------------------------------------------
# 样本
# ---------------------------------------------------------------------------
sample:
  # 长通勤研究 profile 的门一检查。**这是另一次运行**，判据一字未动，
  # 旧结果（runs/20260911T014107Z-2d2d30，默认标定）的适用范围不因此扩大。
  world_calibration: LONG_COMMUTE_ARM_2024
  n_personas: 1000
  persona_seed: 20260906
  world_seed: 20260906
  n_cities: 12

  # **不分层。** P10 的分层服务的是条件层面的量（proj 对 d 的斜率、r(d)），
  # 而门一是一个**人口层面**的中位数。按 §11.9.2，人口层面的陈述要用抽样
  # 权重还原到真实边际分布——不分层就是那个边际分布本身，无需还原。
  # 在这里分层反而要多一步加权，多一处出错的地方。
  stratified: false

  # 抽样分布：物质维 α₁=1.5，六个舒适度维 α=0.5（DECISIONS/0006）。
  dirichlet_material_alpha: 1.5
  dirichlet_amenity_alpha: 0.5

# ---------------------------------------------------------------------------
# 判据
# ---------------------------------------------------------------------------
decision:
  # 门一通过 ⟺ 梯子上**存在**某一档，其 median(L_rep) 的置信区间下沿
  # 严格超过噪声地板。
  #
  # 要求置信下沿而不是点估计：中位数超过地板可能只是抽样噪声，而这个门的
  # 结论是"要不要重新定位整个项目"。
  rule: exists_rung_with_ci_lower_bound_above_floor
  confidence: 0.95
  bootstrap:
    method: percentile
    resamples: 2000
    unit: persona
    # 注意这**不是**硬规则 22 说的 block bootstrap。那一条针对的是
    # ŵ_i = γ_k/γ_0 这类比值估计量在整条流水线上的传播。这里是一个
    # 跨人设的普通中位数，重抽人设即可。

  # 不通过时的动作：停，报告，不要自行放宽 τ 或加大 cap_points。
  on_fail: stop_and_report

# ---------------------------------------------------------------------------
# 必须写进 runs/<run_id>/ 的产出
# ---------------------------------------------------------------------------
outputs:
  path: "runs/{run_id}/gate_one.json"
  required_fields:
    - noise_floor_usd                    # 规范口径：人设内均值，跨人设中位数
    - noise_floor_usd_median_within      # 原判据口径，一并报告（DECISIONS/0010）
    - flip_probability                   # P(扰动翻转 argmax)
    - conditional_loss_usd               # E[损失 | 翻转]；与 noise_floor 之积相等
    - perturbation_diagnostics           # E[ΔH_norm] 与 |E[δ]|，两个方案都报
    - per_rung:                          # 每一档一条
        - tau
        - n_personas_feasible            # 无解的被排除了多少（非随机缺失）
        - n_personas_money_metric_missing  # 货币度量落在语义区间外的（硬规则 27）
        - median_l_rep_usd
        - ci_lower_usd
        - ci_upper_usd
        - median_l_s_usd
        - median_l_amen_usd
        - feasible_fraction
        - counts_toward_verdict          # 可行比例低于 min_feasible_fraction 则为 false
        - passes
    - verdict                            # pass / fail
    - config_sha                         # 本文件的哈希，证明判据是事前的
