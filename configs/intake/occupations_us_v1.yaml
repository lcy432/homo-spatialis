# E3B（DECISIONS/0042）六城真实生活资料包的“职业与岗位”一侧：支持的职业范围、每个职业需要的能力、确认的经历怎样对应已有能力、
# 哪些培训项目授予哪些能力、岗位的工资档与工作安排、开局岗位规则。编译代码在 src/product/realdata/occupations.py，说明在
# docs/design/e3b-items-data.md。
#
# 资料：BLS OEWS 2024 年 5 月（都会区工资分位与就业，CPI 换到 2024 年平均，intake 已做）、BLS 就业预测表 5.4（入职教育、经验、
# 在职培训，全国口径）、intake 的工时表 job_hours_wfh_by_occupation_group@1（都会区 × SOC 大类的通常每周工时中位数与在家工作
# 比例）、IPEDS 2023 项目与 CIP 2020 → SOC 2018 对照。职业与行业分开：OEWS 都会区表是“全部行业”里这个职业的工资，岗位只按职业
# 记，不写行业，也不从行业推职业。

version: occupations-us-v1
intake_build_id: 35667f4101a71c0e5ea6c1aaa8e5f45cd83c825d6b1393bde1104d3d571a96b7
numeraire: USD_2024_LOCAL
scheme: SOC2018
#: 能力定义的来源日期：intake 获取 EP 表 5.4（education.xlsx）的日子（表本身没有在冻结库里记版本年份）
ep_observed_on: 2026-10-22

# 入职教育（EP 原文）→ 岗位要求的能力。学历按“至少达到”记：确认的最高学历授予它和它以下的各级（education_at_least_v1）。
# “中学后非学位证书”是职业专属的（soc_<职业>_award），只能由确认的证书或 CIP → SOC 对应的培训项目授予，不从职称或自由文字推。
education:
  - {ep: No formal educational credential, level: none}
  - {ep: High school diploma or equivalent, level: hs, ability: edu_at_least_hs, label: 高中毕业或同等学力}
  - {ep: "Some college, no degree", level: some_college, ability: edu_at_least_some_college, label: 读过大学（未取得学位）}
  - {ep: Postsecondary nondegree award, level: award, occupation_award: true}
  - {ep: "Associate's degree", level: associate, ability: edu_at_least_associate, label: 副学士学位}
  - {ep: "Bachelor's degree", level: bachelor, ability: edu_at_least_bachelor, label: 学士学位}
  - {ep: "Master's degree", level: master, ability: edu_at_least_master, label: 硕士学位}
  - {ep: Doctoral or professional degree, level: doctoral, ability: edu_at_least_doctoral, label: 博士或专业学位}

# EP 的“相关职业经验”→ 能力 soc_<职业>_experience；只能由确认的、在相关职业里的经历（年数够）授予（related_experience_v1）。
# E1 没有“在职积累经验”的机制：模拟期里干满几年不会自动得到它（契约缺口，见设计说明）。
experience:
  "Less than 5 years": {min_years: 1}
  "5 years or more": {min_years: 5}

# 工作安排（job_arrangement_v1）：每周工时来自通勤资料里同一批人员记录的（通常每周工时 × 就业片区）联合分布（E3B 映射修正，不再
# 压成中位数）；每月工时 = 每周 × 52 ÷ 12，四舍五入到 0.01；每周 5 个工作日，每月工作日 = 5 × 52 ÷ 12 四舍五入到整数（22）——低工时
# 表示每天工作短，不减少到岗天数；hybrid 的到岗日 = 工作日 × 3 ÷ 5 四舍五入；薪酬 = 年薪支持点 × 每周工时 ÷ 40（年薪是时薪 × 2,080），
# 四舍五入到分。年薪支持点见 job_wage_support_v1。
arrangement:
  days_per_week: 5
  hybrid_onsite_share: "3/5"
  burden_per_work_hour: 1.0

# 培训（ipeds_training_v1）：IPEDS 按项目报告学费的院校项目；CIP → SOC 对照到范围内需要“中学后非学位证书”的职业，就授予那个职业的
# award 能力。只收全日制完成月数是整年的项目（E1 的培训按整年计）；每周 24 小时（联邦对按学时计的全日制定义的下限，
# 34 CFR 668.2），每月 = 24 × 52 ÷ 12 = 104 小时；开课日期资料里没有（按“任何月份可以开始”设定，缺口）。
training:
  weekly_hours: 24
  burden_per_hour: 1.2
  whole_years_only: true

# 支持的职业（job_scope_v1）。work_mode 是设定（onsite / hybrid），依据写在设计说明；related 是可以算作“相关职业经验”的职业。
# 不在这里的职业一律拒绝并说明原因，不替换成别的职业。
