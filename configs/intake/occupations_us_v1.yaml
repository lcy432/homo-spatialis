# 不在范围里的常见职业与原因（举例；未列出的职业统一报“不在支持范围”）
excluded:
  31-9011: 按摩师在六城所在州都要州执照，执照资料没有结构化来源（按摩服务的价格仍用这个职业的工资）
  39-5012: 美发与美容师要州执照
  33-9032: 保安在六城所在州都要州执照或登记
  53-3033: 送货司机要驾照，驾照不是这里的能力
  31-9092: 医疗助理在华盛顿州要州认证
  31-9091: 牙科助理的州要求不一（加州要执照）
  49-9021: 暖通空调技工处理制冷剂要联邦 EPA 认证
  25-2011: 学前教师要州资格
  29-1141: 注册护士要州执照
  27-2042: OEWS 只有时薪、没有年薪分位，工资档与工时不能按同一规则换算
  25-9045: OEWS 只有学年年薪，没有时薪，工资与工时不能按同一规则换算

assumptions:
  - id: job_scope_v1
    nature: assumption
    statement_zh: 支持 40 个 SOC 职业（supported）；入选条件：六城 OEWS 都有 25 / 50 / 75 分位年薪、有时薪口径、EP 有入职要求、进入时不需要州执照
  - id: ep_typical_education_as_requirement_v1
    nature: assumption
    statement_zh: EP 的“典型入职教育”当作岗位的资格要求（全国口径）；“典型”不是法律要求，所以这是保守的设定
  - id: education_at_least_v1
    nature: rule
    statement_zh: 确认的最高学历授予它和它以下的各级“至少达到”能力；学位只从结构化的学历确认来，不从职称或自由文字推
  - id: related_experience_v1
    nature: assumption
    statement_zh: EP 写了“相关职业经验”的职业，相关职业按 supported.related 列出；“少于 5 年”按至少 1 年、“5 年以上”按至少 5 年
  - id: confirmed_experience_mapping_v1
    nature: rule
    statement_zh: 确认的现职 X 只说明“在 X 工作过”：授予 X 列为相关的职业的经验能力（年数够时），不授予学历、证书或执照；开局岗位仍要求用户确认 X 的入职能力
  - id: job_arrangement_v1
    nature: rule
    statement_zh: 每周工时取联合分布里这一点的工时；每月 = 每周 × 52 ÷ 12（0.01）；每周 5 天、每月 22 个工作日（低工时 = 每天工作短）；薪酬 = 年薪 × 每周工时 ÷ 40（分）
  - id: job_wage_support_v1
    nature: rule
    statement_zh: OEWS p10、p25、p50、p75、p90 之间分段线性的分位函数，在 p10–p90 里切 20 个等概率区间、取每个区间中点的年薪（每点概率 0.04）；两端共 20% 是未识别，不生成尾部；有分位没有发布时，落在那一段的区间也是未识别
  - id: job_wage_independent_of_hours_area_v1
    nature: assumption
    statement_zh: 给定职业后，工资与（每周工时 × 就业片区）条件独立：两者分别来自 OEWS 与 ACS PUMS，拼接是登记的假设，不是观测到的完整联合关系
    basis_zh: OEWS 不给工时与工作地点，PUMS 的 WAGP 是过去一年的收入（不是岗位工资）；两套资料没有共同的个人记录
  - id: job_work_mode_v1
    nature: assumption
    statement_zh: 每个职业的到岗方式（supported.work_mode）；hybrid 每 5 个工作日到岗 3 天
    basis_zh: 资料里没有单个岗位的到岗安排；量级核对用工时表里 SOC 大类的在家工作比例（13、15、23、27 大类在 0.2 以上，其余多在 0.2 以下），按职业的工作内容是否必须到场写定
  - id: job_burden_v1
    nature: assumption
    value: 每工时负担 1.0
    basis_zh: 与合成样例的文员相同；负担是 E1 的合成尺度
  - id: start_job_median_v2
    nature: rule
    statement_zh: 开局岗位 = 开局城市里用户确认职业的 OEWS 中位年薪；每周工时与就业片区取这一职业大类联合分布里权重最大的一点（只用于统一开局，不压缩候选池）；职业不在范围或本城没有工资资料就拒绝并说明原因，不替换
  - id: ipeds_training_v1
    nature: assumption
    statement_zh: IPEDS 项目经 CIP → SOC 对照授予范围内职业的 award 能力；只收整年项目；每周 24 小时（34 CFR 668.2 全日制下限）；开课月份不限
    basis_zh: IPEDS 不记开课日期与每周上课小时；“任何月份可以开始”是缺口
  - id: training_burden_v1
    nature: assumption
    value: 培训每小时负担 1.2
    basis_zh: 与合成样例的会计课相同
