# E3B（DECISIONS/0042）六城真实生活资料包的“物品与活动”一侧：完整食品方案、杂务服务、设备、享受型服务、爱好装备与活动。
# 编译代码在 src/product/realdata/life_items.py，说明在 docs/design/e3b-items-data.md。
#
# 数从哪来分三种，写在每一项旁边：
#   * 资料：intake-02 冻结库（构建身份见 intake_build_id）与原始文件缓存里的公开资料（BLS AP / CE / OEWS、BEA RPP、OSM、
#     ENERGY STAR、芝加哥公园管理局、USDA FoodData Central SR Legacy、BLS ATUS）；
#   * 规则：确定的换算（52 ÷ 12 周、OEWS 年薪 = 时薪 × 2,080、四舍五入到分）；
#   * 设定：下面 assumptions 里登记的探索设定（编号、性质、依据），在看任何 mock 结果之前写定；不是测量，不能据此排序真实城市。
# 语言模型不生成任何数：设定值是本配置作者写下、登记、可审阅的；代码只做确定的换算。

version: life-items-us-v1
intake_build_id: 35667f4101a71c0e5ea6c1aaa8e5f45cd83c825d6b1393bde1104d3d571a96b7
numeraire: USD_2024_LOCAL
mapping_version: e3b-life-items-v1
#: 纯设定类机会的来源日期（配置写定的日子）
assumptions_written_on: 2026-10-23
metros:
  - {cbsa: "35620", key: nyc, label: New York-Newark-Jersey City 都会区, city: 纽约}
  - {cbsa: "31080", key: la, label: Los Angeles-Long Beach-Anaheim 都会区, city: 洛杉矶}
  - {cbsa: "41860", key: sf, label: San Francisco-Oakland-Fremont 都会区, city: 旧金山}
  - {cbsa: "16980", key: chi, label: Chicago-Naperville-Elgin 都会区, city: 芝加哥}
  - {cbsa: "26420", key: hou, label: Houston-Pasadena-The Woodlands 都会区, city: 休斯敦}
  - {cbsa: "42660", key: sea, label: Seattle-Tacoma-Bellevue 都会区, city: 西雅图}

# 词表（建议并入资料包的生活输入；现有合成样例的键都保留）
vocabulary:
  cuisines: [home_style, chinese, italian, mexican, japanese, indian, thai, korean, vietnamese, mediterranean]
  leisure_categories: [music, racket_sports, arts_culture, culinary, fitness]
  capabilities: [guitar_playable, racket_playable]
  enjoyment_functions: [personal_consumption]
  household_tasks: [laundry, cleaning]
  # 日常支持的三个功能（E3B 映射修正 §5）：只在付费成功、实际获得的月份提供
  functions: [personal_communication, home_connectivity, household_supplies]

# ============================================================================ A 板块的共同结构（E3B 映射修正 §4）
# 每个板块：方案族与合法组合、参数（含义、单位、支持范围、共同先验与来源）、允许按城市证据更新的参数、真实差异与估计不确定性的
# 区分、模型支持状态。每城的证据、零售修正结果与编译状态由 src/product/realdata/a_blocks.py 补上，冻结在每城的 a_blocks 里。
# 零售价修正（retail_correction_lognormal_v1）：δ = log(实际价 ÷ 基础预测价) ~ N(0, log(1.5)²)，只用同规格直接报价按供应商去重后
# 更新；现在六城都没有合格的同规格直接报价，执行价都是基础预测（标为估计，不叫本地观测价）。
a_blocks:
  - block: food
    label_zh: 食品（完整每周 21 餐方案）
    domains: [food]
    legal_combinations_zh: 三个篮子 × 家里做的餐数 {0, 3, 7, 14, 21} × 其余餐的方式 {全部堂食, 全部外送, 各半} × 外面部分一个主菜系（9 选 1）；家里做 21 顿时没有外面部分，方式与菜系退化成一个方案
    parameters:
      - {id: basket_quantities, meaning_zh: 三个篮子每周的食材数量, unit: 计价单位/周, support: 正数, prior: {kind: point}, source: food_basket_quantities_v1, city_updatable: false}
      - {id: basket_item_prices, meaning_zh: 篮子里每种食材的都会区估计价（基础成本预测）, unit: USD_2024_LOCAL/计价单位, support: 正数, prior: {kind: city_evidence}, source: rpp_goods_spatial_adjustment@1（BLS AP 区域均价 × RPP 商品类）, city_updatable: true}
      - {id: energy_reference, meaning_zh: 每人每天的参照热量（补齐用）, unit: 千卡/天, support: "2000", prior: {kind: point, value: 2000}, source: food_energy_reference_v1, city_updatable: false}
      - {id: fresh_meals_per_basket, meaning_zh: 每个篮子 21 餐里的新鲜餐数, unit: 餐/周, support: "0–21", prior: {kind: point, value: {staples: 4, varied: 10, fresh: 17}}, source: food_plan_composition_v1, city_updatable: false}
      - {id: minutes_per_meal, meaning_zh: 自己做一顿的做饭与收拾时间, unit: 分钟, support: 正数, prior: {kind: point, value: {staples: 20, varied: 25, fresh: 30}}, source: food_plan_composition_v1, city_updatable: false}
      - {id: home_meals_grid, meaning_zh: 家里做的餐数（共同覆盖网格，不是居民比例）, unit: 餐/周, support: "{0, 3, 7, 14, 21}", prior: {kind: grid}, source: food_home_share_by_meals_v1, city_updatable: false}
      - {id: kitchen_hours_per_meal, meaning_zh: 外食每顿的厨房人工, unit: 小时, support: "0.25", prior: {kind: point, value: 0.25}, source: food_away_cost_proxy_v1, city_updatable: false}
      - {id: venue_other_per_meal, meaning_zh: 外食每顿的场地及其他成本（全国基准，× 其他服务 RPP）, unit: USD_2024/顿, support: "2", prior: {kind: point, value: 2}, source: food_away_cost_proxy_v1, city_updatable: false}
      - {id: delivery_hours_per_meal, meaning_zh: 外送每顿的配送人工, unit: 小时, support: "0.2", prior: {kind: point, value: 0.2}, source: food_away_cost_proxy_v1, city_updatable: false}
      - {id: cook_and_driver_wages, meaning_zh: 厨师（35-2014）与配送司机（53-3033）的都会区中位时薪, unit: USD_2024_LOCAL/小时, support: 正数, prior: {kind: city_evidence}, source: OEWS 2024 年 5 月, city_updatable: true}
      - {id: rpp_other_services, meaning_zh: 其他服务 RPP（场地及其他成本的空间换算）, unit: 指数（全国 = 100）, support: 正数, prior: {kind: city_evidence}, source: BEA RPP 2023, city_updatable: true}
      - {id: dining_hours, meaning_zh: 堂食每顿（含往返）与外送每顿（下单与收取）的时间, unit: 小时, support: "1.25 / 0.25", prior: {kind: point}, source: dining_hours_v1, city_updatable: false}
      - {id: retail_correction, meaning_zh: 同规格零售价相对基础预测的对数比值 δ, unit: 对数比值, support: 实数, prior: {kind: normal, mean: 0, sd: log(1.5)}, source: retail_correction_lognormal_v1, city_updatable: true}
    families:
      - {family: food_plan_week21, label_zh: 完整每周 21 餐方案, id_prefixes: [food.],
         why_no_quotes_zh: 没有同规格（同样篮子、同样餐数与方式、同样税费口径）的本地直接报价；CE 的在外饮食支出只做量级对照}
    variation_vs_uncertainty_zh: 方案之间的差异（篮子、家里餐数、外面的方式与菜系）是方案空间的真实差异；食材价、工资与 RPP 是城市证据；零售修正 δ 与各项设定的不确定性不生成额外方案
    model_support_zh: 食品方案覆盖整月基本饮食（按热量补齐，不是营养方案）；饮食生活评分只读新鲜餐与菜系匹配

  - block: services
    label_zh: 人工杂务服务
    domains: [service]
    legal_combinations_zh: 每项服务按月购买，可以同时买几项；同一家务的减负取现有有效残余时间规则，不叠加
    parameters:
      - {id: worker_and_client_hours, meaning_zh: 每项服务的工人小时、本人小时与替代后的残余家务小时, unit: 小时/月, support: 非负, prior: {kind: point}, source: service_hours_v1, city_updatable: false}
      - {id: service_wages, meaning_zh: 对应职业的都会区中位时薪（基础成本预测）, unit: USD_2024_LOCAL/小时, support: 正数, prior: {kind: city_evidence}, source: OEWS 2024 年 5 月（oews_hourly_from_annual_v1）, city_updatable: true}
      - {id: labor_overhead, meaning_zh: 服务价格 = 工人工资 × 倍率, unit: 倍, support: "2.0", prior: {kind: point, value: 2.0}, source: labor_overhead_v1, city_updatable: false}
      - {id: retail_correction, meaning_zh: 同规格零售价相对基础预测的对数比值 δ, unit: 对数比值, support: 实数, prior: {kind: normal, mean: 0, sd: log(1.5)}, source: retail_correction_lognormal_v1, city_updatable: true}
    families:
      - {family: chore_service_month, label_zh: 上门洗衣与保洁（按月）, id_prefixes: [service.laundry, service.cleaning],
         why_no_quotes_zh: 没有同规格（同样频次与工时）的本地直接报价}
    variation_vs_uncertainty_zh: 服务之间的差异是频次与工时；工资是城市证据；效果（替代后的残余小时）是共同设定，不随工资或报价改变
    model_support_zh: 只在付了钱的月份起作用；家务减负读资源账里的残余小时

  - block: daily_support
    label_zh: 日常支持（通信、居家联网、家用日耗品）
    domains: [daily_support]
    legal_combinations_zh: 三个支持功能各一个按月服务，可以同时买；同功能买两份不叠加；更贵更快的套餐不另加分；未买或买不起时这项功能是 0，不触发出局、患病或工资损失
    parameters:
      - {id: mobile_budget_proxy, meaning_zh: 手机通信月费（CE 2024 一人消费单位手机服务年均 ÷ 12）, unit: USD_2024/月, support: 正数, prior: {kind: point}, source: ce_one_person_budget_proxy_v1, city_updatable: false}
      - {id: broadband_regional_reference, meaning_zh: 家庭宽带基本档月费（FCC URS 2024 同规格报价的大区加权中位数 × CPI 互联网服务）, unit: USD_2024/月, support: 正数, prior: {kind: city_evidence}, source: fcc_broadband_basic_tier_v1, city_updatable: true}
      - {id: supplies_budget, meaning_zh: 家用日耗品的共同篮子尺度（CE 2024 一人消费单位 ÷ 12）, unit: USD_2024/月, support: 正数, prior: {kind: point}, source: household_supplies_ce_v1, city_updatable: false}
      - {id: rpp_goods, meaning_zh: 商品类 RPP（日耗品的城市成本）, unit: 指数（全国 = 100）, support: 正数, prior: {kind: city_evidence}, source: BEA RPP 2023, city_updatable: true}
      - {id: retail_correction, meaning_zh: 同规格零售价相对基础预测的对数比值 δ, unit: 对数比值, support: 实数, prior: {kind: normal, mean: 0, sd: log(1.5)}, source: retail_correction_lognormal_v1, city_updatable: true}
    families:
      - {family: daily_support_service_month, label_zh: 通信、宽带与日耗品（按月）, id_prefixes: [service.mobile, service.home_internet, service.household_supplies],
         why_no_quotes_zh: 没有同规格的单人套餐、本地宽带或日耗品直接报价；预算代理与大区参照不是本地观测价}
    variation_vs_uncertainty_zh: 三项是不同功能，不是同一功能的档位；城市差异只来自 FCC 大区与商品类 RPP；手机按共同预算代理各城相同；ACS 接入率只作描述，不当运营商可得率
    model_support_zh: 只在付费成功、实际获得的月份提供功能；不制造节省小时、活动小时或健康效果；基本终端按共同使用条件（basic_device_access_v1）

  - block: consumption_basket
    label_zh: 抽象个人消费篮子
    domains: [consumption]
    legal_combinations_zh: 每月最多按档位买（u = 0.25、0.5、1、1.5、2、3、4 个标准篮子）；0 是不买；同时买两个档位时份数相加（消费服务流）
    parameters:
      - {id: reference_vector, meaning_zh: 共同参考支出向量 e_j（CE 2024 一人消费单位白名单条目月均）, unit: USD_2024/月, support: 非负, prior: {kind: point}, source: consumption_basket_ce_v1, city_updatable: false}
      - {id: price_factors, meaning_zh: 商品类 RPP（商品）与其他服务 RPP（服务）, unit: 指数（全国 = 100）, support: 正数, prior: {kind: city_evidence}, source: BEA RPP 2023, city_updatable: true}
      - {id: quantity_grid, meaning_zh: 档位 u（共同覆盖网格，不是居民购买比例）, unit: 标准篮子/月, support: "{0.25, 0.5, 1, 1.5, 2, 3, 4}", prior: {kind: grid}, source: consumption_basket_ce_v1, city_updatable: false}
      - {id: retail_correction, meaning_zh: 同规格零售价相对基础预测的对数比值 δ, unit: 对数比值, support: 实数, prior: {kind: normal, mean: 0, sd: log(1.5)}, source: retail_correction_lognormal_v1, city_updatable: true}
    families:
      - {family: personal_consumption_basket, label_zh: 个人消费篮子（按月）, id_prefixes: [service.personal_basket],
         why_no_quotes_zh: 篮子是固定构成的成本模型，没有同规格的直接报价}
    variation_vs_uncertainty_zh: 档位之间只有数量不同；城市差异只来自价格系数；同样数量只改价格时直接享受分不变
    model_support_zh: 评分读实际获得的标准篮子数量，不读付款金额；不加休闲参与小时、不得兴趣匹配、不留资产或装备能力

  - block: devices
    label_zh: 家务设备（洗衣机、烘干机）
    domains: [device]
    legal_combinations_zh: 每个设备方案一次买下、在寿命内按月提供减负；同一家务的减负不叠加
    parameters:
      - {id: national_category_price, meaning_zh: 设备类别的全国价格, unit: USD_2024, support: 正数, prior: {kind: point}, source: device_category_v1, city_updatable: false}
      - {id: goods_spatial_factor, meaning_zh: 商品类空间换算系数（intake）, unit: 倍, support: 正数, prior: {kind: city_evidence}, source: rpp_goods_spatial_adjustment@1, city_updatable: true}
      - {id: lifetime_and_residual, meaning_zh: 寿命（年）与替代后的残余家务小时, unit: 年 / 小时每月, support: 正数, prior: {kind: point}, source: device_category_v1, city_updatable: false}
      - {id: failure, meaning_zh: 模拟期内的随机故障, unit: 年故障概率, support: none_within_horizon, prior: {kind: point}, source: device_failure_v1, city_updatable: false}
      - {id: retail_correction, meaning_zh: 同规格零售价相对基础预测的对数比值 δ, unit: 对数比值, support: 实数, prior: {kind: normal, mean: 0, sd: log(1.5)}, source: retail_correction_lognormal_v1, city_updatable: true}
    families:
      - {family: laundry_device, label_zh: 洗衣与烘干设备, id_prefixes: [durable.washer, durable.pair, durable.combo],
         why_no_quotes_zh: ENERGY STAR 只有认证事实不记价格；没有同型号的本地零售报价}
    variation_vs_uncertainty_zh: 方案之间的差异是设备组合；价格是全国类别设定 × 城市商品系数；寿命与效果是共同设定
    model_support_zh: 安装条件按假设可以安装（住房资料没有接口与排风条件，缺口）

  - block: equipment
    label_zh: 爱好装备
    domains: [equipment]
    legal_combinations_zh: 一次买下、在寿命内提供装备能力；装备本身不带来享受或休闲分
    parameters:
      - {id: national_category_price, meaning_zh: 装备类别的全国价格, unit: USD_2024, support: 正数, prior: {kind: point}, source: equipment_category_v1, city_updatable: false}
      - {id: goods_spatial_factor, meaning_zh: 商品类空间换算系数（intake）, unit: 倍, support: 正数, prior: {kind: city_evidence}, source: rpp_goods_spatial_adjustment@1, city_updatable: true}
      - {id: retail_correction, meaning_zh: 同规格零售价相对基础预测的对数比值 δ, unit: 对数比值, support: 实数, prior: {kind: normal, mean: 0, sd: log(1.5)}, source: retail_correction_lognormal_v1, city_updatable: true}
    families:
      - {family: hobby_equipment, label_zh: 球拍与吉他, id_prefixes: [durable.tennis, durable.acoustic],
         why_no_quotes_zh: 没有同规格的本地直接报价}
    variation_vs_uncertainty_zh: 价格是全国类别设定 × 城市商品系数；寿命是共同设定
    model_support_zh: 装备能力只在持有期内有效；寿命内不建模随机损坏

  - block: activities
    label_zh: 爱好活动（五个支持类别）
    domains: [activity]
    legal_combinations_zh: 每个活动方案按次参加，时长用方案规定的时长；有要求的装备能力才能参加；芝加哥公园管理局的整期课程保留日期、年龄与报名限制，现在需要 E1 扩展
    parameters:
      - {id: template_settings, meaning_zh: 老师小时、人数、场地费率与器材材料设定, unit: 小时 / 人 / USD_2024, support: 正数, prior: {kind: point}, source: activity_template_v1, city_updatable: false}
      - {id: instructor_wages, meaning_zh: 老师对应职业的都会区中位时薪, unit: USD_2024_LOCAL/小时, support: 正数, prior: {kind: city_evidence}, source: OEWS 2024 年 5 月, city_updatable: true}
      - {id: rpp_all_and_goods, meaning_zh: RPP 总水平（场地）与商品类换算系数（器材）, unit: 指数 / 倍, support: 正数, prior: {kind: city_evidence}, source: BEA RPP 2023、rpp_goods_spatial_adjustment@1, city_updatable: true}
      - {id: venue_presence, meaning_zh: 本城 OSM 里看得到相应场所才提供模型活动, unit: 处, support: 非负整数, prior: {kind: city_evidence}, source: OSM（主城市边界内）, city_updatable: true}
      - {id: retail_correction, meaning_zh: 同规格零售价相对基础预测的对数比值 δ, unit: 对数比值, support: 实数, prior: {kind: normal, mean: 0, sd: log(1.5)}, source: retail_correction_lognormal_v1, city_updatable: true}
    families:
      - {family: model_activity_session, label_zh: 模型活动（按次）, id_prefixes: [experience.], exclude_prefixes: [experience.cpd.],
         why_no_quotes_zh: 芝加哥公园管理局的真实价格是整期报名（规格不同），不与按次的模型方案合并；其他城市没有同规格的本地直接报价}
      - {family: cpd_program_session, label_zh: 芝加哥公园管理局整期课程（真实报价）, id_prefixes: [experience.cpd.], direct_quotes: true,
         why_no_quotes_zh: 价格本身就是直接报价；日期窗口、整期报名与年龄资格要 E1 扩展后才能执行}
    variation_vs_uncertainty_zh: 方案之间的差异是类别、时长与是否付费；高价授课不自动得到更多休闲分（评分只读参与小时与兴趣匹配）
    model_support_zh: 只有完成的参与按小时计休闲分；免费方案支配付费方案时如实报告（activity_dominance），不为付费方案新增奖励

# ============================================================================ 食品
food:
  # 篮子数量直接读 intake 的配置（configs/intake/us_v1.yaml 的 mapping.a_food.baskets，假设 food_basket_quantities_v1），
  # 价格读冻结库里本都会区的食材估计价（food.item.<cbsa>.<代码>，rpp_goods_spatial_adjustment@1）。
  intake_config: configs/intake/us_v1.yaml
  # 按热量补齐成完整的一周（规则 food_energy_completion_v1）：篮子自己的热量不够每周参照量时，差额用 complement 篮子按
  # “每千卡的花费”补上；篮子本身已经够就不补、不缩。热量 = 购买重量 × SR Legacy 每 100 克能量（不扣不可食部分，见 bias）。
  energy_reference_kcal_per_day: 2000
  complement_basket: staples_home
  # BLS AP 食材 → USDA FoodData Central SR Legacy（2018-04）条目。克数：单位原文写了克就用原文；“per doz.” 用 SR 的
  # “1 large” 克重 × 12；“per gal.” 用 SR 的 “1 quart” 克重 × 4（1 加仑 = 4 夸脱）。咖啡不计热量（冲泡饮品，不是食物热量）。
  item_energy:
    "701312": {fdc_id: "168877", note: 长粒白米（生、强化）}
    "701322": {fdc_id: "169736", note: 干意面（强化）}
    "702111": {fdc_id: "174924", note: 白面包}
    "706111": {fdc_id: "171047", note: 整鸡（肉、皮与内脏，生）}
    "708111": {fdc_id: "171287", per_unit: {portion: large, count: 12}, note: 大号鸡蛋一打}
    "709112": {fdc_id: "171265", per_unit: {portion: quart, count: 4}, note: 全脂牛奶一加仑}
    "711211": {fdc_id: "173944", note: 香蕉}
    "712112": {fdc_id: "170026", note: 土豆（连皮）}
    "712311": {fdc_id: "170457", note: 番茄}
    "714233": {fdc_id: "175199", note: 干豆（以斑豆为代表）}
    "703112": {fdc_id: "174036", note: 牛肉末（80/20，生）}
    FF1101: {fdc_id: "171077", note: 去骨去皮鸡胸（生）}
    "704212": {fdc_id: "168286", note: 去骨猪排（生）}
    FJ1101: {fdc_id: "171267", per_unit: {portion: quart, count: 4}, note: 低脂牛奶一加仑（以 2% 为代表）}
    "710212": {fdc_id: "173414", note: 切达奶酪}
    FJ4101: {fdc_id: "171284", note: 酸奶（原味全脂为代表）}
    "711311": {fdc_id: "169917", note: 脐橙}
    FL2101: {fdc_id: "169247", note: 罗马生菜}
    "717311": {zero_energy: true, note: 研磨咖啡：冲泡饮品，不计食物热量}
    "703613": {fdc_id: "168728", note: 西冷牛排（choice，生）}
    "711415": {fdc_id: "167762", note: 草莓}
  burden_per_hour: 0.5
  shopping_hours_per_week: 2
  # 完整每周 21 餐的方案族（E3B 映射修正）：三个篮子各自的新鲜餐数与每餐做饭分钟沿用共同设定（food_plan_composition_v1）。
  # 家里做的餐数取共同网格 home_meals_grid；其余餐（21 − 家里做）按 away_modes 之一：全部堂食、全部外送、两者各半；外面部分
  # 只用一个明确主菜系（cuisine_order 里的一个），家里部分是家常。家里做 21 顿时没有外面部分，三种方式与菜系退化成同一个方案，
  # 只留一个。新鲜餐按组成比例（food_fresh_by_basket_share_v1）：每个组成的新鲜餐 = 餐数 × 篮子新鲜餐数 ÷ 21，外食不自动算新鲜。
  plan_baskets:
    - {key: staples, basket: staples_home, fresh_meals_per_week: 4, minutes_per_meal: 20,
       label: 主食为主, quality: 米面、整鸡、鸡蛋、土豆为主，按热量补齐到一个人一周的量}
    - {key: varied, basket: varied_home, fresh_meals_per_week: 10, minutes_per_meal: 25,
       label: 荤素搭配, quality: 牛肉、鸡胸、奶酪、酸奶与蔬果搭配，不够的热量用主食补齐}
    - {key: fresh, basket: fresh_protein_home, fresh_meals_per_week: 17, minutes_per_meal: 30,
       label: 鲜肉蔬果较多, quality: 鸡胸、牛排、草莓、生菜较多，不够的热量用主食补齐}
  home_meals_grid: [0, 3, 7, 14, 21]
  away_modes: [dine_out, delivery, half]
  # 外食统一成本代理（food_away_cost_proxy_v1，共同探索假设，不是已验证的零售价）：每顿 = 篮子补齐后每周花费 ÷ 21
  # + 厨房 0.25 小时 × 厨师中位时薪 × 人工费用倍率 + 场地及其他 2 美元（全国基准）× 其他服务 RPP ÷ 100；外送每顿再加
  # 0.2 小时 × 配送司机中位时薪 × 人工费用倍率。销售税、平台费与小费没有单列：不另加，记在机会属性 taxes_fees_tips 里。
  away_cost:
    cook_soc: 35-2014
    delivery_soc: 53-3033
    kitchen_hours_per_meal: 0.25
    venue_other_per_meal_usd: 2
    delivery_hours_per_meal: 0.2
  dining:
    dine_out_hours_per_meal: 1.25
    delivery_hours_per_meal: 0.25
    # 完整菜系词表（产品资料包的外食菜系）每个都提供；本城 OSM amenity=restaurant 里写了这个菜系标签的不到 min_restaurants
    # 家，只说明缺少供应证据：照样提供，按共同可得假设（food_cuisine_common_availability_v1）标明，不冒充某家餐馆的报价。
    min_restaurants: 20
    cuisine_order: [chinese, italian, mexican, japanese, indian, thai, korean, vietnamese, mediterranean]
    osm_cuisine_tags:
      chinese: [chinese]
      italian: [italian]
      mexican: [mexican, tex-mex]
      japanese: [japanese, sushi, ramen]
      indian: [indian]
      thai: [thai]
      korean: [korean]
      vietnamese: [vietnamese]
      mediterranean: [mediterranean, greek, middle_eastern]
    cuisine_labels:
      chinese: 中餐
      italian: 意式
      mexican: 墨西哥菜
      japanese: 日料
      indian: 印度菜
      thai: 泰国菜
      korean: 韩国菜
      vietnamese: 越南菜
      mediterranean: 地中海菜
      home_style: 家常

# ============================================================================ 人工服务与享受
services:
  # OEWS 年薪 ÷ 2,080 = 时薪（BLS OEWS 的换算约定）；都会区中位数；价格 = 时薪 × 工人小时 × 人工费用倍率（labor_overhead_v1）
  hours_per_year: 2080
  labor_overhead_multiplier: 2.0
  chores:
    - {service: laundry_pickup, soc: 51-6011, worker_hours_per_month: 3, client_hours_per_month: 0,
       substitutes: {laundry: 2}, label: 洗衣取送（每周一次）,
       quality: 每周上门取送，洗、烘、叠由洗衣店完成；本人每月还要约 2 小时分拣、交接与收纳}
    - {service: cleaning_biweekly, soc: 37-2012, worker_hours_per_month: 6, client_hours_per_month: 0,
       substitutes: {cleaning: 4}, label: 上门保洁（每两周一次）,
       quality: 每两周上门打扫约 3 小时；两次之间本人每月还要约 4 小时日常整理}
    - {service: cleaning_weekly, soc: 37-2012, worker_hours_per_month: 10, client_hours_per_month: 0,
       substitutes: {cleaning: 2}, label: 上门保洁（每周一次）,
       quality: 每周上门打扫约 2.5 小时；本人每月还要约 2 小时日常整理}

# ============================================================================ 日常支持（E3B 映射修正 §5）
# 三个支持功能各一个按月服务：只在付费成功、实际获得的月份提供（未知不当已获得）；同功能买两份不叠加；更贵、更快的套餐不另加分。
# 费用顺序：同规格直接报价 → FCC 同规格大区参照（家庭宽带）→ FCC 全国参照 → CE 预算代理；预算代理不是观测单价，字段与文案保持区别。
# 基本终端（手机、电脑）是所有分身一致的使用条件（basic_device_access_v1），不买、不计财富、不计享受、不进期末资产。
daily_support:
  ce_size_column_all: 1
  ce_size_column_one_person: 2
  ce_detail_column_all: 1
  personal_communication:
    function: personal_communication
    service: mobile_basic
    label: 手机通信（基本单人套餐）
    quality: 个人联系与基本移动通信；月费是 CE 2024 一人消费单位的手机服务月均支出（共同预算代理，不是某家运营商的套餐报价，各城相同）
    line: {key: cellular, size_label: Cellular phone service}
  home_connectivity:
    function: home_connectivity
    service: home_internet_basic
    label: 家庭宽带（基本档）
    quality: 居家互联网接入：下行 100–199 Mbps、上行至少 20 Mbps、不限流量；月费是 FCC 2024 城市费率调查同规格报价的大区加权中位数，换到 2024 年（不含税）
    # 同规格（fcc_broadband_basic_tier_v1）：FCC 2024 宽带定义 100/20 Mbps 那一档的报价（下行 100–199），不是所有达到 100/20 的套餐
    fcc_spec: {download_min_mbps: 100, download_below_mbps: 200, upload_min_mbps: 20, usage: unlimited}
    min_offers: 30
    cpi_series: CUUR0000SEEE03
    cpi_from_year: 2023
    cpi_to_year: 2024
    regions:
      Northeast: [CONNECTICUT, MAINE, MASSACHUSETTS, NEW HAMPSHIRE, RHODE ISLAND, VERMONT, NEW JERSEY, NEW YORK, PENNSYLVANIA]
      Midwest: [ILLINOIS, INDIANA, MICHIGAN, OHIO, WISCONSIN, IOWA, KANSAS, MINNESOTA, MISSOURI, NEBRASKA, NORTH DAKOTA, SOUTH DAKOTA]
      South: [DELAWARE, DISTRICT OF COLUMBIA, FLORIDA, GEORGIA, MARYLAND, NORTH CAROLINA, SOUTH CAROLINA, VIRGINIA, WEST VIRGINIA,
              ALABAMA, KENTUCKY, MISSISSIPPI, TENNESSEE, ARKANSAS, LOUISIANA, OKLAHOMA, TEXAS]
      West: [ARIZONA, COLORADO, IDAHO, MONTANA, NEVADA, NEW MEXICO, UTAH, WYOMING, ALASKA, CALIFORNIA, HAWAII, OREGON, WASHINGTON]
    metro_region: {"35620": Northeast, "31080": West, "41860": West, "16980": Midwest, "26420": South, "42660": West}
    # FCC 资料无法取得时才用：一人表没有互联网细项，按全国详细表的子项占比拆分一人“其他家庭开支”（分配估计）
    ce_fallback_line: {key: internet, size_label: Other household expenses, detail_parent: Other household expenses,
                       detail_items: ["Computer information services (internet) [I]"]}
  household_supplies:
    function: household_supplies
    service: household_supplies_basic
    label: 家用日耗品（清洁用品与纸品）
    quality: 洗衣清洁用品、纸巾卫生纸等家用日耗品；不含个人化妆护理、家电家具；月费是 CE 2024 一人消费单位相应支出的月均 × 本城商品类 RPP（估计）
    lines:
      - {key: laundry_cleaning, size_label: Laundry and cleaning products}
      - {key: paper_and_misc, size_label: Other household products, detail_parent: "Other household products [D]",
         detail_items: ["Paper towels, napkins, and toilet tissue [D]", "Miscellaneous household products [D]"]}
    exclusions:
      - {label: "Lawn and garden supplies [D]", reason_zh: 草坪园艺用品不是租住单人的日常家用耗品}
      - {label: Postage and stationery, reason_zh: 邮资与文具不是清洁用品与纸品类日耗品}

# ============================================================================ 抽象个人消费篮子（E3B 映射修正 §6）
# 用户含义：在其他生活开支之外，获得衣着、个人护理等个人消费的满足。消费服务流的抽象，不是买资产，也不按收入比例花钱。
# 共同参考支出向量 e_j = CE 2024 一人消费单位白名单条目的月均（一人表缺细分类时按全国详细表的子项占比拆分，标为分配估计）；
# 城市标准篮子价格 P_c = Σ e_j × 对应价格系数（商品 → 商品类 RPP，服务 → 其他服务 RPP）。所有城市与用户共用同一个 e_j。
# 档位 u 是共同覆盖网格（不是居民购买比例，也不按收入定）；0 = 不买，不生成机会；费用 u × P_c，四舍五入到分。
consumption_basket:
  function: personal_consumption
  service: personal_basket
  grid: ["0.25", "0.5", "1", "1.5", "2", "3", "4"]
  label: 个人消费篮子
  quality: 成人衣着、鞋履与个人配饰，非医疗的个人护理产品与服务；1 个标准篮子 = CE 2024 一人消费单位这些支出的月均构成，按本城价格系数估计（不是某家店的报价）
  lines:
    - {key: apparel_men, size_label: "Men, 16 and over", price_index: goods}
    - {key: apparel_women, size_label: "Women, 16 and over", price_index: goods}
    - {key: footwear_adult, size_label: Footwear, detail_parent: "Footwear [D]",
       detail_items: ["Men's footwear [D]", "Women's footwear [D]"], price_index: goods}
    - {key: accessories, size_label: Other apparel products and services, detail_parent: Other apparel products and services,
       detail_items: ["Jewelry [I]", "Watches [I]"], price_index: goods}
    - {key: apparel_services, size_label: Other apparel products and services, detail_parent: Other apparel products and services,
       detail_items: ["Shoe repair and other shoe services [I]", "Alteration, repair, and tailoring of apparel and accessories [I]",
                      "Clothing rental [I]", "Watch and jewelry repair [I]", "Clothing storage [I]"], price_index: other}
    - {key: personal_care_products, size_label: Personal care products and services, detail_parent: Personal care products and services,
       detail_items: [Personal care products], price_index: goods}
    - {key: personal_care_services, size_label: Personal care products and services, detail_parent: Personal care products and services,
       detail_items: [Personal care services], price_index: other}
  # 排除表：白名单所在大类里拿掉的叶子，与整类不进篮子的范围（与其他板块不交叉收费）
  exclusions:
    - {label: "Boys, 2 to 15", reason_zh: 不是成人衣着}
    - {label: "Girls, 2 to 15", reason_zh: 不是成人衣着}
    - {label: Children under 2, reason_zh: 不是成人衣着}
    - {label: "Boys' footwear [D]", reason_zh: 不是成人鞋履}
    - {label: "Girls' footwear [D]", reason_zh: 不是成人鞋履}
    - {label: "Coin-operated apparel laundry and dry cleaning [I]", reason_zh: 洗衣与干洗属于家务服务，按规定排除}
    - {label: "Apparel laundry and dry cleaning not coin-operated [I]", reason_zh: 洗衣与干洗属于家务服务，按规定排除}
    - {label: "Material and supplies for sewing, needlework, and quilting (includes household items) [D]", reason_zh: 缝纫、刺绣与拼布材料属于爱好活动材料，并含家用品}
  excluded_categories_zh:
    - 房租、水电燃气、食品（住房与食品板块）
    - 通信网络与家用清洁日耗品（日常支持）
    - 洗衣、打扫与家务设备（日常便利）
    - 交通、医疗、培训
    - 爱好课程、门票、活动材料与装备（不用 CE 整个 Entertainment 大类）
    - 储蓄、赠与、赌博、税费

# ============================================================================ 设备（ENERGY STAR 型号 + 类别设定）
devices:
  # 型号只用适用市场确定包括美国的（us、us_ca）；每个（类别 × 类型）取年耗电中位的型号作代表（并列取型号标识最小的）。
  # 价格是全国类别设定 × intake 的商品类空间换算系数；寿命、效果与故障都是类别设定（device_category_v1）。
  markets: [us, us_ca]
  offers:
    - {offer: washer_top, parts: [{category: clothes_washer, type: Top Load}], price_usd_2024_national: 700,
       lifetime_years: 10, substitutes: {laundry: 7}, label: 顶开洗衣机,
       quality: 自己洗，不用去洗衣店；还要晾干、叠放与收纳（每月约 7 小时）}
    - {offer: washer_front, parts: [{category: clothes_washer, type: Front Load}], price_usd_2024_national: 1000,
       lifetime_years: 10, substitutes: {laundry: 7}, label: 前开洗衣机,
       quality: 自己洗，不用去洗衣店；还要晾干、叠放与收纳（每月约 7 小时）}
    - {offer: pair_top_dryer, parts: [{category: clothes_washer, type: Top Load}, {category: clothes_dryer, type: Electric}],
       price_usd_2024_national: 1400, lifetime_years: 10, substitutes: {laundry: 4}, label: 顶开洗衣机 + 电烘干机一套,
       quality: 洗与烘都在家里；本人每月还要约 4 小时分拣、叠放与收纳}
    - {offer: pair_front_dryer, parts: [{category: clothes_washer, type: Front Load}, {category: clothes_dryer, type: Electric}],
       price_usd_2024_national: 1700, lifetime_years: 10, substitutes: {laundry: 4}, label: 前开洗衣机 + 电烘干机一套,
       quality: 洗与烘都在家里；本人每月还要约 4 小时分拣、叠放与收纳}
    - {offer: combo, parts: [{category: combo_washer_dryer, type: Front Load}], price_usd_2024_national: 1600,
       lifetime_years: 10, substitutes: {laundry: 4}, label: 洗烘一体机,
       quality: 一台机器洗完直接烘干；本人每月还要约 4 小时分拣、叠放与收纳}
  # 每个类别的故障设定，生成机会的 failure（FailureSpec）；成套设备按部件合成。保修不是故障分布。
  failure:
    clothes_washer: {rule: none_within_horizon, annual_hazard: null,
                     basis: 没有公开的型号或类别故障率资料（ENERGY STAR 只有认证事实，保修条款不是故障分布）；设定寿命 10 年，3 年模拟期内不建模随机故障}
    clothes_dryer: {rule: none_within_horizon, annual_hazard: null,
                    basis: 同洗衣机：没有公开故障率资料，设定寿命 10 年，3 年模拟期内不建模随机故障}
    combo_washer_dryer: {rule: none_within_horizon, annual_hazard: null,
                         basis: 同洗衣机：没有公开故障率资料，设定寿命 10 年，3 年模拟期内不建模随机故障}
    dishwasher: {rule: none_within_horizon, annual_hazard: null,
                 basis: 洗碗机本轮不进目录（见 gaps）；同样没有公开故障率资料}
  # 不进目录的类别与原因（报告为缺口，不删记录）
  not_offered:
    dishwasher: 洗碗的时间在食品方案的“买菜、做饭与收拾”小时里，协议没有可以替代的“洗碗”家务，洗碗机的效果在 E1 里表达不了
    gas_dryer: 燃气烘干机要燃气接口，住房资料没有这项条件；本轮只用电烘干机
  installation_note: 住房资料（ACS）没有洗衣机接口与烘干机排风的条件；设备按“可以安装”设定（device_installable_v1），这是缺口

