  burden_per_hour: 1.0
  # 场所证据：本城 OSM 记录（主城市边界内）里至少有 min_count 处
  venue_rules:
    fitness_centre: {venue_types: [fitness_centre], named_only: true, min_count: 1}
    yoga: {sports: [yoga], min_count: 1}
    tennis: {sports: [tennis], min_count: 1}
    public_pool: {venue_types: [swimming_pool], access: ["yes", permissive], min_count: 1}
    arts_centre: {venue_types: [arts_centre], min_count: 1}
    community_centre: {venue_types: [community_centre], min_count: 1}
    museum: {venue_types: [museum], min_count: 1}
  # 模型活动（每城同一套模板，标成模型方案）：费用 = 人工（OEWS 都会区中位时薪 × 老师小时 ÷ 人数 × 人工费用倍率）
  # + 场地（全国设定 × 小时 × RPP 总水平 ÷ 100）+ 器材或材料（全国设定 × 商品类空间换算系数）
  templates:
    - {template: group_fitness, category: fitness, venue: fitness_centre, soc: 39-9031, instructor_hours: 1, participants: 12,
       venue_per_participant_hour: 6, participation_hours: 1, overhead_hours: 0.75, label: 团体健身课（一次）,
       quality: 健身房的团体课 1 小时，往返与换衣约 45 分钟}
    - {template: yoga_class, category: fitness, venue: yoga, soc: 39-9031, instructor_hours: 1.25, participants: 10,
       venue_per_participant_hour: 6, participation_hours: 1.25, overhead_hours: 0.75, label: 瑜伽课（一次）,
       quality: 瑜伽馆的课 75 分钟，往返约 45 分钟}
    - {template: lap_swim, category: fitness, venue: public_pool, soc: 33-9092, instructor_hours: 1, participants: 15,
       venue_per_participant_hour: 3, participation_hours: 1, overhead_hours: 0.75, label: 公共泳池游泳（一次）,
       quality: 公共泳池游 1 小时（有救生员），往返与换衣约 45 分钟}
    - {template: tennis_rental, category: racket_sports, venue: tennis, venue_per_participant_hour: 10,
       rental_usd_2024_national: 5, requires: [racket_playable], kit_provides: [racket_playable],
       participation_hours: 1.5, overhead_hours: 1, label: 网球场地连球拍租借（一次）,
       quality: 场地 1.5 小时，含本次租的球拍；往返与换衣约 1 小时；结束后球拍要还}
    - {template: tennis_own, category: racket_sports, venue: tennis, venue_per_participant_hour: 10,
       requires: [racket_playable], participation_hours: 1.5, overhead_hours: 1, label: 网球场地（自带球拍，一次）,
       quality: 场地 1.5 小时，要自己带球拍；往返与换衣约 1 小时}
    - {template: guitar_lesson, category: music, venue: arts_centre, soc: 25-3021, instructor_hours: 1, participants: 4,
       venue_per_participant_hour: 4, requires: [guitar_playable], participation_hours: 1, overhead_hours: 0.75,
       label: 吉他小班课（一次）, quality: 四人小班 1 小时，要自己带吉他；往返约 45 分钟}
    - {template: guitar_practice, category: music, venue: null, participation_hours: 1, overhead_hours: 0,
       requires: [guitar_playable], free: true, label: 在家练吉他（一次 1 小时）, quality: 在家自己练，不收费；需要一把能弹的吉他}
