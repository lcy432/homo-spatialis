  - {cbsa: "31080", key: la, label: Los Angeles-Long Beach-Anaheim 都会区, city: 洛杉矶}
  - {cbsa: "41860", key: sf, label: San Francisco-Oakland-Fremont 都会区, city: 旧金山}
  - {cbsa: "16980", key: chi, label: Chicago-Naperville-Elgin 都会区, city: 芝加哥}
  - {cbsa: "26420", key: hou, label: Houston-Pasadena-The Woodlands 都会区, city: 休斯敦}
  - {cbsa: "42660", key: sea, label: Seattle-Tacoma-Bellevue 都会区, city: 西雅图}

# 词表（建议并入资料包的生活输入；现有合成样例的键都保留）
vocabulary:
  cuisines: [home_style, chinese, italian, mexican, japanese, indian, thai, korean, vietnamese, mediterranean]
  leisure_categories: [music, racket_sports, arts_culture, culinary, fitness]
  capabilities: [guitar_playable, racket_playable]
  enjoyment_functions: [personal_care]
  household_tasks: [laundry, cleaning]

# ============================================================================ 食品
food:
  # 篮子数量直接读 intake 的配置（configs/intake/us_v1.yaml 的 mapping.a_food.baskets，假设 food_basket_quantities_v1），
  # 价格读冻结库里本都会区的食材估计价（food.item.<cbsa>.<代码>，rpp_goods_spatial_adjustment@1）。
  intake_config: configs/intake/us_v1.yaml
  # 按热量补齐成完整的一周（规则 food_energy_completion_v1）：篮子自己的热量不够每周参照量时，差额用 complement 篮子按
  # “每千卡的花费”补上；篮子本身已经够就不补、不缩。热量 = 购买重量 × SR Legacy 每 100 克能量（不扣不可食部分，见 bias）。
  energy_reference_kcal_per_day: 2000
  complement_basket: staples_home
  # BLS AP 食材 → USDA FoodData Central SR Legacy（2018-04）条目。克数：单位原文写了克就用原文；“per doz.” 用 SR 的
  # “1 large” 克重 × 12；“per gal.” 用 SR 的 “1 quart” 克重 × 4（1 加仑 = 4 夸脱）。咖啡不计热量（冲泡饮品，不是食物热量）。
  item_energy:
    "701312": {fdc_id: "168877", note: 长粒白米（生、强化）}
    "701322": {fdc_id: "169736", note: 干意面（强化）}
    "702111": {fdc_id: "174924", note: 白面包}
    "706111": {fdc_id: "171047", note: 整鸡（肉、皮与内脏，生）}
    "708111": {fdc_id: "171287", per_unit: {portion: large, count: 12}, note: 大号鸡蛋一打}
    "709112": {fdc_id: "171265", per_unit: {portion: quart, count: 4}, note: 全脂牛奶一加仑}
    "711211": {fdc_id: "173944", note: 香蕉}
    "712112": {fdc_id: "170026", note: 土豆（连皮）}
    "712311": {fdc_id: "170457", note: 番茄}
    "714233": {fdc_id: "175199", note: 干豆（以斑豆为代表）}
    "703112": {fdc_id: "174036", note: 牛肉末（80/20，生）}
    FF1101: {fdc_id: "171077", note: 去骨去皮鸡胸（生）}
    "704212": {fdc_id: "168286", note: 去骨猪排（生）}
    FJ1101: {fdc_id: "171267", per_unit: {portion: quart, count: 4}, note: 低脂牛奶一加仑（以 2% 为代表）}
    "710212": {fdc_id: "173414", note: 切达奶酪}
    FJ4101: {fdc_id: "171284", note: 酸奶（原味全脂为代表）}
    "711311": {fdc_id: "169917", note: 脐橙}
    FL2101: {fdc_id: "169247", note: 罗马生菜}
    "717311": {zero_energy: true, note: 研磨咖啡：冲泡饮品，不计食物热量}
    "703613": {fdc_id: "168728", note: 西冷牛排（choice，生）}
    "711415": {fdc_id: "167762", note: 草莓}
  burden_per_hour: 0.5
  shopping_hours_per_week: 2
  # 自己做的完整方案：一个篮子、21 餐；新鲜餐数与每餐做饭分钟是设定（food_plan_composition_v1）
  home_plans:
    - {plan: home_staples, basket: staples_home, fresh_meals_per_week: 4, minutes_per_meal: 20,
       label: 自己做·主食为主, quality: 米面、整鸡、鸡蛋、土豆为主，按热量补齐到一个人一周的量}
    - {plan: home_varied, basket: varied_home, fresh_meals_per_week: 10, minutes_per_meal: 25,
       label: 自己做·荤素搭配, quality: 牛肉、鸡胸、奶酪、酸奶与蔬果搭配，不够的热量用主食补齐}
    - {plan: home_fresh, basket: fresh_protein_home, fresh_meals_per_week: 17, minutes_per_meal: 30,
       label: 自己做·鲜肉蔬果较多, quality: 鸡胸、牛排、草莓、生菜较多，不够的热量用主食补齐}
  # 家里做 + 外送 / 外食的混合方案：家里部分用 varied 篮子补齐后的一周费用 × 家里餐数 ÷ 21（food_home_share_by_meals_v1）
  mixed_plans:
    - {plan: cook_delivery, home_basket: varied_home, home_meals: 17, home_fresh: 8, minutes_per_meal: 25,
       out_mode: delivery, out_meals: 4, out_fresh: 4, label: 家里做 + 每周 4 顿外送}
    - {plan: cook_dine, home_basket: varied_home, home_meals: 14, home_fresh: 7, minutes_per_meal: 25,
       out_mode: dine_out, out_meals: 7, out_fresh: 7, label: 家里做 + 每周 7 顿外食}
  dining:
    # 每顿外食的平均花费 = CE 都会区每户“在外饮食”年支出（2023–24 名义）× CPI 换到 2024 年平均 ÷ 每户人数 ÷ 52 ÷ 每人每周外食餐数
    meals_away_per_person_week: 3
    dine_out_hours_per_meal: 1.25
    delivery_hours_per_meal: 0.25
    # 菜系只在本城 OSM 的 amenity=restaurant 里至少有 min_restaurants 家写了这个菜系标签时提供（只数 restaurant：旧金山只有这一类）
    min_restaurants: 20
    max_cuisines_per_city: 6
    osm_cuisine_tags:
      chinese: [chinese]
      italian: [italian]
      mexican: [mexican, tex-mex]
      japanese: [japanese, sushi, ramen]
      indian: [indian]
      thai: [thai]
      korean: [korean]
      vietnamese: [vietnamese]
      mediterranean: [mediterranean, greek, middle_eastern]
    cuisine_labels:
      chinese: 中餐
      italian: 意式
      mexican: 墨西哥菜
      japanese: 日料
      indian: 印度菜
      thai: 泰国菜
      korean: 韩国菜
      vietnamese: 越南菜
      mediterranean: 地中海菜
      home_style: 家常

# ============================================================================ 人工服务与享受
services:
  # OEWS 年薪 ÷ 2,080 = 时薪（BLS OEWS 的换算约定）；都会区中位数；价格 = 时薪 × 工人小时 × 人工费用倍率（labor_overhead_v1）
  hours_per_year: 2080
  labor_overhead_multiplier: 2.0
  chores:
    - {service: laundry_pickup, soc: 51-6011, worker_hours_per_month: 3, client_hours_per_month: 0,
       substitutes: {laundry: 2}, label: 洗衣取送（每周一次）,
       quality: 每周上门取送，洗、烘、叠由洗衣店完成；本人每月还要约 2 小时分拣、交接与收纳}
    - {service: cleaning_biweekly, soc: 37-2012, worker_hours_per_month: 6, client_hours_per_month: 0,
       substitutes: {cleaning: 4}, label: 上门保洁（每两周一次）,
       quality: 每两周上门打扫约 3 小时；两次之间本人每月还要约 4 小时日常整理}
    - {service: cleaning_weekly, soc: 37-2012, worker_hours_per_month: 10, client_hours_per_month: 0,
       substitutes: {cleaning: 2}, label: 上门保洁（每周一次）,
       quality: 每周上门打扫约 2.5 小时；本人每月还要约 2 小时日常整理}
  enjoyment:
    - {service: massage_studio_1, soc: 31-9011, sessions_per_month: 1, worker_hours_per_session: 1.25,
       client_hours_per_session: 1.5, burden_per_hour: 0.2, label: 按摩（店里，每月一次）,
       quality: 每月一次约 1 小时的放松按摩；往返约半小时}
    - {service: massage_studio_2, soc: 31-9011, sessions_per_month: 2, worker_hours_per_session: 1.25,
       client_hours_per_session: 1.5, burden_per_hour: 0.2, label: 按摩（店里，每月两次）,
       quality: 每月两次、每次约 1 小时的放松按摩；每次往返约半小时}
    - {service: massage_home_1, soc: 31-9011, sessions_per_month: 1, worker_hours_per_session: 2,
       client_hours_per_session: 1, burden_per_hour: 0.2, label: 上门按摩（每月一次）,
       quality: 按摩师上门，每月一次约 1 小时；按摩师的路上时间计进价格，本人不用出门}

# ============================================================================ 设备（ENERGY STAR 型号 + 类别设定）
devices:
  # 型号只用适用市场确定包括美国的（us、us_ca）；每个（类别 × 类型）取年耗电中位的型号作代表（并列取型号标识最小的）。
  # 价格是全国类别设定 × intake 的商品类空间换算系数；寿命、效果与故障都是类别设定（device_category_v1）。
  markets: [us, us_ca]
  offers:
    - {offer: washer_top, parts: [{category: clothes_washer, type: Top Load}], price_usd_2024_national: 700,
       lifetime_years: 10, substitutes: {laundry: 7}, label: 顶开洗衣机,
       quality: 自己洗，不用去洗衣店；还要晾干、叠放与收纳（每月约 7 小时）}
    - {offer: washer_front, parts: [{category: clothes_washer, type: Front Load}], price_usd_2024_national: 1000,
       lifetime_years: 10, substitutes: {laundry: 7}, label: 前开洗衣机,
       quality: 自己洗，不用去洗衣店；还要晾干、叠放与收纳（每月约 7 小时）}
    - {offer: pair_top_dryer, parts: [{category: clothes_washer, type: Top Load}, {category: clothes_dryer, type: Electric}],
       price_usd_2024_national: 1400, lifetime_years: 10, substitutes: {laundry: 4}, label: 顶开洗衣机 + 电烘干机一套,
       quality: 洗与烘都在家里；本人每月还要约 4 小时分拣、叠放与收纳}
    - {offer: pair_front_dryer, parts: [{category: clothes_washer, type: Front Load}, {category: clothes_dryer, type: Electric}],
       price_usd_2024_national: 1700, lifetime_years: 10, substitutes: {laundry: 4}, label: 前开洗衣机 + 电烘干机一套,
       quality: 洗与烘都在家里；本人每月还要约 4 小时分拣、叠放与收纳}
    - {offer: combo, parts: [{category: combo_washer_dryer, type: Front Load}], price_usd_2024_national: 1600,
       lifetime_years: 10, substitutes: {laundry: 4}, label: 洗烘一体机,
       quality: 一台机器洗完直接烘干；本人每月还要约 4 小时分拣、叠放与收纳}
  # 每个类别的故障设定（引擎的故障字段由主会话加；这里只作纯数据输出）。保修不是故障分布。
  failure:
    clothes_washer: {rule: none_within_horizon, annual_hazard: null,
                     basis: 没有公开的型号或类别故障率资料（ENERGY STAR 只有认证事实，保修条款不是故障分布）；设定寿命 10 年，3 年模拟期内不建模随机故障}
    clothes_dryer: {rule: none_within_horizon, annual_hazard: null,
                    basis: 同洗衣机：没有公开故障率资料，设定寿命 10 年，3 年模拟期内不建模随机故障}
    combo_washer_dryer: {rule: none_within_horizon, annual_hazard: null,
                         basis: 同洗衣机：没有公开故障率资料，设定寿命 10 年，3 年模拟期内不建模随机故障}
    dishwasher: {rule: none_within_horizon, annual_hazard: null,
                 basis: 洗碗机本轮不进目录（见 gaps）；同样没有公开故障率资料}
  # 不进目录的类别与原因（报告为缺口，不删记录）
  not_offered:
    dishwasher: 洗碗的时间在食品方案的“买菜、做饭与收拾”小时里，协议没有可以替代的“洗碗”家务，洗碗机的效果在 E1 里表达不了
    gas_dryer: 燃气烘干机要燃气接口，住房资料没有这项条件；本轮只用电烘干机
  installation_note: 住房资料（ACS）没有洗衣机接口与烘干机排风的条件；设备按“可以安装”设定（device_installable_v1），这是缺口

