# E3B（DECISIONS/0042）六城真实生活资料包的“物品与活动”一侧：完整食品方案、杂务服务、设备、享受型服务、爱好装备与活动。
# 编译代码在 src/product/realdata/life_items.py，说明在 docs/design/e3b-items-data.md。
#
# 数从哪来分三种，写在每一项旁边：
#   * 资料：intake-02 冻结库（构建身份见 intake_build_id）与原始文件缓存里的公开资料（BLS AP / CE / OEWS、BEA RPP、OSM、
#     ENERGY STAR、芝加哥公园管理局、USDA FoodData Central SR Legacy、BLS ATUS）；
#   * 规则：确定的换算（52 ÷ 12 周、OEWS 年薪 = 时薪 × 2,080、四舍五入到分）；
#   * 设定：下面 assumptions 里登记的探索设定（编号、性质、依据），在看任何 mock 结果之前写定；不是测量，不能据此排序真实城市。
# 语言模型不生成任何数：设定值是本配置作者写下、登记、可审阅的；代码只做确定的换算。

version: life-items-us-v1
intake_build_id: 562c32339bbae67fd1917b7ac67f4b5b28f55d07e88a8c78ee6fe371ed863691
numeraire: USD_2024_LOCAL
mapping_version: e3b-life-items-v1
#: 纯设定类机会的来源日期（配置写定的日子）
assumptions_written_on: 2026-10-23
metros:
