# E3B（DECISIONS/0042 决定 4）：六城的片区、通勤关系表与用车权。资料与编译，不改引擎。
#
# 分钟来自 ACS 2024 1 年期 PUMS 的人员记录（实际通勤者）；片区来自官方地理（2020 PUMA 与工作地 PUMA）；公交票价、油耗与用车
# 费用来自官方或公开网页的摘句。构建时离线核对（与 tax_rules 同一套）：摘句逐字出现在缓存的原始网页里（去掉标签、合并空白），
# 每个数都出现在它的摘句里；不过就阻断这一城的这种方式，不拿别的数顶替。速度是登记的探索设定（没有可用的观测来源）。
#
# 原始网页用 scripts/life_pack_commute.py fetch-costs 获取（显式联网），存在 data/raw/intake/<cache_source>/（不进仓库）。
# 所有金额是 2024 年当地价（USD_2024_LOCAL），三年都按 2024 年的票价与油价（固定实际价格情景）。

version: commute-us-v1
money_basis_id: USD_2024_LOCAL
pums_year: 2024

# intake-02 的冻结库：PUMS、划定与 PUMA 对应文件的指纹按它核对；通勤层与汽油价也从它读。
intake:
  build_id: 35667f4101a71c0e5ea6c1aaa8e5f45cd83c825d6b1393bde1104d3d571a96b7
  default_db: runs/intake/us-v1/work/freeze/35667f4101a71c0e/intake.sqlite

# 官方 PUMS 代码表（2020–2024 5 年期，与 2024 1 年期用同一套 2020 年工作地 PUMA）：县 → PUMA → 工作地 PUMA。
# 1 年期的代码表是旧式 .xls（没有读取它的依赖），5 年期是 .xlsx；构建时核对 2024 年资料里出现的工作地代码都在这张表里。
codelist:
  cache_source: census_acs_pums_codelists
  url: https://www2.census.gov/programs-surveys/acs/tech_docs/pums/code_lists/ACSPUMS2020_2024CodeLists.xlsx
  sha256: 634fdd565249d72f09a8f75d82fe4193b20a09d898ef64a4b8e8039348d52994
  sheet: Geography Lookup List

method:
  # 在职（ESR 1、2）、上周不在家工作（JWTRNS ≠ 11）、有通勤分钟（JWMNP > 0）的人。与 intake 的 commute_by_residence_puma@1 同一筛选。
  employed_esr: [1, 2]
  min_unweighted_n: 30
  roundtrip_factor: 2
  # 每格回退：住处 PUMA 格 → 同一通勤层的居民合并格 → 本城全部居住片区合并格 → 缺（这条线没有这种方式，不当 0 分钟）。
  # 合并格只给这些方式用，而且这条线本身至少要观测到 min_line_evidence 条用这种方式的记录：步行骑车的分钟强烈依赖距离，
  # 合并别处住得近的人会让远处的线也“步行 20 分钟”；这条线上一个用户都没有，说明多半没有这种服务。
  pooled_fallback_modes: [transit, drive]
  min_line_evidence: 1
  jwtrns_modes:
    "1": drive        # Car, truck, or van
    "2": transit      # Bus
    "3": transit      # Subway or elevated rail
    "4": transit      # Long-distance train or commuter rail
    "5": transit      # Light rail, streetcar, or trolley
    "6": transit      # Ferryboat
    "9": walk_bike    # Bicycle
    "10": walk_bike   # Walked
  jwtrns_not_modeled:
    "7": 出租车或网约车
    "8": 摩托车
    "12": 其他方式
  work_areas:
    rule: powpuma_share_v1
    # 在本城可支持的工作地（全部所在县都在都会区内、州在税的支持范围内）里，按流入在职者的加权人数排序；份额不低于它的
    # 工作地 PUMA 各成一个就业片区，其余合并成“其余工作地”。2020 年的工作地 PUMA 在这六个都会区都是按县（或县组）划的。
    own_area_min_share: 0.05

drive:
  requires_function: car_access
  speed_mph:
    value: 25
    assumption_id: drive_commute_speed_25mph
    statement: 开车通勤门到门的平均速度按每小时 25 英里估计里程（探索设定）；各城拥堵的差别只通过分钟进入，不按城市调速度
  mpg:
    value: 23.4
    cite:
      - {source: fhwa_vm1_2024, quote: "2024 Average miles traveled per gallon of fuel consumed 25.6 44.0 7.5 18.5 8.1 7.1 23.4 7.5 19.2"}
      - {source: fhwa_vm1_2024, quote: "2024 Interstate Rural 146,051 1,069 1,502 51,572 12,274 59,367 197,623 71,641 271,834"}
    note: FHWA VM-1（2024）第 7 列“全部轻型车”的每加仑英里数；列的位置用同表里程行核对：短轴距 146,051 + 长轴距 51,572 = 第 7 列 197,623
  car_access:
    opportunity_suffix: service.car_access
    annual:
      value: 8886
      cite:
        - {source: aaa_driving_costs_2024, quote: "This year, the total annual cost to drive a new vehicle 15,000 miles came out to $12,297"}
        - {source: aaa_driving_costs_2024, quote: "With thriftier price tags and higher fuel efficiency, insurance and gas cost less. Examples include the Honda Civic, Hyundai Elantra, and Toyota Corolla. ANNUAL COST: $8,886"}
    # 独立审核 F1（2026-10-23）：年度总费用里含 15,000 英里的油费，开车通勤又按次付油费——同一笔油费付了两次。月费只取
    # 非燃油部分；拆分用 AAA 同一份研究的小册子（小型轿车每英里油费），小册子的年度总费用 8,886 与官网相同
    annual_miles:
      value: 15000
      cite:
        - {source: aaa_driving_costs_2024, quote: "This year, the total annual cost to drive a new vehicle 15,000 miles came out to $12,297"}
    fuel_cents_per_mile:
      value: 11.12
      cite:
        - {source: aaa_ydc_brochure_2024, quote: "Small Sedan Medium Sedan Subcompact SUV Compact SUV (FWD) Medium SUV (4WD) Operating Costs fuel 11.12¢"}
        - {source: aaa_ydc_brochure_2024, quote: "Total Cost – 15k mi/yr operating cost $3,100 $3,515 $3,514 $3,534 $4,133 ownership cost $5,786 $7,042 $6,613 $7,122 $8,442 total cost per year $8,886"}
    derivation: 每月 = （小型轿车年度总费用 8,886 − 15,000 英里 × 11.12 美分 = 1,668 的油费）÷ 12 = 601.50
    assumption_id: car_access_aaa_small_sedan_non_fuel_2024
    statement: 用车权的月费 = AAA 2024 年小型轿车（新车、每年 15,000 英里）的年度总费用减去其中的油费，÷ 12（折旧、贷款利息、保险、登记与按 15,000 英里折算的保养）；全美平均，不分城市。油费只在开车通勤时按每次往返另付，同一笔油费不付两次

sources:
  mta_fares_2023: {cache_source: official_transit_fares_2024, publisher: Metropolitan Transportation Authority, url: "https://www.mta.info/press-release/reminder-new-fares-subway-buses-and-commuter-railroads-begin-aug-20"}
  lametro_fare_capping_2023: {cache_source: official_transit_fares_2024, publisher: Los Angeles County Metropolitan Transportation Authority, url: "https://www.metro.net/?p=81861"}
  sfmta_fares: {cache_source: official_transit_fares_2024, publisher: San Francisco Municipal Transportation Agency, url: "https://www.sfmta.com/fares"}
  cta_fare_chart: {cache_source: official_transit_fares_2024, publisher: Chicago Transit Authority, url: "https://www.transitchicago.com/fares/"}
  houston_metro_fares: {cache_source: official_transit_fares_2024, publisher: Metropolitan Transit Authority of Harris County, url: "https://www.ridemetro.org/fares/all-about-fares"}
  kcm_fare_change_2025: {cache_source: official_transit_fares_2024, publisher: King County Metro, url: "https://kingcountymetro.blog/2025/07/28/king-county-metro-water-taxi-and-seattle-streetcar-adult-fares-change-sept-1-2025/"}
  fhwa_vm1_2024: {cache_source: drive_costs_2024, publisher: Federal Highway Administration, url: "https://www.fhwa.dot.gov/policyinformation/statistics/2024/vm1.cfm"}
  aaa_driving_costs_2024: {cache_source: drive_costs_2024, publisher: AAA (Automobile Club of Southern California), url: "https://www.ace.aaa.com/content/ace-www/en/automotive/advocacy/cost-of-driving.html"}
  # AAA 2024 Your Driving Costs 小册子（PDF）。AAA 官网没有这一年的分项表；这份是行业媒体 Repairer Driven News 转载的 AAA 原件，
  # 年度总费用 8,886 与官网一致。正文按 PDF 字面字符串读出，摘句去掉空白后核对
  aaa_ydc_brochure_2024: {cache_source: drive_costs_2024, publisher: AAA（Your Driving Costs 2024 小册子；Repairer Driven News 转载的副本）, url: "https://www.repairerdrivennews.com/wp-content/uploads/2024/08/YDC-Brochure-FINAL-9.2024.pdf", format: pdf}

