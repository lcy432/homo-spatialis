menus:
  algorithm: weighted_keyed_sample
  algorithm_version: "1"
  env_repeats: 2
  years: [1, 2, 3]
  policies:
    # 住房的候选池是完整加权经验支持表（每个目标格一条），这里只列出；年度接触菜单在 E3B 资料包里从完整可执行池按 60 个抽
    housing: {kind: full_catalog}
    jobs: {kind: annual_exposure_sample, strata_key: soc_major, size: 30}
    training: {kind: calendar_open}
    food: {kind: full_catalog}
    goods: {kind: full_catalog}
    activities: {kind: calendar_open}
    background: {kind: full_catalog}
  size_diagnostic:
    repeats: 20
