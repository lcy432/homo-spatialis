# 门一：产品前提。零大模型调用。
#
# 判据（§9.1.1.1）：在福利离散度高于 τ 的选择集上，L_rep 的中位数是否超过
# §9.3 的噪声地板。若在任何现实可构造的选择集上都不超过 → 判定个人化在本
# 装置上不可测量，停下来报告。
#
# **本文件必须在跑之前 commit**（硬规则 20）。事后调阈值等于没有阈值。
# 这里的每一个数都是预注册的判据，不是可调参数。

meta:
  gate: one
  criterion_source: "README §9.1.1.1"
  status: DRAFT            # 经确认后改成 PREREGISTERED 并 commit，然后才跑
  llm_calls: 0

# ---------------------------------------------------------------------------
# τ 梯子：不是单点，是一条曲线
# ---------------------------------------------------------------------------
#
# 门一只需要问"是否**存在**现实可构造的 τ 让 L_rep 超过地板"，但 §1.2 问题三
# 本来就要"信噪比随选择集变化"这条曲线，两者用同一批数据。
#
# 目标量是 ln_welfare_dispersion（硬规则 27：规范形式是 ln V，不是美元）。
# 参考量级：随机生成的世界对典型人设给出的离散度在 0.3 附近。梯子跨了大约
# 一个数量级，两端都超出典型值，这样"低于 τ 时不成立"这半句话才有内容。
#
# P5 的求解器能精确达成任意目标（残差 1e-16），所以这些不是"分组的边界"，
# 是**构造出来的世界**：每一档只在离散度上不同，排序完全相同（缩放是仿射
# 且斜率为正）。分组比较因此不会把"题目本身换了"当成信号。
tau_ladder:
  quantity: ln_welfare_dispersion
  values: [0.05, 0.10, 0.20, 0.40]
  # 某些人设在某些档上无解（P5 会报 TargetInfeasibleError）。**不得静默丢弃**：
  # 掉出去的人设与权重结构相关，是非随机缺失。每一档的可行人设数进产出。
  on_infeasible: report_and_exclude

# ---------------------------------------------------------------------------
# 噪声地板：问卷粒度诱导的 EV 变动
# ---------------------------------------------------------------------------
perturbation:
  # §9.3：每维 ±5 分。这个数来自定和量表的粒度，所以判据有依据、不是拍的。
  cap_points: 5.0

  # **总和守恒**。定和量表是一百分的分配，"每维独立 ±5"会让总分漂移，
  # 那不是这份问卷可能产生的答卷。
  constant_sum: true

  # 抽样方法：平移到 u_k = δ_k + L_k ≥ 0，约束 Σu = ΣL_k，从
  # Dirichlet(1,…,1) 缩放得到的均匀单纯形上抽，超出上界则拒绝。
  # 从均匀超集上拒绝采样，得到的是目标多面体上的**精确均匀**分布。
  # 实测接受率 20%（对称情形），每个有效样本约 5 次抽取。
  #
  # 不用"方体上抽再减均值"的投影法：它不是均匀的，而且越界率还更高（22.6%）。
  sampler: uniform_polytope_rejection

  # 零边界处理。某一维只有 2 分时，−5 会让权重变成负数。
  # 下界取 min(cap, 该维当前分数)，上界仍是 cap。
  #
  # 这不是数值补丁，是实质上更对：给休闲打了 2 分的人，本来就可能给 0 到 7，
  # 不可能给 −3。边界附近的不确定性天然是单侧的。
  #
  # **后果要记住**：小维度的扰动均值为正，总和守恒又迫使别处补偿，所以扰动
  # 不是零均值的。这是问卷的真实性质，不是抽样的偏差。
  lower_bound: "min(cap_points, current_points)"

  draws_per_persona: 32

  # 两级中位数，不是池化。
  #   每个人设：32 次扰动诱导的 EV 变动的中位数  → 这个人的噪声地板
  #   跨人设：  上述值的中位数                    → 报告的噪声地板
  # 池化会让"扰动敏感"的人设按次数加权，而 L_rep 那一侧是一人一个数。
  # 两侧都做成"跨人设的中位数（人设内的某个量）"，才可比。
  aggregation: median_within_then_across

# ---------------------------------------------------------------------------
# 三条基准线（C1）。全部在真值参数下评价，只有 argmax 用近似参数。
# ---------------------------------------------------------------------------
#
# 硬规则 13：若用近似参数同时做选择和评价，算出的是自洽的胡话而不是损失。
baselines:
  evaluate_with: true_params_always
  argmax_with: approximate_params

  # w_mat = (1,0,0,0,0,0,0)：现状的生活成本计算器没有偏好权重维度，
  # 只按实际收入排序。s̄ 是代表性篮子。两者是**两个不同的近似**，
  # 不能混为一谈（§1.2 问题二）。
  definitions:
    L_rep:   { shares: representative, weights: material_only }
    L_s:     { shares: representative, weights: true }
    L_amen:  { shares: true,           weights: material_only }

  # L_s + L_amen ≠ L_rep（argmax 不可加）。三项分别报，不要相加。
  additive: false

# ---------------------------------------------------------------------------
# 样本
# ---------------------------------------------------------------------------
sample:
  n_personas: 1000
  persona_seed: 20260906
  world_seed: 20260906
  n_cities: 12

  # **不分层。** P10 的分层服务的是条件层面的量（proj 对 d 的斜率、r(d)），
  # 而门一是一个**人口层面**的中位数。按 §11.9.2，人口层面的陈述要用抽样
  # 权重还原到真实边际分布——不分层就是那个边际分布本身，无需还原。
  # 在这里分层反而要多一步加权，多一处出错的地方。
  stratified: false

  # 抽样分布：物质维 α₁=1.5，六个舒适度维 α=0.5（DECISIONS/0006）。
  dirichlet_material_alpha: 1.5
  dirichlet_amenity_alpha: 0.5

# ---------------------------------------------------------------------------
# 判据
# ---------------------------------------------------------------------------
decision:
  # 门一通过 ⟺ 梯子上**存在**某一档，其 median(L_rep) 的置信区间下沿
  # 严格超过噪声地板。
  #
  # 要求置信下沿而不是点估计：中位数超过地板可能只是抽样噪声，而这个门的
  # 结论是"要不要重新定位整个项目"。
  rule: exists_rung_with_ci_lower_bound_above_floor
  confidence: 0.95
  bootstrap:
    method: percentile
    resamples: 2000
    unit: persona
    # 注意这**不是**硬规则 22 说的 block bootstrap。那一条针对的是
    # ŵ_i = γ_k/γ_0 这类比值估计量在整条流水线上的传播。这里是一个
    # 跨人设的普通中位数，重抽人设即可。

  # 不通过时的动作：停，报告，不要自行放宽 τ 或加大 cap_points。
  on_fail: stop_and_report

# ---------------------------------------------------------------------------
# 必须写进 runs/<run_id>/ 的产出
# ---------------------------------------------------------------------------
outputs:
  path: "runs/{run_id}/gate_one.json"
  required_fields:
    - noise_floor_usd                    # 地板本身
    - per_rung:                          # 每一档一条
        - tau
        - n_personas_feasible            # 无解的被排除了多少（非随机缺失）
        - n_personas_money_metric_missing  # 货币度量落在语义区间外的（硬规则 27）
        - median_L_rep_usd
        - ci_lower_usd
        - ci_upper_usd
        - median_L_s_usd
        - median_L_amen_usd
        - passes
    - verdict                            # pass / fail
    - config_sha                         # 本文件的哈希，证明判据是事前的
