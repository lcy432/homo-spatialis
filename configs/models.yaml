# The two base models under test (README §10.4: different family, different
# country of origin). Keys are never stored here -- only the name of the
# environment variable to read them from.
#
# `model` must be a dated snapshot ending in -YYYY-MM-DD or -YYYYMMDD.
# CLAUDE.md hard rule 6: rolling aliases such as `qwen-plus` are rejected at
# load time, because a run logged against a moving alias cannot be reproduced.
# Leaving `model` null is allowed; resolving that role then fails loudly.

base_a:
  provider: TBD
  base_url: TBD
  api_key_env: BASE_A_API_KEY
  model: null
  note: >-
    Frontier model, not yet chosen. Fill provider, base_url and a dated snapshot
    when picked. The adapter is vendor-neutral, so nothing else changes.

base_b:
  provider: dashscope
  base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
  api_key_env: DASHSCOPE_API_KEY
  model: qwen3.7-max-2026-06-08
  note: >-
    Qwen via the DashScope OpenAI-compatible endpoint. Connectivity verified
    2026-09-02 against the China-region endpoint; 250 models visible to the key.
    Max tier rather than plus, so that base A and base B sit in comparable
    capability tiers -- README 10.4 makes the base model a treatment variable,
    and a family/origin contrast confounded with a capability-tier contrast
    would not be interpretable. Switch to qwen3.7-plus-2026-05-26 if the call
    budget requires it, but then pick a comparable tier for base A too.
